async function onAqToolChange(){
  const sel = document.getElementById('aq-tool');
  const ruleBox = document.getElementById('aq-rule');
  aqTool = sel ? sel.value : '';
  if(!ruleBox) return;
  if(!aqTool){ ruleBox.style.display = 'none'; return; }
  const f = currentAnchorFlow();
  const prep = prepContext(f);
  const t = (prep.tools||[]).find(x=>x.id===aqTool);
  if(!t || !t.name){ ruleBox.style.display = 'none'; return; }
  try{
    const r = await pywebview.api.get_tool_rule(t.name);
    if(r && r.ok && r.text){
      ruleBox.style.display = 'block';
      ruleBox.innerHTML = `<div class="sub" style="font-weight:600">📋 规则说明</div><pre style="white-space:pre-wrap;font-size:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px;max-height:220px;overflow:auto">${esc(r.text)}</pre>`;
    } else {
      ruleBox.style.display = 'none';
    }
  }catch(e){ ruleBox.style.display = 'none'; }
}

async function startAnchorQuery(){
  const f = currentAnchorFlow(), w = currentAnchorWorkItem();
  if(!f || !w) return;
  if(!aqTool){ toast('请选择查询规则（工具版本）'); return; }
  const prep = prepContext(f);
  const tool = (prep.tools||[]).find(x=>x.id===aqTool);
  if(!tool){ toast('工具不存在'); return; }
  const codes = Array.from(anchorChecked);
  if(!codes.length){ toast('没有勾选的 itemcode'); return; }
  const btn = document.getElementById('aq-start');
  function busy(b){ if(btn){ btn.disabled = b; btn.textContent = b ? '⏳ 查询中…' : '▶ 开始查询'; } }
  busy(true);
  // 复用「作业准备」的参数生成逻辑：itemcode 清单 = 当前锚点勾选的 itemcode
  const prepArgs = await buildPrepToolArgs(tool);
  if(prepArgs.missing && prepArgs.missing.length){
    busy(false);
    showError('查询缺少必要输入', prepArgs.missing.join('、'));
    return;
  }
  let res = null;
  try{ res = await pywebview.api.run_tool(tool.name, prepArgs.args); }
  catch(e){ res = {ok:false, log:String(e)}; }
  if(!res || !res.ok){ busy(false); showError('查询失败', (res && res.log) || '未知错误'); return; }
  const out = (res.outputs||[]).find(o=>/物料余量查询结果/.test(o.name||'')) || (res.outputs||[])[0];
  if(!out){ busy(false); showError('查询工具未产生结果文件', '工具未输出「物料余量查询结果.xlsx」。\n\n工具日志：\n' + (res.log || '（无输出）')); return; }
  let table = null;
  try{ table = await pywebview.api.read_table(out.rel); }catch(e){}
  if(!table || !table.ok){ busy(false); showError('读取查询结果失败', (table && table.error) || '未知'); return; }
  aqResult = parseAqResult(table);
  aqChoices = {};
  busy(false);
  renderAqResult();
}

function aqCell(d, key){
  if(d[key] !== undefined && d[key] !== null) return String(d[key]);
  const nk = key.replace(/[\s_.\-]/g,'').toLowerCase();
  for(const k in d){ if(k.replace(/[\s_.\-]/g,'').toLowerCase() === nk) return String(d[k]); }
  return '';
}

// 查询结果固定 9 列（顺序与后端输出一致：库存余量查询工具 RESULT_FINAL_HEADERS）
const AQ_COLS = [
  {key:'itemcode', label:'itemcode'},
  {key:'goodsAge', label:'货龄'},
  {key:'aviQty', label:'Avi Qty'},
  {key:'sub', label:'Sub'},
  {key:'contractNumber', label:'contractNumber'},
  {key:'remain', label:'余量'},
  {key:'projCode', label:'Project Code'},
  {key:'erpOrg', label:'Erp.org'},
  {key:'financialCode', label:'产品编码'},
];

function parseAqResult(table){
  const headers = table.headers || [];
  const rows = table.rows || [];
  const byItem = {};
  const order = [];
  for(const d of rows){
    const itemcode = aqCell(d, 'itemcode').trim();
    if(!itemcode) continue;
    const rec = {
      itemcode: itemcode,
      goodsAge: aqCell(d, 'goodsAge'),
      aviQty: aqCell(d, 'Avi Qty'),
      sub: aqCell(d, 'Sub'),
      contractNumber: aqCell(d, 'contractNumber'),
      remain: aqCell(d, '余量'),
      projCode: aqCell(d, 'Project Code'),
      erpOrg: aqCell(d, 'Erp.org'),
      financialCode: aqCell(d, '产品编码'),
    };
    if(!byItem[itemcode]){ byItem[itemcode] = []; order.push(itemcode); }
    byItem[itemcode].push(rec);
  }
  return {headers, rows, byItem, order};
}

function aqGroupId(i){ return 'aq-g-'+i; }
function aqBodyId(i){ return 'aq-b-'+i; }
function aqChosenId(i){ return 'aq-c-'+i; }
function aqTableId(i){ return 'aq-t-'+i; }

function pickAqContract(itemcode, idx){
  const recs = (aqResult && aqResult.byItem && aqResult.byItem[itemcode]) || [];
  const rec = recs[idx];
  if(!rec) return;
  const prev = aqChoices[itemcode];
  const i = (aqResult && aqResult.order) ? aqResult.order.indexOf(itemcode) : -1;
  // 单选：点击已选中的那一条 = 取消选择（支持完全不选）；否则选中该条
  if(prev && prev.idx === idx){
    delete aqChoices[itemcode];
    const el = document.getElementById('aq-qty-'+i+'-'+idx);
    if(el) el.value = '';
  } else {
    aqChoices[itemcode] = { contractNumber: rec.contractNumber, financialCode: rec.financialCode, idx: idx, useQty: '' };
    // 单选：清空同 itemcode 其他行的「选择数量」输入框
    recs.forEach((r, ri)=>{
      if(ri !== idx){
        const oe = document.getElementById('aq-qty-'+i+'-'+ri);
        if(oe) oe.value = '';
      }
    });
  }
  refreshAqChoice(itemcode);
}

function refreshAqChoice(itemcode){
  const i = (aqResult && aqResult.order) ? aqResult.order.indexOf(itemcode) : -1;
  if(i < 0) return;
  const cur = aqChoices[itemcode];
  const chosenEl = document.getElementById(aqChosenId(i));
  if(chosenEl) chosenEl.textContent = (cur && cur.contractNumber) ? ('✓ 已选合同：'+cur.contractNumber) : '';
  const cntEl = document.getElementById('aq-chosen-count');
  if(cntEl) cntEl.textContent = Object.keys(aqChoices).length;
  const recs = aqResult.byItem[itemcode] || [];
  const tb = document.getElementById(aqTableId(i));
  if(!tb) return;
  const rows = tb.querySelectorAll('tr.aq-row');
  rows.forEach((tr, idx)=>{
    const rec = recs[idx];
    if(!rec) return;
    const sel = cur && cur.idx === idx;
    tr.classList.toggle('aq-sel-row', !!sel);
    const btn = tr.querySelector('.aq-pick');
    if(btn){
      btn.textContent = sel ? '✓ 已选' : '选';
      btn.classList.toggle('btn-primary', !!sel);
      btn.classList.toggle('btn-ghost', !sel);
    }
  });
}

function aqUseLimit(mat, rec){
  // 选择数量上限 = 余量（不再取 Avi Qty / 需求数量的共同最小值）
  const remain = parseFloat(rec && rec.remain);
  if(!isNaN(remain) && remain >= 0) return remain;
  return null;
}

function setAqQty(i, idx, val){
  const itemcode = (aqResult && aqResult.order) ? aqResult.order[i] : null;
  if(itemcode == null) return;
  const recs = (aqResult && aqResult.byItem && aqResult.byItem[itemcode]) || [];
  const rec = recs[idx];
  if(!rec) return;
  const mat = ((anchorData && anchorData.materials) || []).find(x=>x.itemcode===itemcode) || {};
  const limit = aqUseLimit(mat, rec);
  const raw = String(val).trim();
  const el = document.getElementById('aq-qty-'+i+'-'+idx);
  if(raw === ''){
    if(aqChoices[itemcode] && aqChoices[itemcode].idx === idx){
      delete aqChoices[itemcode];
      refreshAqChoice(itemcode);
    }
    return;
  }
  const v = parseFloat(raw);
  if(isNaN(v) || v < 0){
    toast('选择数量不合法');
    if(el) el.value = '';
    return;
  }
  if(limit !== null && v > limit){
    toast('数量不符合：余量 ' + (rec.remain||'') + '，最多填 ' + limit);
    if(el) el.value = '';
    return;
  }
  aqChoices[itemcode] = { contractNumber: rec.contractNumber, financialCode: rec.financialCode, idx: idx, useQty: raw };
  recs.forEach((r, ri)=>{
    if(ri !== idx){
      const oe = document.getElementById('aq-qty-'+i+'-'+ri);
      if(oe) oe.value = '';
    }
  });
  refreshAqChoice(itemcode);
}

function toggleAqGroup(i){
  const itemcode = (aqResult && aqResult.order) ? aqResult.order[i] : null;
  if(itemcode == null) return;
  aqExpanded[itemcode] = !aqExpanded[itemcode];
  const body = document.getElementById(aqBodyId(i));
  const head = document.getElementById(aqGroupId(i));
  if(body) body.style.display = aqExpanded[itemcode] ? 'block' : 'none';
  if(head){ const c = head.querySelector('.aq-caret'); if(c) c.textContent = aqExpanded[itemcode] ? '▾' : '▸'; }
}

function projMatched(matProject, projCode){
  // 判断查询结果的 Project Code 是否命中「可用项目合同」（如 "99Z0AAA/99Z0BBB"）
  if(!projCode || !matProject) return false;
  const p = String(projCode).trim();
  if(!p) return false;
  const parts = String(matProject).split(/[\/,，;；\s]+/).map(s=>s.trim()).filter(Boolean);
  if(parts.some(x=>x.toUpperCase() === p.toUpperCase())) return true;
  return String(matProject).toUpperCase().indexOf(p.toUpperCase()) >= 0;
}

function subMatched(matSiteType, sub){
  // 判断物料的 SiteStype 是否命中查询结果的 Sub（"FTK&NSB" 命中 "FTK"/"NSB"，"Small cell" 命中 "Small Cell"）
  if(!matSiteType || !sub) return false;
  const s = String(sub).trim();
  if(!s) return false;
  const parts = String(matSiteType).split(/[&\/,，;；\s]+/).map(x=>x.trim()).filter(Boolean);
  if(parts.some(x=>x.toUpperCase() === s.toUpperCase())) return true;
  return String(matSiteType).toUpperCase().indexOf(s.toUpperCase()) >= 0;
}

function renderAqResult(){
  const m = aqModalEl;
  if(!m || !aqResult) return;
  const mats = (anchorData && anchorData.materials) || [];
  const matMap = {};
  mats.forEach(x=>{ matMap[x.itemcode] = x; });
  const order = aqResult.order;
  const chosenCount = Object.keys(aqChoices).length;
  // 勾选但查不到结果的 itemcode → 提示「当前item无可用合同」
  const missingCodes = Array.from(anchorChecked).filter(c => !aqResult.byItem[c]);
  let groups = '';
  order.forEach((itemcode, i)=>{
    const recs = aqResult.byItem[itemcode] || [];
    const mat = matMap[itemcode] || {};
    const cur = aqChoices[itemcode];
    const typeIsMain = /type\s*1/i.test(mat.type || '');
    const needQty = (mat.qty !== undefined && mat.qty !== null && mat.qty !== '') ? mat.qty : '';
    const tag = typeIsMain
      ? '<span class="aq-tag" style="background:#e0edff;color:#1d4ed8">主设备</span>'
      : '<span class="aq-tag" style="background:#ffe4e6;color:#dc2626">辅料 · 不生成CPQ可导入文件</span>';
    const chosenTxt = (cur && cur.contractNumber) ? ('✓ 已选合同：'+cur.contractNumber) : '';
    const expanded = !!aqExpanded[itemcode];
    let rowsHtml = recs.map((r, idx)=>{
      const sel = cur && cur.contractNumber === r.contractNumber;
      const hit = projMatched(mat.project, r.projCode) && subMatched(mat.sitestype, r.sub);
      const limit = aqUseLimit(mat, r);
      const cells = AQ_COLS.map(c=>{
        const val = r[c.key];
        return `<td>${esc(val)}</td>`;
      }).join('');
      const qtyVal = (sel && cur) ? (cur.useQty || '') : '';
      return `<tr class="aq-row${sel?' aq-sel-row':''}"${hit?' style="background:#eef2ff"':''}>
        <td class="no-sel" style="width:64px"><button class="btn ${sel?'btn-primary':'btn-ghost'} btn-sm aq-pick" data-i="${i}" data-idx="${idx}">${sel?'✓ 已选':'选'}</button></td>
        ${cells}
        <td class="no-sel" style="width:96px"><input id="aq-qty-${i}-${idx}" type="number" min="0" ${limit!==null?`max="${limit}"`:''} step="1"
          value="${esc(qtyVal)}" placeholder="${limit!==null?('≤ '+limit):''}"
          onclick="event.stopPropagation()" onchange="setAqQty(${i}, ${idx}, this.value)"
          style="width:80px;padding:2px 6px;border:1px solid #c7d2fe;border-radius:6px;font-size:12px"></td>
      </tr>`;
    }).join('');
    groups += `<div class="aq-group" id="${aqGroupId(i)}" style="margin-bottom:10px;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden">
      <div class="aq-group-head" onclick="toggleAqGroup(${i})" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f8fafc;cursor:pointer">
        <span class="aq-caret">${expanded?'▾':'▸'}</span>
        <span style="font-weight:600">${esc(itemcode)}</span>
        ${needQty!==''?`<span class="aq-need" style="background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:10px;font-size:12px">需求数量 <b>${esc(needQty)}</b></span>`:''}
        ${tag}
        <span class="aq-chosen" id="${aqChosenId(i)}" style="margin-left:auto;font-size:12px;color:#16a34a;font-weight:600">${esc(chosenTxt)}</span>
      </div>
      <div class="aq-group-body" id="${aqBodyId(i)}" style="display:${expanded?'block':'none'}">
        <table class="pv-table copyable" id="${aqTableId(i)}" style="width:100%">
          <tr><th class="no-sel" style="width:64px"></th>${AQ_COLS.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th class="no-sel" style="width:96px">选择数量</th></tr>
          ${rowsHtml || `<tr><td colspan="${AQ_COLS.length+2}" class="sub">无候选记录</td></tr>`}
        </table>
      </div>
    </div>`;
  });
  // 勾选但查不到结果的 itemcode：显示「当前item无可用合同」
  missingCodes.forEach((itemcode, mi)=>{
    const mat = matMap[itemcode] || {};
    const needQty = (mat.qty !== undefined && mat.qty !== null && mat.qty !== '') ? mat.qty : '';
    groups += `<div class="aq-group" style="margin-bottom:10px;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden">
      <div class="aq-group-head" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f8fafc">
        <span style="font-weight:600">${esc(itemcode)}</span>
        ${needQty!==''?`<span class="aq-need" style="background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:10px;font-size:12px">需求数量 <b>${esc(needQty)}</b></span>`:''}
        <span class="sub" style="font-size:12px;color:#94a3b8">当前item无可用合同</span>
      </div>
    </div>`;
  });
  m.innerHTML = `<div class="modal" style="width:860px;max-height:88vh;display:flex;flex-direction:column">
    <div class="modal-head">
      <span class="aq-duid" onclick="copyAqDuid()" title="点击复制 DU 名称">📋 ${esc(aqDuid || 'DU')}</span>
      <span class="modal-head-actions">
        <button class="btn btn-ghost btn-sm" onclick="aqMinimize()">— 最小化</button>
        <button class="btn btn-ghost btn-sm" onclick="aqClose()">✕ 关闭</button>
      </span>
    </div>
    <h3>🔍 查询结果 <span class="sub">${order.length + missingCodes.length} 个 itemcode · 已选 <span id="aq-chosen-count">${chosenCount}</span> 个合同</span></h3>
    <div style="color:#64748b;font-size:12px;margin:2px 0 6px">💡 每个物料点「选」单选一个合同（再点已选行可取消）；表内可拖选单元格 Ctrl+C 复制</div>
    <div id="aq-scroll" style="flex:1;overflow:auto;padding-right:4px">${groups || '<div class="sub">无查询结果</div>'}</div>
    <div class="btn-row" style="margin-top:10px;border-top:1px solid #e2e8f0;padding-top:10px">
      <button class="btn btn-primary" id="aq-confirm" onclick="confirmAnchorQuery()">✅ 确认使用 → 生成 CPQ 表</button>
      <button class="btn btn-ghost" onclick="renderAqConfig()">← 返回</button>
      <button class="btn btn-ghost" onclick="aqClose()">关闭</button>
    </div>
  </div>`;
  // 给每个结果表绑定「拖选复制」
  order.forEach((itemcode, i)=>{
    const tb = document.getElementById(aqTableId(i));
    if(tb) enableRangeSelect(tb);
  });
  // 「选」按钮事件委托（避免 onclick 里嵌 itemcode 的转义问题）
  const scroll = document.getElementById('aq-scroll');
  if(scroll){
    scroll.onclick = function(e){
      const pick = e.target.closest('.aq-pick');
      if(!pick) return;
      const i = parseInt(pick.dataset.i, 10);
      const idx = parseInt(pick.dataset.idx, 10);
      const ic = (aqResult && aqResult.order) ? aqResult.order[i] : null;
      if(ic != null) pickAqContract(ic, idx);
    };
  }
}

async function confirmAnchorQuery(){
  const f = currentAnchorFlow(), w = currentAnchorWorkItem();
  if(!f || !w) return;
  const mats = (anchorData && anchorData.materials) || [];
  const matMap = {};
  mats.forEach(x=>{ matMap[x.itemcode] = x; });
  const selections = [];
  const remarkUpdates = [];
  for(const itemcode of Object.keys(aqChoices)){
    const choice = aqChoices[itemcode];
    const mat = matMap[itemcode] || {};
    const useQty = (choice.useQty !== undefined && choice.useQty !== null && String(choice.useQty).trim() !== '')
      ? choice.useQty : mat.qty;
    selections.push({
      itemcode: itemcode,
      contractNumber: choice.contractNumber || '',
      financialCode: choice.financialCode || '',
      qty: useQty || '',
      type: mat.type || '',
    });
    const need = parseFloat(mat.qty);
    const used = parseFloat(useQty);
    if(!isNaN(need) && !isNaN(used)){
      const remain = Math.max(0, need - used);
      remarkUpdates.push({ itemcode: itemcode, remark: '已使用生成 ' + used + ' 个，还有 ' + remain + ' 个待完成' });
    }
  }
  if(!selections.length){ toast('还没有选择任何合同'); return; }
  const btn = document.getElementById('aq-confirm');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ 生成中…'; }
  let r = null;
  try{ r = await pywebview.api.gen_anchor_cpq(f.id, w.id, selections); }catch(e){ r = {ok:false, error:String(e)}; }

async function rerunNodes(stepIds){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  if(!f) return;
  const ids = new Set(stepIds);
  ids.forEach(id => delete pendingEvidence[id]);  // 清掉选中节点的未保存举证
  let earliest = null;
  const stepObjs = [];
  for(const s of (f.steps||[])){
    if(ids.has(s.id) && (!earliest || (s.seq||0) < (earliest.seq||0))) earliest = s;
    if(ids.has(s.id)) stepObjs.push({seq:s.seq, name:s.name});
  }
  // 任务锚点节点被重跑：清空该 DU 的锚点清单状态/替换，让清单刷新到重跑后的新结果
  const hasAnchorStep = (f.steps||[]).some(s => ids.has(s.id) && s.anchor);
  const affectedWorkIds = [];
  if(workView === 'flow' && currentBatchId){
    const b = (f.batches||[]).find(x=>x.id===currentBatchId);
    if(b){
      for(const w of (f.workItems||[]).filter(w=>w.batchId===b.id)){
        w.doneStepIds = (w.doneStepIds||[]).filter(x=>!ids.has(x));
        w.records = (w.records||[]).filter(r=>!ids.has(r.stepId));
        if(hasAnchorStep){ delete w.materials; delete w.replacements; affectedWorkIds.push(w.id); }
        w.updatedAt = nowStr();
      }
      workDoneSet = batchCommonDone(f, b);
    }
    try{ await pywebview.api.clear_step_archive(stepObjs, currentBatchId, null); }catch(e){}
  } else if(workView === 'item' && currentWorkItemId){
    const w = (f.workItems||[]).find(x=>x.id===currentWorkItemId);
    if(w){
      w.doneStepIds = (w.doneStepIds||[]).filter(x=>!ids.has(x));
      w.records = (w.records||[]).filter(r=>!ids.has(r.stepId));
      if(hasAnchorStep){ delete w.materials; delete w.replacements; affectedWorkIds.push(w.id); }
      w.updatedAt = nowStr();
      workDoneSet = new Set(w.doneStepIds);
      try{ await pywebview.api.clear_step_archive(stepObjs, null, w.duid); }catch(e){}
    }
  }
  if(hasAnchorStep){
    anchorData = null; anchorLoadedFor = null;   // 清前端锚点缓存，重跑后重新加载
    if(affectedWorkIds.length){
      try{ await pywebview.api.clear_du_state(currentFlowId, affectedWorkIds); }catch(e){}
    }
  }
  if(earliest) selectedStepId = earliest.id;
  await saveData();
  render();
  toast('✅ 已清空 '+stepIds.length+' 个节点结果及归档'+(earliest?'，从「'+earliest.name+'」继续':''));
}
async function completeWorkStep(workItemId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  const w = (f.workItems||[]).find(x=>x.id===workItemId);
  if(!w) return;
  const curId = currentStepId(f);
  if(!curId){ toast('🎉 该 DUID 已全部完成'); return; }
  const s = f.steps.find(x=>x.id===curId);
  // 归档本步产出文件（输入文件 + 输出结果 + 截图）
  const files = collectStepFiles(f, s);
  if(files.length){
    try{ await pywebview.api.archive_work_files(w.duid, s.seq, s.name, files); }catch(e){ toast('归档警告：'+e); }
  }
  // 操作举证：粘贴的截图随「完成本步」保存到该 DU 归档
  if(pendingEvidence[curId]){
    try{ await pywebview.api.save_evidence([w.duid], s.seq, s.name, pendingEvidence[curId]); }catch(e){ toast('举证保存失败：'+e); }
    delete pendingEvidence[curId];
  }
  w.doneStepIds = w.doneStepIds || [];
  if(!w.doneStepIds.includes(curId)) w.doneStepIds.push(curId);
  w.records = w.records || [];
  w.records.push({seq:s.seq, stepId:s.id, stepName:s.name, doneAt:nowStr(), files:files.map(x=>x.name)});
  w.updatedAt = nowStr();
  workDoneSet = new Set(w.doneStepIds);
  // 完成后推进到下一个节点（对齐批次作业 completeBatchStep 的 selectedStepId 推进逻辑）
  const nextId = currentStepId(f);
  selectedStepId = nextId || curId;
  await saveData();
  render();
  toast('✅ 完成「'+s.name+'」，已归档到 '+(w.folder||'DUID 文件夹'));
}


async function buildToolArgs(s){
  const f = flowOfStep(s.id);
  const cfg = (s.tool && s.tool.config) || [];
  const args = [];
  const missing = [];
  for(const c of cfg){
    // 「DUID 清单」动态输入项：批次作业时生成动态清单；非批次上下文跳过（不报 missing）
    if(c.itemId === '__duid_list__'){
      const r = await getDuidListPath(s);
      if(r && r.path) args.push('--'+c.id, r.path);
      else if(r && r.error) missing.push(r.error);
      continue;
    }
    if(c.itemId && c.itemId.startsWith('pf_')){
      const pid = c.itemId.slice(3);
      try{
        const r = await pywebview.api.make_platform_config_file(pid);
        if(r && r.ok && r.path) args.push('--'+c.id, r.path);
        else missing.push('平台凭证(' + ((r && r.name) || pid) + ')');
      }catch(e){ missing.push('平台凭证'); }
      continue;
    }
    const alias = toolRefLabel(s, c) || c.id || '输入';
    const ref = resolveToolInputRef(f, s, c);
    if(!ref || !ref.path){ missing.push(alias); continue; }
    let abs = null;
    try{
      const r = await pywebview.api.resolve_file(ref.path);
      if(r && r.path) abs = r.path;
    }catch(e){}
    if(!abs){ missing.push(alias); continue; }
    args.push('--'+c.id, abs);
  }
  return {args, missing};
}

// 单 DUID 作业视图：若工具声明了单 DUID 参数（tool.json 的 duid_param），
// 自动追加 --<duid_param> <当前DUID>，让工具只处理当前 DUID。
async function buildDuidArg(s){
  if(!(workView === 'item' && currentWorkItemId)) return null;
  if(!s || !s.tool) return null;
  const f = flowOfStep(s.id);
  const w = ((f && f.workItems) || []).find(x=>x.id === currentWorkItemId);
  if(!w || !w.duid) return null;
  let m = null;
  try{ m = await pywebview.api.get_tool_manifest(s.tool.name); }catch(e){ m = null; }
  if(m && m.duid_param){ return ['--' + m.duid_param, w.duid]; }
  return null;
}

// 批次作业流视图：生成「当前批次剩余 DUID」清单文件，返回绝对路径；
// 供工具参数映射里关联了「DUID 清单（__duid_list__）」的动态参数使用。
// 拆出的 DUID（batchId=null）由后端自动排除。
// 单 DUID 作业视图（workView==='item'）：生成「仅当前 DUID」的清单文件。
async function getDuidListPath(s){
  const f = s ? flowOfStep(s.id) : null;
  if(!f) return {path:null, error:null};
  if(workView === 'flow' && currentBatchId){
    const b = (f.batches || []).find(x=>x.id === currentBatchId);
    if(!b) return {path:null, error:null};
    try{
      const r = await pywebview.api.make_duid_list(f.id, b.id, s.id);
      if(r && r.ok && r.path) return {path: r.path, error: null};
      return {path: null, error: (r && r.error) || null};
    }catch(e){ return {path:null, error:null}; }
  }
  if(workView === 'item' && currentWorkItemId){
    const w = (f.workItems || []).find(x=>x.id === currentWorkItemId);
    if(!w || !w.duid) return {path:null, error:null};
    try{
      const r = await pywebview.api.make_single_duid_list(w.duid);
      if(r && r.ok && r.path) return {path: r.path, error: null};
      return {path: null, error: (r && r.error) || null};
    }catch(e){ return {path:null, error:null}; }
  }
  return {path:null, error:null};
}

// 判断当前作业上下文下某节点是否已完成（已完成节点运行工具不再覆盖已固化的输出数据）
function stepIsDone(stepId){
  const f = flowOfStep(stepId);
  if(!f) return false;
  if(workView === 'item' && currentWorkItemId){
    const w = (f.workItems || []).find(x=>x.id === currentWorkItemId);
    return !!(w && (w.doneStepIds || []).includes(stepId));
  }
  if(workView === 'flow' && currentBatchId){
    const b = (f.batches || []).find(x=>x.id === currentBatchId);
    if(b) return batchCommonDone(f, b).has(stepId);
  }
  return false;
}

async function runTool(stepId){
  const s = findStep(stepId);
  if(!s || !s.tool) return;
  // 任务锚点节点：若之前未完成（被「重跑节点」取消完成），重新运行时清除物料替换，清单恢复原始；
  // 若已完成，重复运行不影响替换结果（保持用户替换）。
  if(s.anchor && workView === 'item' && currentWorkItemId){
    const _af = flowOfStep(stepId);
    const _aw = _af && (_af.workItems || []).find(x=>x.id === currentWorkItemId);
    if(_aw && !(_aw.doneStepIds || []).includes(stepId) && _aw.replacements){
      delete _aw.replacements;
    }
  }
  const btn = document.getElementById('runbtn-'+stepId);
  const box = document.getElementById('logbox-'+stepId);
  const body = document.getElementById('logbody-'+stepId);
  const empty = document.getElementById('logempty-'+stepId);
  if(!btn || !box || !body) return;
  if(empty) empty.style.display = 'none';
  btn.disabled = true; btn.textContent = '⏳ 运行中…';
  box.style.display = 'block';
  body.innerHTML = '<span style="color:#94a3b8">正在准备输入文件…</span>';

  const prep = await buildToolArgs(s);
  const duidArg = await buildDuidArg(s);
  if(duidArg) prep.args.push(...duidArg);
  if(prep.missing && prep.missing.length){
    btn.disabled = false; btn.textContent = '▶ 运行';
    body.innerHTML = '<div class="log-status err">❌ ' + esc(prep.missing.join('；')) + '</div>';
    return;
  }

  body.innerHTML = '<span style="color:#94a3b8">正在运行 ' + esc(s.tool.name) + ' …</span>';
  let res;
  try{ res = await pywebview.api.run_tool(s.tool.name, prep.args); }
  catch(e){ res = {ok:false, log:'调用失败：'+e}; }
  btn.disabled = false; btn.textContent = '▶ 运行';
  body.innerHTML = renderRunResult(res);
  // 输出结果文件放到「输出结果」模块（输出区），日志只留文字
  const outResultBody = document.getElementById('outresultbody-'+stepId);
  if(outResultBody) outResultBody.innerHTML = renderToolOutputs(res) || '<div class="sub">（工具未产生输出文件）</div>';
  // 持久化运行结果：工具跑完（有 outputs 数组）就存到节点，供「完成本步」后保留、下一步自动引用
  if(res && Array.isArray(res.outputs)){
    // 已完成节点运行工具：只展示本次临时结果，不覆盖已固化的输出数据（output.results 保持不变）
    if(!stepIsDone(stepId)){
      if(!s.output) s.output = {};
      s.output.results = res.outputs.map(o=>({name:o.name, rel:o.rel}));
      await saveData();
      // 工具运行可能更新了锚点数据源（output.results），清缓存并重新加载锚点面板
      anchorData = null; anchorLoadedFor = null;
      if(workView === 'item' && currentWorkItemId){
        const _af = flowOfStep(stepId);
        const _aw = _af && (_af.workItems || []).find(x=>x.id === currentWorkItemId);
        if(_af && _aw && anchorStepOf(_af)){
          loadAnchorData(_af, _aw);
        }
      }
    }
    // 运行完成且有结果 → 自动展示数据预览（优先 Excel，其次 CSV/文本，再图片，最后取第一个）
    if(res.outputs.length){
      const o = res.outputs.find(x=>/\.(xlsx|xlsm)$/i.test(x.name||x.rel||''))
             || res.outputs.find(x=>/\.(csv|txt|log|md|json)$/i.test(x.name||x.rel||''))
             || res.outputs.find(x=>/\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(x.name||x.rel||''))
             || res.outputs[0];
      if(o && (o.rel || o.name)) await previewFile(o.rel || o.name, stepId);
    }
    // 生成「返回消息数据」：按模板 + 筛选条件从结果表格里筛值拼消息
    if(s.msgTemplate && s.msgTemplate.trim()) await buildNodeMessage(s, res);
  }
}

async function buildNodeMessage(s, res){
  const out = document.getElementById('msgout-'+s.id);
  if(!out) return;
  const outs = res && res.outputs ? res.outputs : [];
  const tbl = outs.find(x=>/\.(xlsx|xlsm|csv)$/i.test(x.name||x.rel||'')) || outs[0];
  if(!tbl){
    out.innerHTML = '<span class="log-status err">没有表格类结果文件（仅 Excel/CSV 能生成消息）</span>';
    return;
  }
  let r;
  try{
    r = await pywebview.api.build_message(tbl.rel || tbl.name, s.msgTemplate, s.msgFilter || '');
  }catch(e){ r = {ok:false, error:'调用失败：'+e}; }
  if(r && r.ok){
    const msg = r.message || '';
    msgCache[s.id] = msg;
    out.innerHTML = msg
      ? `<div class="msg-text">${esc(msg).replace(/\n/g,'<br>')}</div>`
      : '<span class="sub">（筛选没有匹配到任何行）</span>';
  } else {
    out.innerHTML = '<span class="log-status err">生成消息失败：'+esc((r&&r.error)||'未知错误')+'</span>';
  }
}

function renderOutputFiles(){
  const box = document.getElementById('out_files_box');
  if(!box) return;
  const files = outputFileDrafts.map((f,i)=>`
    <div class="io-file-wrap"><div class="io-file" onclick="openFile('${esc(f.path||f.name)}')" title="点击打开本地文件">📄 ${esc(f.name)}</div><span class="io-file-del" onclick="removeOutputFile(${i})" title="移除">✕</span></div>`).join('');
  box.innerHTML = `<div class="in-items">
    <div class="in-items-head">📤 输出文件 <span class="sub">工具要用的「输出模板」等文件拖入这里，可在下方「工具输入关联」里引用</span></div>
    <div class="drop-zone drop-inline" id="out_file_drop"><span class="dz-icon">📥</span><span>拖入输出模板等文件</span></div>
    <div class="out-files-list">${files || '<div class="sub" style="margin:4px 0">暂无输出文件</div>'}</div>
  </div>`;
  const dz = document.getElementById('out_file_drop');
  if(dz && !dz.dataset.bound){
    dz.dataset.bound = '1';
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', ()=>{ dz.classList.remove('drag-over'); });
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.classList.remove('drag-over');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async function(ev){
        try{
          const r = await pywebview.api.save_input_file(file.name, ev.target.result);
          if(r && r.ok){ outputFileDrafts.push({id:'out_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:r.name, path:r.path}); renderOutputFiles(); renderToolConfig(); renderAnchorFileOptions(); toast('✅ 已添加输出文件：'+r.name); }
          else toast('❌ 添加失败：'+(r&&r.error));
        }catch(err){ toast('❌ 添加失败：'+err); }
      };
      reader.readAsDataURL(file);
    });
  }
}

async function loadToolConfig(){
  const sel = document.getElementById('f_tool');
  const name = sel ? sel.value : '';
  toolManifest = null;
  toolCfgDrafts = [];
  if(name){
    try{ toolManifest = await pywebview.api.get_tool_manifest(name); }catch(e){ toolManifest = null; }
    let existing = null;
    if(editNodeId){
      const s = findStep(editNodeId);
      if(s && s.tool && s.tool.name === name && s.tool.config) existing = s.tool.config;
    }
    if(existing && existing.length){
      // 该节点已配过此工具：直接用已存槽位（兼容旧 source/refId → 新 ref.type/nodeId/itemId）
      toolCfgDrafts = existing.map(c=>{
        let itemId = c.itemId;
        if(itemId == null && c.ref && c.ref.itemId) itemId = c.ref.itemId;
        return { id: c.id||'', itemId: itemId || null };
      });
    } else if(toolManifest && toolManifest.inputs && toolManifest.inputs.length){
      // 有声明文件：自动预填槽位（便利），使用者再关联到本节点输入项
      toolCfgDrafts = toolManifest.inputs.map(inp=>({ id: inp.id, itemId: null }));
    }
    // 否则：留空，由使用者手动「添加输入槽位」
  }
  renderToolConfig();
}

    const outOpts = outputFileDrafts.map(f=>`<option value="${esc(f.id)}" ${f.id===c.itemId?'selected':''}>📤 ${esc(f.name)}</option>`).join('');
    const platOpts = allPlatforms().map(p=>`<option value="pf_${p.id}" ${('pf_'+p.id)===c.itemId?'selected':''}>🌐 ${esc(p.name||'未命名平台')}（平台凭证）</option>`).join('');
    const emptyMsg = (inputItemDrafts.length || outputFileDrafts.length || allPlatforms().length) ? '' : '<option value="">（请先在上方添加输入项或输出文件）</option>';
    return `<div class="tc-cfg-row">
      <input class="tc-cfg-id" value="${esc(c.id)}" placeholder="参数名（--参数名）" title="传给工具的命令行参数名，如 input_template" oninput="setToolCfgId(${i}, this.value)">
      <select class="tc-cfg-ref" onchange="setToolCfgItem(${i}, this.value)"><option value="">选择输入项 / 输出文件 / 平台凭证</option>${itemOpts}${outOpts}${platOpts}${emptyMsg}</select>
      <button class="tc-cfg-del" onclick="removeToolCfgSlot(${i})" title="删除此输入槽位">✕</button>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="tc-cfg">
    <div class="tc-cfg-head">🛠 工具输入关联 <span class="sub">每个参数对应一个本节点输入项、输出文件或平台凭证</span></div>

  </div>`;
}

/* 截图：粘贴（操作指导步骤 + 操作举证） */
document.addEventListener('paste', function(e){
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type.indexOf('image')!==-1){
      if(view==='record'){
        processImage(it.getAsFile());
      } else if(view==='flow' && evidenceTargetStepId){
        processEvidence(it.getAsFile(), evidenceTargetStepId);
      } else {
        continue;
      }
      e.preventDefault();
      return;
    }
  }
});
function processImage(file){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 1920; // 保留全高清截图原尺寸，放大后更清晰
      const scale = Math.min(1, maxW/img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.92);
      if(shotTargetIndex >= 0 && stepDrafts[shotTargetIndex]){
        // 贴到指定步骤
        stepDrafts[shotTargetIndex].shotDataUrl = dataUrl;
        renderStepList();
        toast('✅ 截图已贴到第 ' + (shotTargetIndex+1) + ' 步');
      } else {
        toast('请先点某一步的「📷 贴图」，再 Ctrl+V 粘贴');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveNode(){
  const fid = document.getElementById('f_flow').value;
  const flow = DATA.flows.find(f=>f.id===fid);
  if(!flow){ toast('请先创建流程'); return; }
  const name = document.getElementById('f_name').value.trim();
  const brief = document.getElementById('f_brief').value.trim();
  const out = document.getElementById('f_out').value.trim();
  const rawSteps = stepDrafts.map(st=>st.text.trim()).filter(Boolean);
  if(!name||!rawSteps.length||!out){ toast('请填节点名称、操作指导、输出'); return; }

  const inText = document.getElementById('f_in_text').value.trim();
  const items = inputItemDrafts
    .filter(it => (it.name && it.name.trim()) || (it.kind !== 'file' && it.refId) || it.required || it.kind === 'duidlist')
    .map(it => {
      const item = { id: it.id, name: (it.name || '').trim(), required: !!it.required, kind: it.kind };
      if(it.kind === 'file'){
        item.file = null;  // 临时拖入：文件只存作业上下文（批次/DUID），不存框架
      } else {
        item.refId = it.refId || null;
        item.refLabel = null;
        if(it.kind === 'checklist'){
          const c = findChecklistItem(flow, it.refId);
          if(c) item.refLabel = c.name;
        } else if(it.kind === 'node'){
          const t = findStep(it.refId);
          if(t) item.refLabel = t.name;
          item.refFile = it.refFile || null;  // 引用节点输出时选中的具体文件
        }
      }
      return item;
    });
  const input = { text: inText, items: items };

  const filesStr = document.getElementById('f_files').value.trim();
  const files = filesStr? filesStr.split(/[,，]/).map(x=>x.trim()).filter(Boolean).map(n=>({name:n})) : [];
  const toolName = document.getElementById('f_tool').value;
  let tool = toolName ? { name: toolName } : null;
  if(tool){
    const config = toolCfgDrafts
      .filter(c => c.id && String(c.id).trim())
      .map(c=>({ id: String(c.id).trim(), itemId: c.itemId || null }));
    if(config.length) tool.config = config;
  }

  // 每步截图批量存盘
  const steps = [];
  for(const st of stepDrafts){
    let shot = st.shotPath || '';
    if(st.shotDataUrl){
      try{
        const r = await pywebview.api.save_screenshot(st.shotDataUrl);
        if(r && r.ok) shot = r.path;
      }catch(e){}
    }
    if(st.text.trim() || shot){
      steps.push({ text: st.text.trim(), shot: shot || null });
    }
  }
  const desc = rawSteps.join('\n');

  const urls = urlDrafts
    .filter(u => (u.url||'').trim())
    .map(u => ({ name: (u.name||'').trim(), url: (u.url||'').trim() }));

  const node = {
    name, brief, desc, input, output:{type:'text', text:out, files: outputFileDrafts.map(f=>({id:f.id, name:f.name, path:f.path}))},
    note: document.getElementById('f_note').value.trim(),
    tool, files, urls, steps,
    batchDetach: !!(document.getElementById('f_batch_detach') && document.getElementById('f_batch_detach').checked),
    msgFilter: document.getElementById('f_msg_filter') ? document.getElementById('f_msg_filter').value.trim() : '',
    msgTemplate: document.getElementById('f_msg_template') ? document.getElementById('f_msg_template').value.trim() : '',
    anchor: (function(){
      const on = document.getElementById('f_anchor_on');
      if(!on || !on.checked) return null;
      const af = document.getElementById('f_anchor_file');
      const cfg = { file: (af && af.value) ? af.value : '' };
      // 保留已配置的展示列（避免重新保存节点时丢失「⚙ 列」配置）
      if(editNodeId){
        const _ef = flowOfStep(editNodeId);
        const _es = _ef ? _ef.steps.find(x=>x.id===editNodeId) : null;
        const _oldCols = _es && _es.anchor ? _es.anchor.columns : null;
        if(Array.isArray(_oldCols) && _oldCols.length) cfg.columns = _oldCols.slice();
      }
      return cfg;
    })()
  };

  if(editNodeId){
    const src = flowOfStep(editNodeId);
    const idx = src.steps.findIndex(s=>s.id===editNodeId);
    node.id = editNodeId; node.seq = src.steps[idx].seq;
    // 保留运行结果（output.results），避免重新保存节点时丢失锚点数据源 / 数据预览 / 下一步引用
    const _oldStep = src.steps[idx];
    const _oldResults = (_oldStep && _oldStep.output && _oldStep.output.results) || [];
    if(_oldResults.length) node.output.results = _oldResults;
    src.steps[idx] = node;
  } else {
    node.id = 'N' + String(nextId()).padStart(3,'0');
    const afterIdx = (insertAfterId && flow.steps.some(s=>s.id===insertAfterId))
      ? flow.steps.findIndex(s=>s.id===insertAfterId)
      : -1;
    if(afterIdx >= 0) flow.steps.splice(afterIdx + 1, 0, node);
    else flow.steps.push(node);
    // 插入后统一重排序号
    flow.steps.forEach((s, i)=>{ s.seq = i + 1; });
  }
  // 消息模板/筛选已更新，清掉旧缓存（否则作业视图还会显示改动前的消息）
  msgCache[node.id] = '';
  await saveData();
  anchorData = null; anchorLoadedFor = null;   // 锚点配置可能已变，清缓存
  toast('✅ 已保存到「'+flow.name+'」');
  view='flow'; currentFlowId=fid; searchTerm=''; selectedStepId=node.id; document.getElementById('searchInput').value=''; render();
}
function nextId(){
  const ids = allSteps().map(s=>parseInt(String(s.id).replace(/\D/g,''))||0);
  return ids.length? Math.max(...ids)+1 : 1;
}

function copyFlow(id){
  const src = DATA.flows.find(x=>x.id===id);
  if(!src){ toast('流程不存在'); return; }
  // 深拷贝流程配置，丢弃作业运行数据（批次/作业项/节点运行结果）
  const clone = JSON.parse(JSON.stringify(src));
  clone.id = 'f' + Date.now();
  clone.name = (src.name || '未命名流程') + '（副本）';
  delete clone.workItems;
  delete clone.batches;
  // 重新生成节点 id（全局唯一），并重映射「引用节点输出」的 refId
  const idMap = {};
  let n = nextId();
  clone.steps = (clone.steps || []).map(s => {
    const newId = 'N' + String(n++).padStart(3, '0');
    idMap[s.id] = newId;
    const ns = Object.assign({}, s, { id: newId });
    if(ns.output) ns.output = Object.assign({}, ns.output, { results: [] });
    return ns;
  });
  clone.steps.forEach(s => {
    const items = s.input && s.input.items;
    if(items){
      items.forEach(it => {
        if(it.kind === 'node' && it.refId && idMap[it.refId]) it.refId = idMap[it.refId];
      });
    }
  });
  DATA.flows.push(clone);
  saveData().then(()=>{ render(); toast('已复制流程「'+clone.name+'」'); });
}

      try{
        const o = await pywebview.api.open_url(url);
        if(o && !o.ok) showError('打开失败', o.error);
      }catch(e){ showError('打开失败', String(e && e.message || e)); }
    };
    if(cp) cp.onclick = async function(){
      try{ await navigator.clipboard.writeText(url); toast('✅ 下载链接已复制'); }
      catch(e){
        const ta = document.createElement('textarea');
        ta.value = url; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        toast('✅ 下载链接已复制');
      }
    };
  }
}

function showError(title, detail){
  const m = document.createElement('div');
  m.className = 'modal-bg';
  const d = detail ? `<pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px;max-height:300px;overflow:auto;margin-top:8px">${esc(detail)}</pre>` : '';
  m.innerHTML = `<div class="modal" style="max-width:680px">
    <h3 style="color:#dc2626">⚠️ ${esc(title)}</h3>
    ${d}
    <div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" id="mErrOk">知道了</button></div>
  </div>`;
  document.body.appendChild(m);
  document.getElementById('mErrOk').onclick = function(){ m.remove(); };
}
function showConfirm(msg, onOk){
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal"><h3>${esc(msg)}</h3>
    <div class="btn-row" style="margin-top:6px">
      <button class="btn btn-primary" id="mOk">确定</button>
      <button class="btn btn-ghost" id="mCancel">取消</button>
    </div></div>`;
  document.body.appendChild(m);
  document.getElementById('mOk').onclick = function(){ m.remove(); onOk(); };
  document.getElementById('mCancel').onclick = function(){ m.remove(); };
}
function showPrompt(title, placeholder, onOk){
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>
    <div class="field"><input type="text" id="mInput" placeholder="${esc(placeholder)}"></div>
    <div class="btn-row" style="margin-top:6px">
      <button class="btn btn-primary" id="mOk">确定</button>
      <button class="btn btn-ghost" id="mCancel">取消</button>
    </div></div>`;
  document.body.appendChild(m);
  const input = document.getElementById('mInput');
  input.focus();
  function done(){ const v = input.value.trim(); m.remove(); onOk(v); }
  document.getElementById('mOk').onclick = done;
  document.getElementById('mCancel').onclick = function(){ m.remove(); };
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') done(); });
}

/* ================= 启动 ================= */
window.addEventListener('pywebviewready', async function(){
  try{ DATA = await pywebview.api.load_data(); }
  catch(e){ DATA = null; }
  if(DATA){
    let cleaned = 0;
    for(const fl of (DATA.flows||[])) cleaned += cleanupOrphanWorkItems(fl);
    if(cleaned > 0){ try{ await pywebview.api.save_data(DATA); }catch(e){} }
  }
  render();
});
render();
</script>
</body>
</html>
