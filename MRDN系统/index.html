<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRDN 系统 · 业务操作手册</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#1e293b; --ink2:#475569; --muted:#94a3b8;
    --line:#e7ecf5;
    --brand:#5b6cff; --brand2:#8b5cf6;
    --cyan:#06b6d4; --green:#10b981; --orange:#f59e0b; --red:#ef4444;
    --green-bg:#ecfdf5; --green-bd:#a7f3d0;
    --blue-bg:#eef2ff; --blue-bd:#c7d2fe;
    --orange-bg:#fff7ed; --orange-bd:#fed7aa;
    --purple-bg:#f5f3ff; --purple-bd:#ddd6fe;
    --shadow:0 2px 14px rgba(30,41,59,.06);
    --shadow-lg:0 12px 32px rgba(30,41,59,.12);
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;}

  header{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:18px; height:62px; padding:0 26px;
    background:rgba(255,255,255,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .logo{width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; box-shadow:0 4px 12px rgba(91,108,255,.35);}
  .app-name{font-weight:800; font-size:16px; letter-spacing:.3px;}
  .app-sub{font-size:11px; color:var(--muted); margin-top:-2px;}
  .top-actions{margin-left:auto; display:flex; align-items:center; gap:8px;}
  .search{display:flex; align-items:center; gap:8px; background:#f1f4fa; border:1px solid transparent; border-radius:10px; padding:8px 12px; width:190px; transition:.2s;}
  .search:focus-within{border-color:var(--brand); background:#fff; width:230px;}
  .search input{border:none; background:none; outline:none; font-size:13px; width:100%; color:var(--ink);}
  .btn{border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; transition:.15s; font-family:inherit; display:inline-flex; align-items:center; gap:6px;}
  .btn-ghost{background:#f1f4fa; color:var(--ink2);}
  .btn-ghost:hover{background:#e8ecf5;}
  .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; box-shadow:0 4px 12px rgba(91,108,255,.3);}
  .btn-primary:hover{filter:brightness(1.05); transform:translateY(-1px);}

  main{max-width:1180px; margin:0 auto; padding:34px 26px 60px;}

  .hero{margin-bottom:28px;}
  .hero h1{font-size:24px; font-weight:800; letter-spacing:.3px;}
  .hero .welcome{color:var(--muted); margin-top:6px; font-size:14px;}
  .hero .welcome b{color:var(--ink);}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:34px;}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); display:flex; align-items:center; gap:14px;}
  .stat .ico{width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
  .stat .num{font-size:26px; font-weight:800; line-height:1; letter-spacing:.5px;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:4px;}

  .sec-head{display:flex; align-items:center; gap:10px; margin:8px 0 16px;}
  .sec-head h2{font-size:17px; font-weight:800;}
  .sec-head .count{font-size:12px; color:var(--muted); background:#f1f4fa; padding:2px 10px; border-radius:999px;}

  .flow-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px;}
  .flow-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; cursor:pointer; box-shadow:var(--shadow); transition:.18s; position:relative; overflow:hidden;}
  .flow-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:#dbe1f0;}
  .flow-card .top{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .flow-card .fico{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;}
  .flow-card .fname{font-size:16px; font-weight:800;}
  .flow-card .goal{color:var(--ink2); font-size:13px; line-height:1.6; margin-bottom:16px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:42px;}
  .flow-card .foot{display:flex; align-items:center; gap:8px; padding-top:14px; border-top:1px solid var(--line);}
  .chip{font-size:11px; color:var(--ink2); background:#f1f4fa; padding:3px 9px; border-radius:999px;}
  .flow-card .go{margin-left:auto; color:var(--brand); font-weight:700; font-size:13px;}
  .flow-card.new{border:2px dashed #d3daea; background:transparent; box-shadow:none; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:170px; color:var(--muted);}
  .flow-card.new:hover{border-color:var(--brand); color:var(--brand); background:#fafbff;}
  .flow-card.new .plus{font-size:30px; font-weight:300; margin-bottom:6px;}

  .back{display:inline-flex; align-items:center; gap:6px; color:var(--ink2); cursor:pointer; font-size:13px; font-weight:600; margin-bottom:14px;}
  .back:hover{color:var(--brand);}
  .flow-detail-head{display:flex; align-items:flex-start; gap:16px; margin-bottom:24px;}
  .flow-detail-head .fico{width:58px; height:58px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0;}
  .flow-detail-head h1{font-size:22px; font-weight:800;}
  .flow-detail-head .goal{color:var(--ink2); margin-top:4px; max-width:640px;}
  .flow-detail-head .acts{margin-left:auto; display:flex; gap:8px; flex-shrink:0;}

  .chain{max-width:760px; margin:0 auto;}
  .step{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow); position:relative;}
  .step-head{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .seq{min-width:34px; height:34px; border-radius:11px; color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; padding:0 9px;}
  .step-title{font-size:17px; font-weight:800;}
  .tags{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{font-size:11px; padding:3px 9px; border-radius:7px; border:1px solid var(--line); color:var(--ink2); background:#f8fafc;}
  .tag.tool{color:#7c3aed; border-color:var(--purple-bd); background:var(--purple-bg);}
  .tag.file{color:#4338ca; border-color:var(--blue-bd); background:var(--blue-bg);}
  .tag.shot{color:#047857; border-color:var(--green-bd); background:var(--green-bg);}
  .step .del{position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:8px; border:none; background:#f1f4fa; color:var(--muted); cursor:pointer; font-size:14px; opacity:0; transition:.15s;}
  .step:hover .del{opacity:1;}
  .step .del:hover{background:#fee2e2; color:var(--red);}

  .step-desc{color:#334155; line-height:1.75; white-space:pre-line; margin-bottom:16px; font-size:14px;}

  .io{border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.6; margin-bottom:10px;}
  .io .io-title{font-weight:700; font-size:12px; margin-bottom:5px; display:flex; align-items:center; gap:6px;}
  .io.in{background:var(--green-bg); border:1px solid var(--green-bd);}
  .io.in .io-title{color:#047857;}
  .io.out{background:var(--blue-bg); border:1px solid var(--blue-bd);}
  .io.out .io-title{color:#1d4ed8;}
  .io-body{color:#334155; word-break:break-word;}
  .ref{display:inline-flex; align-items:center; gap:4px; background:var(--purple-bg); border:1px solid var(--purple-bd); color:#6d28d9; padding:2px 9px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer;}
  .ref:hover{background:#ede9fe;}

  .note{background:var(--orange-bg); border:1px solid var(--orange-bd); border-radius:11px; padding:10px 13px; font-size:13px; color:#9a3412; display:flex; gap:8px; line-height:1.6; margin-top:2px;}

  .shot-img{margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid var(--line);}
  .shot-img img{width:100%; display:block;}

  details{margin-top:12px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fafbfd;}
  summary{cursor:pointer; padding:11px 15px; font-size:13px; font-weight:700; color:var(--ink2); list-style:none; user-select:none;}
  summary::-webkit-details-marker{display:none;}
  summary:hover{background:#f1f4fa;}
  .details-body{padding:4px 15px 15px;}
  .tool-row{display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap;}
  .tool-row .sub{font-size:12px; color:var(--muted);}
  .log-box{margin-top:12px; border:1px solid #334155; border-radius:10px; overflow:hidden;}
  .log-head{background:#1e293b; color:#94a3b8; font-size:11px; font-weight:700; padding:7px 13px; letter-spacing:.5px;}
  .log-body{background:#0b1220; color:#cbd5e1; font-family:"SF Mono",Consolas,monospace; font-size:12px; line-height:1.75; padding:11px 13px; white-space:pre-wrap; word-break:break-word;}
  .log-body .err{color:#f87171; font-weight:700;}
  .log-body .ok-line{color:#34d399;}
  .log-status{font-size:12px; font-weight:800; padding:7px 11px; border-radius:8px; margin-bottom:9px;}
  .log-status.ok{background:#052e1b; color:#4ade80; border:1px solid #14532d;}
  .log-status.err{background:#3f0d12; color:#f87171; border:1px solid #7f1d1d;}
  .files{display:flex; flex-direction:column; gap:7px; margin-top:10px;}
  .file{display:flex; align-items:center; gap:10px; border:1px solid var(--blue-bd); background:var(--blue-bg); border-radius:10px; padding:9px 13px; font-size:13px;}
  .file .fname{font-weight:700; color:#1e40af;}

  .connector{display:flex; flex-direction:column; align-items:center; padding:6px 0;}
  .connector .ref-tag{font-size:11px; color:#6d28d9; background:var(--purple-bg); border:1px solid var(--purple-bd); padding:3px 11px; border-radius:999px; margin-bottom:5px; font-weight:700;}
  .connector .line{width:2px; height:26px; background:#d3daea;}
  .connector .arrow{color:#b7c0d4; font-size:13px; margin-top:-3px;}

  .empty{padding:50px 20px; text-align:center; color:var(--muted);}
  .empty .big{font-size:40px; margin-bottom:10px;}

  .record{max-width:660px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px 32px; box-shadow:var(--shadow);}
  .record h2{font-size:20px; font-weight:800; margin-bottom:4px;}
  .record .hint{color:var(--muted); font-size:13px; margin-bottom:26px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:7px; color:#334155;}
  .field label .req{color:var(--red);}
  .field input[type=text], .field select, .field textarea{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:11px; font-size:14px; font-family:inherit; color:var(--ink); background:#fbfcfe; outline:none; transition:.15s;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand); background:#fff; box-shadow:0 0 0 3px rgba(91,108,255,.12);}
  .field textarea{min-height:74px; resize:vertical; line-height:1.6;}
  .field .sub{font-size:12px; color:var(--muted); margin-top:5px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row2 > .field{min-width:0;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}
  .radio-line{display:flex; gap:20px; margin-bottom:9px; font-size:13px; color:#475569;}
  .radio-line label{display:flex; align-items:center; gap:6px; font-weight:500; cursor:pointer;}
  .shot-paste{border:2px dashed #c7d2fe; background:#fafbff; border-radius:12px; padding:18px; text-align:center; color:#6366f1; font-size:13px; cursor:pointer; transition:.15s;}
  .shot-paste:hover{border-color:var(--brand); background:var(--blue-bg);}
  .shot-paste.pasted{border-style:solid; border-color:var(--green); background:var(--green-bg); color:#047857;}
  .shot-paste img{max-width:100%; border-radius:8px; margin-bottom:6px; display:block;}
  .btn-row{display:flex; gap:10px; margin-top:26px;}
  .btn-lg{padding:12px 30px; border-radius:12px; font-size:15px;}

  .toast{position:fixed; bottom:26px; right:26px; background:#1e293b; color:#fff; padding:13px 20px; border-radius:12px; font-size:13px; opacity:0; transform:translateY(10px); transition:.25s; pointer-events:none; z-index:99; box-shadow:var(--shadow-lg); max-width:480px;}
  .toast.show{opacity:1; transform:translateY(0);}

  .modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.4); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50;}
  .modal{background:#fff; border-radius:18px; padding:26px; width:420px; max-width:92vw; box-shadow:var(--shadow-lg);}
  .modal h3{font-size:17px; font-weight:800; margin-bottom:16px;}

  /* ===== 横版流程条（二级页） ===== */
  .flowbar-wrap{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 18px 14px; margin-bottom:18px; box-shadow:var(--shadow);}
  .flowbar{display:flex; align-items:flex-start; overflow-x:auto; padding:6px 2px 2px;}
  .fnode{display:flex; flex-direction:column; align-items:center; gap:5px; min-width:88px; flex-shrink:0; cursor:pointer; user-select:none;}
  .fdot{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; transition:.18s; position:relative; background:#e9edf5; color:#a3adbf;}
  .fnode-name{font-size:11px; font-weight:700; color:var(--ink2); text-align:center; line-height:1.35; max-width:88px; word-break:break-all;}
  .fnode-tag{font-size:11px; margin-left:3px; vertical-align:middle;}
  .fnode-icons{display:flex; gap:3px; font-size:10px; min-height:14px;}
  .fnode-arrow{visibility:hidden; color:var(--brand); font-size:14px; line-height:1; margin-top:-2px;}
  .fconn{flex:1; min-width:24px; height:3px; background:#e2e8f0; margin-top:15px; border-radius:2px; flex-shrink:0; align-self:flex-start; transition:.2s;}
  .fconn.done{background:linear-gradient(90deg,var(--brand),var(--brand2));}

  .fnode.done .fdot{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; box-shadow:0 4px 10px rgba(91,108,255,.35);}
  .fnode.done .fnode-name{color:#4f46e5;}
  .fnode.todo .fdot{background:#e9edf5; color:#a3adbf;}
  .fnode.todo .fnode-name{color:#a8b2c4;}
  .fnode.active .fdot{background:#fff; color:var(--brand); border:3px solid var(--brand); box-shadow:0 0 0 5px rgba(91,108,255,.16), 0 5px 14px rgba(91,108,255,.32);}
  .fnode.active .fnode-name{color:var(--brand); font-weight:800;}
  .fnode.active .fnode-arrow{visibility:visible; animation:bounce 1.1s infinite;}
  .fnode.selected .fdot{background:#fff; color:var(--brand); border:3px solid var(--brand); box-shadow:0 0 0 5px rgba(91,108,255,.16), 0 5px 14px rgba(91,108,255,.32);}
  .fnode.selected .fnode-name{color:var(--brand); font-weight:800;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

  /* 进度控制条 */
  .progress-row{display:flex; align-items:center; gap:18px; padding:6px 4px 18px; flex-wrap:wrap;}
  .progress-left{display:flex; align-items:center; gap:11px; flex:1; min-width:220px;}
  .p-label{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap;}
  .p-track{flex:1; height:8px; background:#e9edf5; border-radius:99px; overflow:hidden;}
  .p-fill{height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); border-radius:99px; transition:.3s;}
  .p-num{font-size:13px; font-weight:800; color:var(--ink2); white-space:nowrap;}
  .progress-acts{display:flex; gap:8px; flex-wrap:wrap;}
  .flow-done-tip{color:#059669; font-weight:800; font-size:14px;}

  /* 操作台 */
  .console{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 28px; box-shadow:var(--shadow);}
  .console-head{display:flex; align-items:flex-start; gap:13px; margin-bottom:18px; flex-wrap:wrap;}
  .console-seq{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; color:#fff; flex-shrink:0;}
  .console-title{flex:1; min-width:190px;}
  .console-title h3{font-size:19px; font-weight:800; line-height:1.3;}
  .console-title .c-state{font-size:12px; margin-top:4px;}
  .status-badge{display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:700;}
  .status-badge.done{background:var(--blue-bg); color:#4f46e5; border:1px solid var(--blue-bd);}
  .status-badge.active{background:var(--blue-bg); color:#4338ca; border:1px solid var(--brand); box-shadow:0 0 0 3px rgba(91,108,255,.12);}
  .status-badge.todo{background:#f1f4f9; color:#94a3b8; border:1px solid #e2e8f0;}

  .console-desc{background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:15px 17px; white-space:pre-wrap; line-height:1.75; margin-bottom:16px; font-size:14px; color:var(--ink2);}
  .console-ios{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  @media(max-width:620px){.console-ios{grid-template-columns:1fr;}}
  .console-foot{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}

  /* 节点卡片：简介 / 输入输出 / 操作台 */
  .console-section{margin-bottom:16px;}
  .sec-label{font-size:13px; font-weight:800; color:var(--muted); margin-bottom:9px; letter-spacing:.3px;}
  .brief-body{background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:13px 16px; line-height:1.7; font-size:14px; color:var(--ink2);}
  .brief-body.empty{color:#a3adbf; font-style:italic;}
  .io-block{border:1px solid var(--line); border-radius:12px; padding:14px 15px; background:#fff; display:flex; flex-direction:column; gap:9px; min-width:0; overflow:hidden;}
  .io-block-title{font-size:12px; font-weight:800; color:var(--ink2); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .io-body{font-size:13px; color:var(--ink2); line-height:1.65; white-space:pre-wrap;}
  .io-file{display:inline-flex; align-items:center; gap:6px; padding:6px 10px; background:var(--blue-bg); border:1px solid #dbeafe; color:#1d4ed8; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .io-file:hover{background:#e0e7ff;}
  .io-file-inline{padding:3px 8px; font-size:11px; flex-shrink:0;}
  .io-files{display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
  .out-result{margin-top:2px; border-top:1px dashed var(--line); padding-top:9px;}
  .out-result-title{font-size:12px; font-weight:700; color:var(--ink2); margin-bottom:6px;}
  .out-result-body{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .drop-zone{border:1.5px dashed #c7d2fe; border-radius:10px; padding:12px; text-align:center; font-size:12px; color:#94a3b8; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; transition:.15s; background:#fbfcff;}
  .drop-zone.drag-over{border-color:var(--brand); background:#eef2ff; color:var(--brand);}
  .drop-zone.drop-inline{padding:6px 10px; border-radius:8px; font-size:12px; width:100%; box-sizing:border-box;}
  .drop-inline .dz-icon{font-size:13px;}
  .dz-icon{font-size:15px;}
  .console-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:720px){.console-grid{grid-template-columns:1fr;}}
  .pane{border:1px solid var(--line); border-radius:12px; padding:14px 15px; background:#fff; display:flex; flex-direction:column; gap:10px;}
  .pane-title{font-size:12px; font-weight:800; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .pane-title .sub{font-weight:500; color:#a3adbf;}
  .guide-body{display:flex; flex-direction:column; gap:7px;}
  .guide-body.empty{color:#a3adbf; font-style:italic; font-size:13px;}
  .guide-step{display:flex; gap:9px; align-items:flex-start;}
  .gs-num{flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--blue-bg); color:#4338ca; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .gs-text{font-size:13px; color:var(--ink2); line-height:1.6; white-space:pre-wrap;}
  .gs-main{display:flex; flex-direction:column; gap:7px; flex:1; min-width:0;}
  .gs-shot{max-width:200px; max-height:120px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; transition:.15s; display:block;}
  .gs-shot:hover{transform:scale(1.02); box-shadow:var(--shadow);}
  .log-empty{font-size:12px; color:#a3adbf; background:#f8fafc; border-radius:8px; padding:10px; line-height:1.6;}
  .btn-sm{padding:7px 12px; font-size:12px;}

  /* 节点标签 */
  .tag-pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--purple-bg); border:1px solid var(--purple-bd); color:#6d28d9;}
  .site-note{font-size:12px; color:var(--muted); font-weight:500; margin-left:6px;}
  .tag-row{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .tag-icon{width:44px; border:1px solid var(--line); border-radius:8px; text-align:center; font-size:16px; padding:4px;}
  .tag-name{flex:1; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px;}
  .tag-del{border:none; background:#fee2e2; color:#dc2626; border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px;}
  .tag-del:hover{background:#fecaca;}
  .tag-select-row{display:flex; align-items:center; gap:10px;}
  .tag-select-row select{flex:1; max-width:320px;}

  /* 操作指导步骤录入（每步可配截图） */
  .step-row{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .step-num{flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--blue-bg); color:#4338ca; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center;}
  .step-input{flex:1; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px;}
  .step-shotbtn{flex-shrink:0; min-width:54px; height:38px; border:1px dashed var(--line); background:#f8fafc; border-radius:8px; cursor:pointer; font-size:11px; color:var(--muted); display:flex; align-items:center; justify-content:center; overflow:hidden; padding:2px;}
  .step-shotbtn.targeting{border-color:var(--brand); background:var(--blue-bg); color:var(--brand); font-weight:700;}
  .step-shotbtn .step-shot{width:100%; height:100%; object-fit:cover; border-radius:6px;}
  .step-del{flex-shrink:0; border:none; background:#fee2e2; color:#dc2626; border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:14px;}
  .step-del:hover{background:#fecaca;}
  .step-shot-wrap{flex-shrink:0; position:relative; display:inline-flex;}
  .step-shot-del{position:absolute; top:-6px; right:-6px; border:none; background:#dc2626; color:#fff; border-radius:50%; width:18px; height:18px; cursor:pointer; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; z-index:2;}
  .step-shot-del:hover{background:#b91c1c;}

  /* 网址链接 */
  .url-link{display:block; padding:6px 10px; background:#e0f2fe; border:1px solid #bae6fd; color:#0369a1; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; max-width:100%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle;}
  .url-link:hover{background:#d1ecfd;}
  .url-row{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  .url-name{flex:0 0 170px; min-width:0;}
  .url-link-input{flex:1 1 auto; min-width:0;}
  .url-name-label{font-weight:700; color:#075985;}
  .url-addr{color:#0369a1; opacity:.85; margin-left:8px; font-weight:400;}

  /* 数据卡片表格 */
  .dc-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .dc-table th{background:#f1f4fa; color:var(--ink2); font-weight:700; text-align:left; padding:7px 10px; border:1px solid var(--line); position:sticky; top:0; white-space:nowrap;}
  .dc-table td{padding:6px 10px; border:1px solid var(--line); cursor:pointer; transition:.12s; white-space:nowrap;}
  .dc-table td:hover{background:var(--blue-bg);}
  .dc-scroll{max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:10px; background:#fff;}
  .dc-copied{background:#dcfce7 !important;}
  .dc-source-row{margin-bottom:10px;}
  .dc-source-row select{max-width:320px;}
  .dc-ref{border:1px solid var(--line); border-radius:10px; background:#f8fafc; padding:12px 14px;}
  .dc-ref-head{font-size:12px; font-weight:800; color:var(--brand); margin-bottom:8px;}
  .dc-ref-body{font-size:13px; color:var(--ink2); line-height:1.6; white-space:pre-wrap;}

  /* 操作台两栏加高 + 滚动 */
  .pane.guide{min-height:300px;}
  .pane .guide-body{max-height:470px; overflow-y:auto; padding-right:4px;}
  .pane .log-empty{min-height:180px;}
  .log-box{max-height:470px; overflow-y:auto;}

  /* 截图缩略图 + 放大 */
  .shot-thumbs{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;}
  .shot-thumb{width:120px; height:82px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; transition:.15s;}
  .shot-thumb:hover{transform:scale(1.03); box-shadow:var(--shadow);}
  .lightbox{position:fixed; inset:0; background:rgba(15,23,42,.72); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; cursor:zoom-out; overflow:hidden;}
  .lightbox img{max-width:92vw; max-height:90vh; border-radius:12px; box-shadow:0 24px 64px rgba(0,0,0,.4); transform-origin:center center; user-select:none; -webkit-user-select:none;}
  .lightbox .lb-close{position:absolute; top:22px; right:28px; color:#fff; font-size:34px; cursor:pointer; line-height:1; z-index:2;}

  /* 运行按钮置灰 */
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  /* 输入引用卡片 */
  .io-ref{font-size:12px; font-weight:700; color:#1d4ed8; background:var(--blue-bg); border:1px solid var(--blue-bd); border-radius:8px; padding:6px 10px;}
  .io-ref.warn{color:#b45309; background:var(--orange-bg); border-color:var(--orange-bd);}
  /* 文件必选 */
  .dz-required{color:#dc2626; font-weight:700;}
  .dz-warn{font-size:11px; color:#b45309; background:var(--orange-bg); border-radius:6px; padding:5px 8px; margin-top:6px;}
  .chk-line{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink2); cursor:pointer;}
  .chk-line input{accent-color:var(--brand);}
  /* 任务初始清单 */
  .checklist-card{border:1px solid var(--line); border-radius:14px; background:#fff; padding:14px 16px; margin-bottom:14px;}
  .cl-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .cl-title{font-size:14px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .cl-title .sub{font-size:12px; font-weight:500; color:var(--muted);}
  .cl-list{display:flex; flex-direction:column; gap:8px;}
  .cl-item{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .cl-main{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .cl-name{font-size:13px; font-weight:700; color:var(--ink);}
  .cl-desc{font-size:12px; color:var(--ink2); line-height:1.5;}
  .cl-acts{display:flex; gap:4px; flex-shrink:0;}
  .cl-empty{font-size:13px; color:var(--muted); font-style:italic; padding:6px 0;}
  .cl-anchor{border:1px solid var(--blue-bd); background:var(--blue-bg);}
  .cl-duids{display:flex; flex-wrap:wrap; gap:5px;}
  .duid-chip{font-family:ui-monospace,Consolas,monospace; font-size:11px; font-weight:600; color:#1e3a8a; background:#fff; border:1px solid var(--blue-bd); border-radius:6px; padding:2px 7px;}

  /* ===== 作业清单 ===== */
  .flow-tabs{display:flex; gap:8px; margin:14px 0; border-bottom:2px solid var(--line);}
  .ftab{padding:9px 18px; font-size:14px; font-weight:700; color:var(--ink2); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; display:flex; align-items:center; gap:7px; transition:.15s;}
  .ftab:hover{color:var(--brand);}
  .ftab.active{color:var(--brand); border-bottom-color:var(--brand);}
  .ftab-badge{background:var(--brand); color:#fff; font-size:11px; font-weight:700; border-radius:99px; padding:1px 8px;}

  .work-legend{font-size:12px; color:var(--ink2); background:var(--blue-bg); border:1px solid var(--blue-bd); border-radius:10px; padding:10px 12px; margin-top:16px; line-height:1.6;}

  .batch-card{background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; transition:.15s;}
  .batch-card:hover{border-color:var(--brand); box-shadow:var(--shadow);}
  .bc-head{display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;}
  .bc-expanded .bc-head{border-bottom:1px solid var(--line); background:#fbfcff;}
  .bc-icon{font-size:24px;}
  .bc-main{flex:1; min-width:0;}
  .bc-name{font-size:15px; font-weight:800; color:var(--ink);}
  .bc-sub{font-size:12px; color:var(--muted); margin-top:3px;}
  .bc-bar{width:120px; height:8px; background:#eef2ff; border-radius:99px; overflow:hidden; flex-shrink:0;}
  .bc-fill{height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); border-radius:99px;}
  .bc-acts{display:flex; gap:6px; flex-shrink:0;}
  .bc-body{padding:16px; background:#fbfcff;}
  .bc-body .work-filter{margin-bottom:14px;}

  .new-batch-panel{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px; box-shadow:var(--shadow);}
  .nb-acts{display:flex; gap:8px; margin-top:12px; justify-content:flex-end;}

  /* 作业准备（prep） */
  .prep-duids{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .prep-tools{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-bottom:16px;}
  .prep-tool{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; transition:.15s;}
  .prep-tool:hover{border-color:var(--brand); box-shadow:var(--shadow);}
  .prep-tool.active{border-color:var(--brand); background:var(--blue-bg);}
  .pt-main{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .pt-name{font-size:14px; font-weight:800; color:var(--ink);}
  .pt-tool{font-size:12px; color:var(--muted);}
  .pt-acts{flex-shrink:0;}

  /* 平台网页配置 */
  .platform-panel .cl-head{cursor:pointer; user-select:none;}
  .plat-head-acts{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .plat-head-acts .chev{font-size:12px;}
  .plat-body{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .plat-card{display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:11px 14px;}
  .plat-main{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .plat-name{font-size:14px; font-weight:800; color:var(--ink);}
  .plat-url{font-size:12px; color:#4c5bdf; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:520px;}
  .plat-meta{font-size:11px; color:var(--muted);}
  .plat-acts{display:flex; gap:6px; flex-shrink:0;}
  .plat-actions{flex-wrap:wrap;}
  .plat-login-hint{margin-top:14px; padding:12px 14px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:12px; font-size:13px; color:#1d4ed8;}
  .plat-test{margin-top:12px; padding:10px 14px; border-radius:10px; font-size:13px; font-weight:600; border:1px solid var(--line);}
  .plat-test.testing{background:#f8fafc; color:var(--muted);}
  .plat-test.ok{background:#ecfdf5; color:#059669; border-color:#a7f3d0;}
  .plat-test.warn{background:#fffbeb; color:#b45309; border-color:#fde68a;}
  .plat-test.fail{background:#fef2f2; color:#dc2626; border-color:#fecaca;}
  .plat-batch-acts{display:flex; gap:8px; margin-bottom:4px;}
  .plat-batch-login, .plat-batch-test{margin-top:4px; padding:12px 14px; background:#f8fafc; border:1px solid var(--line); border-radius:12px; font-size:13px; color:var(--ink);}
  .plat-batch-title{font-weight:800; margin-bottom:6px;}
  .plat-batch-now{margin:4px 0; color:#1d4ed8;}
  .plat-batch-results{margin-top:8px; display:flex; flex-direction:column; gap:3px;}
  .plat-batch-item{font-size:12px; color:var(--muted);}


  /* 操作举证截图 */
  .evidence-zone{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px;}
  .evidence-title{font-size:12px; font-weight:800; color:var(--ink2); margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .evidence-title .sub{font-weight:500; color:var(--muted);}
  .evidence-upload{display:flex; flex-direction:column; gap:8px;}
  .evidence-paste{border:2px dashed #c7d2fe; background:#fafbff; border-radius:10px; padding:14px; text-align:center; color:#6366f1; font-size:13px; cursor:pointer; transition:.15s;}
  .evidence-paste:hover{border-color:var(--brand); background:var(--blue-bg);}
  .evidence-drop{border:2px dashed #d1d5db; background:#f9fafb; border-radius:10px; padding:12px; text-align:center; color:#6b7280; font-size:12px; cursor:pointer; transition:.15s;}
  .evidence-drop:hover{border-color:var(--brand); background:var(--blue-bg); color:var(--brand);}
  .evidence-drop.drag-over{border-style:solid; border-color:var(--brand); background:var(--blue-bg); color:var(--brand); font-weight:700;}
  .evidence-zone.focused .evidence-paste{border-style:solid; border-color:var(--brand); background:var(--blue-bg); color:var(--brand); font-weight:700;}
  .evidence-img{display:flex; flex-direction:column; gap:8px; align-items:flex-start;}
  .evidence-img img{max-width:100%; max-height:220px; border-radius:8px; border:1px solid var(--line); display:block; cursor:zoom-in;}
  .evidence-file{display:flex; align-items:center; gap:10px;}
  .evidence-file-pill{display:flex; align-items:center; gap:8px; background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:8px 12px; max-width:100%;}
  .evidence-file-icon{font-size:18px;}
  .evidence-file-name{font-size:13px; color:var(--ink); word-break:break-all; max-width:420px;}

  /* 返回消息数据 */
  .msg-config{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px;}
  .msg-col{min-width:0;}
  .sub-label{font-size:12px; font-weight:700; color:var(--ink2); margin-bottom:5px; display:block;}
  .msg-col textarea{display:block; width:100%; max-width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; resize:vertical; font-family:inherit; color:var(--ink);}
  .msg-preview{margin-top:6px; padding:8px 10px; background:#f8fafc; border:1px solid var(--line); border-radius:8px; font-size:13px; line-height:1.6; min-height:20px; color:var(--ink); overflow-wrap:anywhere; word-break:break-word;}
  .msg-var{color:#2563eb; font-weight:700; background:#eef2ff; border-radius:4px; padding:0 3px;}
  .msg-pane{margin-top:14px;}
  .msg-template-line{font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.6;}
  .msg-out{min-height:44px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fbfcfe; margin-bottom:8px; overflow-wrap:anywhere; word-break:break-word;}
  .msg-text{font-size:14px; line-height:1.7; color:var(--ink); white-space:normal; word-break:break-word; overflow-wrap:anywhere;}

  .duid-preview{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
  .dp-head{font-size:13px; color:var(--ink2); margin-bottom:10px;}
  .dp-list{display:flex; flex-direction:column; gap:6px; max-height:260px; overflow:auto;}
  .dp-item{display:flex; align-items:center; gap:8px; padding:7px 10px; background:#f8fafc; border:1px solid var(--line); border-radius:8px; font-size:13px;}
  .dp-check{cursor:pointer; font-size:15px; user-select:none;}
  .dp-duid{font-family:ui-monospace,Consolas,monospace; font-weight:600; color:var(--ink); flex:1;}
  .dp-dup{font-size:11px; color:#b45309; background:var(--orange-bg); border-radius:6px; padding:2px 7px;}
  .dp-drop{opacity:.5;}
  .dp-drop-label{font-size:11px; color:var(--muted);}

  .work-batch-head{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px;}
  .wbh-icon{font-size:26px;}
  .wbh-main{flex:1; min-width:0;}
  .wbh-name{font-size:16px; font-weight:800;}
  .wbh-sub{font-size:12px; color:var(--muted); margin-top:3px;}
  .wbh-bar{width:180px; height:8px; background:#eef2ff; border-radius:99px; overflow:hidden;}
  .wbh-fill{height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); border-radius:99px;}

  .work-filter{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:16px;}
  .work-filter input{border:none; background:none; outline:none; font-size:13px; width:100%; color:var(--ink);}
  .work-filter select{border:1px solid var(--line); background:#fff; border-radius:8px; font-size:12px; color:var(--ink); padding:5px 8px; outline:none; flex-shrink:0;}

  .work-item-list{display:flex; flex-direction:column; gap:10px;}
  .work-item{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; transition:.15s;}
  .work-item:hover{border-color:var(--brand); box-shadow:var(--shadow);}
  .wi-main{flex:1; min-width:0;}
  .wi-top{display:flex; align-items:center; gap:8px;}
  .wi-duid{font-family:ui-monospace,Consolas,monospace; font-weight:700; color:var(--ink); font-size:14px;}
  .wi-status{font-size:11px; font-weight:700; border-radius:99px; padding:2px 9px;}
  .ws-doing{background:var(--blue-bg); color:#1d4ed8; border:1px solid var(--blue-bd);}
  .ws-wait{background:var(--orange-bg); color:#b45309; border:1px solid var(--orange-bd);}
  .ws-done{background:var(--green-bg); color:#047857; border:1px solid var(--green-bd);}
  .ws-detach{background:var(--purple-bg); color:#6d28d9; border:1px solid var(--purple-bd);}
  .wi-progress{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .wi-bar{flex:1; height:6px; background:#eef2ff; border-radius:99px; overflow:hidden;}
  .wi-fill{height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); border-radius:99px;}
  .wi-num{font-size:12px; color:var(--muted); font-weight:600;}
  .wi-cur{font-size:12px; color:var(--ink2); margin-top:5px;}
  .wi-remark{font-size:12px; color:#b45309; background:var(--orange-bg); border-radius:6px; padding:4px 8px; margin-top:6px; display:inline-block;}
  .wi-acts{display:flex; gap:6px; flex-shrink:0;}
  .btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
  .btn.danger{color:#dc2626; background:#fee2e2;}
  .btn.danger:hover{background:#fecaca;}

  .work-item-head{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px;}
  .wih-icon{font-size:26px;}
  .wih-main{flex:1; min-width:0;}
  .wih-name{font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .wih-sub{font-size:12px; color:var(--muted); margin-top:3px;}

  /* 输入文件删除标记 */
  .io-file-wrap{position:relative; display:inline-flex; align-items:center; max-width:100%;}
  .io-file-wrap .io-file{max-width:100%;}
  .io-file-del{position:absolute; top:-8px; right:-8px; width:19px; height:19px; border-radius:50%; background:#fee2e2; color:#dc2626; border:1px solid #fecaca; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transition:.15s; font-weight:700;}
  .io-file-wrap:hover .io-file-del{opacity:1;}
  .io-file-del:hover{background:#ef4444; color:#fff; border-color:#ef4444;}

  /* 多选引用（输入） */
  .ref-multi{display:flex; flex-direction:column; gap:12px; margin-top:10px;}
  .ref-group{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fbfcff;}
  .ref-group-title{font-size:12px; font-weight:800; color:var(--ink2); margin-bottom:8px;}
  .ref-opt-list{display:flex; flex-direction:column; gap:6px;}
  .ref-opt-row{display:flex; align-items:center; gap:12px; padding:3px 0;}
  .ref-opt-row .chk-line{flex:0 0 auto;}
  .ref-opt-row .chk-line.req{margin-left:auto; font-size:12px; color:#dc2626;}

  /* 数据预览 */

  /* 工具输入配置（录制表单） */

  .tc-cfg-id{flex:0 1 140px; width:auto; min-width:80px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; font-family:monospace; background:#fff; color:var(--ink);}
  .tc-cfg-name{width:130px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; color:var(--ink);}
  .tc-cfg-del{flex-shrink:0; border:none; background:#fee2e2; color:#dc2626; border-radius:8px; width:26px; height:26px; cursor:pointer; font-size:13px; line-height:1;}

  /* 节点输入项编辑（录制表单） */
  .in-items{background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px;}

  .in-item-row{display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px dashed var(--line); flex-wrap:nowrap;}
  .in-item-row:first-of-type{border-top:none;}
  .req-btn{flex-shrink:0; border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .req-btn.on{background:#fef3c7; color:#b45309; border-color:#fcd34d;}
  .in-item-name{flex:0 1 150px; width:auto; min-width:70px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; color:var(--ink);}
  .in-item-kind, .in-item-ref{padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; color:var(--ink);}
  .in-item-kind{flex-shrink:0;}
  .in-item-ref{flex:1 1 auto; min-width:60px; max-width:200px;}
  .in-item-ref optgroup{font-weight:600; color:var(--muted);}
  .in-item-file{color:var(--muted); font-size:12px; background:#eef2ff; padding:3px 8px; border-radius:6px;}
  .in-item-row.duidlist{background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:8px 10px; margin-top:8px;}

  .tc-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px dashed var(--line); flex-wrap:wrap;}
  .tc-row:first-of-type{border-top:none;}
  .tc-label{font-weight:600; color:var(--ink2); min-width:120px; display:flex; align-items:center; gap:6px;}
  .tc-body{flex:1; min-width:200px;}
  .tc-ref{color:var(--ink2); font-size:13px;}
  .tc-ref.warn{color:#b45309;}
  .tc-ref-file{cursor:pointer; color:#4c5bdf;}

  /* 工具输出文件 */

  .to-title{font-size:12px; font-weight:700; color:var(--ink2); margin-bottom:6px;}
  .tool-outputs .io-file{display:inline-flex; margin:0 6px 6px 0;}

  /* 紧凑输入条目：名称 + 来源标签 + 附件 */

  .io-entry-badge{font-size:11px; padding:1px 7px; border-radius:20px; font-weight:600; flex-shrink:0;}

</style>
</head>
<body>
<header>
  <div class="brand" onclick="goHome()">
    <div class="logo">M</div>
    <div><div class="app-name">MRDN 系统</div><div class="app-sub">业务操作手册 · 工作台</div></div>
  </div>
  <div class="top-actions">
    <div class="search"><span>🔍</span><input id="searchInput" placeholder="搜索流程 / 节点…" oninput="onSearch(this.value)"></div>
    <button class="btn btn-ghost" onclick="openTagManager()" title="管理节点标签（数据处理 / 网页操作 / 消息邮件…）">🏷 标签</button>
    <button class="btn btn-ghost" onclick="openDataDir()" title="打开数据文件夹（data.json + Excel）">📁 数据</button>
    <button class="btn btn-ghost" onclick="exportExcel()" title="导出一份带时间戳的 Excel 副本">📥 导出 Excel</button>
    <button class="btn btn-primary" onclick="recordNode()">＋ 录制节点</button>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ================= 状态 ================= */
let DATA = null;
let view = 'home';          // home | flow | record
let currentFlowId = null;
let searchTerm = '';
let editNodeId = null;
let selectedStepId = null;  // 操作台当前选中的节点
let insertAfterId = null;   // 录制节点时的插入位置（插到该节点后面，null=末尾）
let shotDataUrl = '';       // 新粘贴的截图 base64（未存盘）
let shotExistingPath = '';  // 已有截图相对路径（编辑时）
let shotPreview = '';       // 表单预览用 src
let stepDrafts = [];        // 操作指导步骤草稿 [{text, shotPath, shotDataUrl}]
let shotTargetIndex = -1;   // 当前贴图目标步骤索引（-1 = 未选中）
let toolCfgDrafts = [];   // 配置期工具输入槽位草稿 [{id,itemId}]（itemId=本节点输入项 id）
let toolManifest = null;  // 当前选中工具的声明（inputs/outputs 契约）
let inputItemDrafts = []; // 配置期节点输入项草稿 [{id,name,required,kind,file,refId,refLabel}]
let outputFileDrafts = []; // 配置期节点输出文件草稿 [{name,path}]（真实文件，如输出模板）
let urlDrafts = [];        // 配置期节点网页链接草稿 [{name,url}]

/* ===== 作业清单状态 ===== */
let flowTab = 'manual';      // manual=操作手册 | prep=作业准备 | work=作业清单
let workView = 'list';       // list=批次列表 | batch=批次详情 | item=单DUID作业
let currentBatchId = null;
let currentWorkItemId = null;
let workFilter = '';         // 作业清单筛选（DUID 子串）
let newBatchName = '';       // 新建批次名称草稿
let newBatchText = '';       // 新建批次粘贴 DUID 文本草稿
let duidPreview = [];        // 解析预览 DUID 列表 [{duid, keep}]
let workDoneSet = null;      // 作业模式下当前 DUID 的已完成节点 id 集合（null=用流程级进度）
let newBatchOpen = false;    // 是否展开「新建批次」面板
let expandedBatches = new Set();  // 批次列表里已展开的批次 id 集合
let workStatusFilter = '';   // 批次列表状态筛选（''=全部 | 进行中/等待批量/已完成/拆出）
let pendingEvidence = {};      // 步骤级「操作举证」（未随完成本步归档）：{stepId: {kind:'image'|'file', name, dataUrl}}
let evidenceTargetStepId = null; // 当前聚焦的证据粘贴区 stepId
let duidLists = {};            // 节点 DUID 清单缓存（供复制/展开）：{stepId: [duids]}
let msgCache = {};             // 节点步骤的「返回消息数据」缓存：{stepId: 生成的可粘贴消息}

/* ===== 作业准备（prep）独立模块状态 ===== */
let prepSelToolId = null;      // 作业准备里当前选中的工具 id（独立于操作手册 selectedStepId）
let prepEditToolId = null;     // 正在编辑的作业准备工具 id（null=新增）
let prepInputDrafts = [];      // 作业准备工具编辑期输入项草稿 [{id,name,kind:'file'}]
let prepToolCfgDrafts = [];    // 作业准备工具编辑期输入关联草稿 [{id,itemId}]
let prepToolManifest = null;   // 作业准备工具 manifest 缓存

/* ===== 平台网页配置（全局凭证）状态 ===== */
let platformPanelOpen = false;   // 作业准备内平台配置面板是否展开
let platformEditId = null;       // 正在编辑的平台 id（null=新增）
let platformDraft = null;        // 编辑草稿 {id,name,url,headers}
let platformTestState = null;    // 测试链接结果 {testing,result}
let platformLoginSid = null;     // 一键登录 session_id（进行中）
let batchLoginQueue = [];        // 批量登录：待登录平台 id 队列（非空=进行中）
let batchLoginIndex = 0;         // 批量登录：当前登录到第几个
let batchLoginSid = null;        // 批量登录：当前平台 session_id
let batchLoginResults = {};      // 批量登录：{platformId:'ok'|'fail'|'skip'}
let batchLoginCancelled = false; // 批量登录：用户是否点了取消
let batchTestState = null;       // 批量测试：{running,results:[{id,name,connected,status_code,message}]}

/* ================= 工具函数 ================= */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function allSteps(){ return DATA ? DATA.flows.flatMap(f=>f.steps) : []; }
function findStep(id){ for(const f of DATA.flows) for(const s of f.steps) if(s.id===id) return s; return null; }
function flowOfStep(id){ for(const f of DATA.flows) if(f.steps.some(s=>s.id===id)) return f; return null; }
function findChecklistItem(f, id){ return (f && f.checklist) ? f.checklist.find(c=>c.id===id) : null; }
function countTool(){ return allSteps().filter(s=>s.tool).length; }
function countFiles(){ return allSteps().reduce((n,s)=>n+(s.files?s.files.length:0),0); }

/* ===== 工具输入槽位 ===== */
// 输入项类型标签
function inputKindLabel(k){ return {file:'临时拖入', checklist:'引用清单', node:'引用节点输出', desc:'仅描述', duidlist:'批次DUID清单'}[k] || '临时拖入'; }

/* ===== 临时拖入文件（作业上下文隔离，不进入框架） ===== */
// 当前作业上下文的临时文件容器：批次作业 → batch.tempFiles；单 DUID 作业 → workItem.tempFiles；操作手册 → null
function tempFileContext(f){
  if(workView === 'flow' && currentBatchId){
    const b = (f.batches||[]).find(x=>x.id===currentBatchId);
    return b ? {owner:b} : null;
  }
  if(workView === 'item' && currentWorkItemId){
    const w = (f.workItems||[]).find(x=>x.id===currentWorkItemId);
    return w ? {owner:w} : null;
  }
  return null;
}
function getTempFile(f, stepId, itemId){
  const ctx = tempFileContext(f);
  if(!ctx) return null;
  const perStep = (ctx.owner.tempFiles || {})[stepId] || {};
  return perStep[itemId] || null;
}
function setTempFile(f, stepId, itemId, file){
  const ctx = tempFileContext(f);
  if(!ctx) return null;
  if(!ctx.owner.tempFiles) ctx.owner.tempFiles = {};
  if(!ctx.owner.tempFiles[stepId]) ctx.owner.tempFiles[stepId] = {};
  ctx.owner.tempFiles[stepId][itemId] = file;
  return ctx.owner;
}
function removeTempFile(f, stepId, itemId){
  const ctx = tempFileContext(f);
  if(!ctx) return;
  const perStep = (ctx.owner.tempFiles || {})[stepId];
  if(perStep) delete perStep[itemId];
}

// 解析输入项的实际文件引用 {name,path}：file→临时文件(优先)/item.file，checklist→清单项file，node→目标节点输出；desc→null（仅描述）
function resolveInputItemFile(f, s, item){
  if(!item) return null;
  if(item.kind === 'file'){
    const tmp = getTempFile(f, s.id, item.id);
    if(tmp) return tmp;
    return item.file || null;
  }
  if(item.kind === 'checklist'){ const c = findChecklistItem(f, item.refId); return (c && c.file) ? c.file : null; }
  if(item.kind === 'node'){ return resolveNodeOutputFile(item.refId, item.refFile); }
  return null;
}
// 收集某节点所有可能的输出文件（按优先级：运行结果 → 输出文件(模板) → 旧文字文件名），按 name 去重
function nodeOutputFiles(t){
  if(!t) return [];
  const out = [];
  const results = (t.output && t.output.results) || [];
  const outFiles = (t.output && t.output.files) || [];
  const legacy = (t.files && t.files.length) ? t.files.map(f=>({name:f.name, path:f.name})) : [];
  results.forEach(r=>{ if(r && r.name) out.push({name:r.name, path:r.rel || r.name}); });
  outFiles.forEach(f=>{ if(f && f.name) out.push({name:f.name, path:f.path || f.name}); });
  legacy.forEach(f=>{ if(f && f.name) out.push({name:f.name, path:f.path || f.name}); });
  const seen = new Set(); const dedup = [];
  for(const x of out){ if(!seen.has(x.name)){ seen.add(x.name); dedup.push(x); } }
  return dedup;
}
// 解析「引用节点输出」的实际文件：指定 refFile 则取对应文件，否则取第一个（运行结果 → 输出文件 → 旧文字文件名）
function resolveNodeOutputFile(refId, refFile){
  const t = findStep(refId);
  if(!t) return null;
  const all = nodeOutputFiles(t);
  if(!all.length) return null;
  if(refFile){
    const hit = all.find(x=>x.name === refFile);
    if(hit) return {name: hit.name, path: hit.path};
  }
  return {name: all[0].name, path: all[0].path};
}
// 工具槽位：仅关联本节点的某个输入项（或输出文件），再解析其文件引用
function resolveToolInputRef(f, s, cfg){
  if(!cfg || !cfg.itemId) return null;
  const id = cfg.itemId;
  if(id === '__duid_list__') return { name:'DUID 清单（批次动态）', path:'__duid_list__' };
  if(String(id).startsWith('pf_')){
    const pid = String(id).slice(3);
    const p = allPlatforms().find(x=>x.id === pid);
    return { name: (p ? p.name : '平台') + '（平台凭证）', path: id };
  }
  if(String(id).startsWith('out_')){
    const files = (s && s.output && s.output.files) || [];
    return files.find(x=>x.id === id) || null;
  }
  const item = ((s && s.input && s.input.items) || []).find(x=>x.id === cfg.itemId);
  return item ? resolveInputItemFile(f, s, item) : null;
}
// 工具槽位别名（= 本节点被关联输入项名称 / 输出文件名）
function toolRefLabel(s, cfg){
  if(!cfg || !cfg.itemId) return '';
  const id = cfg.itemId;
  if(id === '__duid_list__') return 'DUID 清单（批次动态）';
  if(String(id).startsWith('pf_')){
    const pid = String(id).slice(3);
    const p = allPlatforms().find(x=>x.id === pid);
    return p ? (p.name + '（平台凭证）') : '平台凭证';
  }
  if(String(id).startsWith('out_')){
    const files = (s && s.output && s.output.files) || [];
    const f = files.find(x=>x.id === id);
    return f ? f.name : '';
  }
  const item = ((s && s.input && s.input.items) || []).find(x=>x.id === cfg.itemId);
  return item ? (item.name || item.id) : '';
}

// 生成文件药丸：📄 文件名（可点击预览）+ 可选删除 ✕
function filePill(file, delFn){
  if(!file) return '';
  const del = delFn ? `<span class="io-file-del" onclick="${delFn}" title="移除">✕</span>` : '';

async function hydrateImages(){
  const imgs = document.querySelectorAll('img.file-img');
  for(const img of imgs){
    const rel = img.getAttribute('data-src');
    if(!rel || img.dataset.loaded) continue;
    img.dataset.loaded = '1';
    try{
      const r = await pywebview.api.get_shot(rel);
      if(r && r.ok && r.data){ img.src = r.data; }
    }catch(e){}
  }
}

/* ===== 批量登录 / 批量测试 ===== */
function startBatchLogin(){
  const ps = allPlatforms();
  if(!ps.length){ toast('还没有平台配置，请先新增平台'); return; }
  batchLoginQueue = ps.map(p=>p.id);
  batchLoginIndex = 0;
  batchLoginResults = {};
  batchLoginSid = null;
  batchLoginCancelled = false;
  render();
  beginNextBatchLogin();
}

async function beginNextBatchLogin(){
  if(batchLoginCancelled){
    batchLoginCancelled = false;
    batchLoginQueue = [];
    batchLoginSid = null;
    render();
    toast('已取消批量登录');
    return;
  }
  if(batchLoginIndex >= batchLoginQueue.length){
    const ok = Object.values(batchLoginResults).filter(v=>v==='ok').length;
    const total = Object.keys(batchLoginResults).length;
    batchLoginQueue = [];
    batchLoginSid = null;
    render();
    toast(`批量登录完成：${ok}/${total} 个平台已抓取 Cookie`);
    return;
  }
  const pid = batchLoginQueue[batchLoginIndex];
  const p = allPlatforms().find(x=>x.id===pid);
  if(!p || !(p.url||'').trim()){
    batchLoginResults[pid] = 'skip';
    batchLoginIndex++;
    render();
    beginNextBatchLogin();
    return;
  }
  const r = await pywebview.api.start_platform_login((p.url||'').trim());
  if(!r || !r.ok){
    batchLoginResults[pid] = 'fail';
    batchLoginIndex++;
    render();
    toast((r&&r.error)||'启动浏览器失败');
    beginNextBatchLogin();
    return;
  }
  batchLoginSid = r.session_id;
  render();
  toast(`${p.name}：浏览器已打开，登录完成后将自动抓取 Cookie 并继续下一个`);

  const result = await waitLoginDone(r.session_id);
  batchLoginSid = null;
  if(batchLoginCancelled){
    batchLoginCancelled = false;
    batchLoginQueue = [];
    render();
    toast('已取消批量登录');
    return;
  }
  if(result && result.ok && result.auto_detected && p){
    if(result.url) p.url = result.url;
    p.headers = result.headers || {};
    p.updatedAt = new Date().toISOString().slice(0,16).replace('T',' ');
    batchLoginResults[pid] = 'ok';
    await saveData();
    toast(`${p.name}：登录成功，Cookie 已保存`);
  } else if(result && result.cancelled){
    batchLoginResults[pid] = 'skip';
  } else {
    batchLoginResults[pid] = 'fail';
    toast(`${p.name}：未检测到登录完成（${(result&&result.error)||'超时'}）`);
  }
  batchLoginIndex++;
  render();
  beginNextBatchLogin();
}

async function waitLoginDone(sid){
  for(let i=0;i<240;i++){
    let r;
    try{ r = await pywebview.api.check_platform_login(sid); }
    catch(e){ return {ok:false, error:String(e)}; }
    if(r && r.done) return r.result;
    await new Promise(res=>setTimeout(res,1000));
  }
  return {ok:false, error:'登录超时（3分钟）'};
}

async function cancelBatchLogin(){
  batchLoginCancelled = true;
  if(batchLoginSid){
    const sid = batchLoginSid;
    try{ await pywebview.api.cancel_platform_login(sid); }catch(e){}
  }
  toast('正在取消批量登录…');
}

async function startBatchTest(){
  const ps = allPlatforms();
  if(!ps.length){ toast('还没有平台配置'); return; }
  batchTestState = { running:true, results: ps.map(p=>({id:p.id, name:p.name, connected:null, status_code:null, message:'等待测试…'})) };
  render();
  for(let i=0;i<ps.length;i++){
    const p = ps[i];
    let r;
    try{ r = await pywebview.api.test_platform_connection(p.id); }
    catch(e){ r = {ok:false, connected:false, message:'测试异常：'+e}; }
    batchTestState.results[i] = { id:p.id, name:p.name, connected: !!(r&&r.connected), status_code: r&&r.status_code, message: (r&&r.message)||'无响应' };
    render();
  }
  batchTestState.running = false;
  render();
  const ok = batchTestState.results.filter(x=>x.connected).length;
  toast(`测试完成：${ok}/${ps.length} 个平台连接成功`);
}

}

/* 作业准备输入文件拖入 */
function setupPrepDropZones(){
  const zones = document.querySelectorAll('[data-drop]');
  zones.forEach(zone=>{
    if(zone.dataset.bound) return;
    zone.dataset.bound = '1';
    const dropKey = zone.dataset.drop;
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=>{ zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{ handlePrepInputItemDrop(dropKey, file.name, ev.target.result); };
      reader.readAsDataURL(file);
    });
  });
}

async function handlePrepInputItemDrop(dropKey, fileName, dataUrl){
  if(!dropKey || !dropKey.startsWith('prepitem:')) return;
  const itemId = dropKey.slice(9);
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  if(!f) return;
  const prep = prepContext(f);
  const item = prep.inputItems.find(x=>x.id===itemId);
  if(!item) return;
  try{
    const r = await pywebview.api.save_input_file(fileName, dataUrl);
    if(!r || !r.ok){ toast('❌ 添加失败：'+(r&&r.error)); return; }
    item.file = { name: r.name, path: r.path };
    await saveData();
    render();
    toast('✅ 已添加文件：'+r.name);
  }catch(e){ toast('❌ 添加失败：'+e); }
}

async function removePrepInputFile(itemId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  if(!f) return;
  const prep = prepContext(f);
  const item = prep.inputItems.find(x=>x.id===itemId);
  if(item) item.file = null;

  toast('已移除输入文件');
}

async function buildPrepToolArgs(t){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  const prep = prepContext(f);
  const cfg = t.config || [];
  const args = [];
  const missing = [];
  for(const c of cfg){
    if(!c.id) continue;
    if(c.itemId === '__duid_list__'){
      try{
        const r = await pywebview.api.make_duid_list_file(prep.duids);
        if(r && r.ok && r.path) args.push('--'+c.id, r.path);
        else missing.push('DUID 清单');
      }catch(e){ missing.push('DUID 清单'); }
      continue;
    }
    if(c.itemId && c.itemId.startsWith('pf_')){
      const pid = c.itemId.slice(3);
      try{
        const r = await pywebview.api.make_platform_config_file(pid);
        if(r && r.ok && r.path) args.push('--'+c.id, r.path);
        else missing.push('平台凭证(' + ((r && r.name) || pid) + ')');
      }catch(e){ missing.push('平台凭证'); }
      continue;
    }
    const it = (prep.inputItems||[]).find(x=>x.id===c.itemId);
    if(!it) continue;
    const file = it.file;
    if(!file || !file.path){ missing.push(it.name || '输入项'); continue; }
    let abs = null;
    try{ const r = await pywebview.api.resolve_file(file.path); if(r && r.path) abs = r.path; }catch(e){}
    if(!abs){ missing.push(it.name || '输入项'); continue; }
    args.push('--'+c.id, abs);
  }
  return { args, missing };
}

async function runPrepTool(toolId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  if(!f) return;
  const prep = prepContext(f);
  const t = prep.tools.find(x=>x.id===toolId);
  if(!t) return;
  const btn = document.getElementById('preprunbtn-'+toolId);
  const box = document.getElementById('preplogbox-'+toolId);
  const body = document.getElementById('preplogbody-'+toolId);
  const empty = document.getElementById('preplogempty-'+toolId);
  if(!btn || !box || !body) return;
  if(empty) empty.style.display = 'none';
  btn.disabled = true; btn.textContent = '⏳ 运行中…';
  box.style.display = 'block';
  body.innerHTML = '<span style="color:#94a3b8">正在准备输入文件…</span>';

  const prepArgs = await buildPrepToolArgs(t);
  if(prepArgs.missing && prepArgs.missing.length){
    btn.disabled = false; btn.textContent = '▶ 运行';
    body.innerHTML = '<div class="log-status err">❌ 缺少输入：' + esc(prepArgs.missing.join('、')) + '</div>';
    return;
  }
  body.innerHTML = '<span style="color:#94a3b8">正在运行 ' + esc(t.name) + ' …</span>';
  let res;
  try{ res = await pywebview.api.run_tool(t.name, prepArgs.args); }
  catch(e){ res = {ok:false, log:'调用失败：'+e}; }
  btn.disabled = false; btn.textContent = '▶ 运行';
  body.innerHTML = renderRunResult(res);
  const outResultBody = document.getElementById('prepoutresult-'+toolId);
  if(outResultBody) outResultBody.innerHTML = renderPrepOutputs((res && res.outputs) || [], toolId);
  if(res && Array.isArray(res.outputs)){
    if(!t.output) t.output = {};
    t.output.results = res.outputs.map(o=>({name:o.name, rel:o.rel}));
    await saveData();
    if(res.outputs.length){
      const o = res.outputs.find(x=>/\.(xlsx|xlsm)$/i.test(x.name||x.rel||''))
             || res.outputs.find(x=>/\.(csv|txt|log|md|json)$/i.test(x.name||x.rel||''))
             || res.outputs.find(x=>/\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(x.name||x.rel||''))
             || res.outputs[0];
      if(o && (o.rel || o.name)) await previewFile(o.rel || o.name, toolId);
    }
  }
}

    <div class="back" onclick="goHome()">← 返回工作台</div>
    <div class="flow-detail-head">
      <div class="fico" style="background:${f.color}22;">${f.icon}</div>
      <div><h1>${esc(f.name)}</h1><div class="goal">🎯 ${esc(f.goal)}</div></div>
      <div class="acts">
        <button class="btn btn-ghost" onclick="recordNode('${f.id}')">＋ 加节点</button>
        <button class="btn btn-ghost" onclick="deleteFlow('${f.id}')">删除流程</button>
      </div>
    </div>
    ${renderFlowTabs(f)}
    ${renderChecklist(f)}
    ${renderFlowBar(f)}

}

/* ===== 进度状态 ===== */
function currentStepId(f){
  const done = workDoneSet || new Set((f.progress && f.progress.done) || []);
  const s = f.steps.find(x => !done.has(x.id));
  return s ? s.id : null;
}
function stepStatus(f, s){
  const done = workDoneSet || new Set((f.progress && f.progress.done) || []);
  if(done.has(s.id)) return 'done';
  return s.id === currentStepId(f) ? 'active' : 'todo';
}

function renderFlowBar(f){
  let html = '<div class="flowbar-wrap"><div class="flowbar">';
  f.steps.forEach((s, i)=>{
    // 操作手册：选中高亮、未选中置灰；作业视图：按进度 done/active/todo
    const cls = (flowTab === 'manual') ? (s.id === selectedStepId ? 'selected' : 'todo') : stepStatus(f, s);
    const icons = [];
    if(s.screenshot) icons.push('📷');
    if(s.tool) icons.push('🔧');
    if(s.files && s.files.length) icons.push('📁');
    const tagMark = s.tag ? `<span class="fnode-tag" title="${esc(tagName(s.tag))}">${tagIcon(s.tag)}</span>` : '';
    html += `<div class="fnode ${cls}" onclick="selectStep('${s.id}')">
      <div class="fdot">${s.seq}</div>
      <div class="fnode-name">${esc(s.name)}${tagMark}</div>
      <div class="fnode-icons">${icons.join('')}</div>
      <div class="fnode-arrow">▼</div>
    </div>`;
    if(i < f.steps.length-1){
      html += `<div class="fconn ${cls==='done'?'done':''}"></div>`;
    }
  });
  html += '</div></div>';
  return html;
}

    <div class="field"><label>说明（这份资料是干嘛的）</label>
      <input type="text" id="cl_desc" value="${esc(item?item.desc:'')}" placeholder="如：客户名称与编码对照"></div>
    <div class="field"><label>关联文件（可选）</label>

  document.body.appendChild(m);

  document.getElementById('cl_cancel').onclick = function(){ m.remove(); };
  renderChecklistFileBox();

  dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', function(){ dz.classList.remove('drag-over'); });

    e.preventDefault(); dz.classList.remove('drag-over');

function renderChecklistFileBox(){

    : '';

function clearChecklistFile(){ checklistEditorFile = null; renderChecklistFileBox(); }
function saveChecklistItem(){
  const name = document.getElementById('cl_name').value.trim();
  if(!name){ toast('请填资料名称'); return; }
  const desc = document.getElementById('cl_desc').value.trim();

  if(!f) return;
  f.checklist = f.checklist || [];

  } else {
