function sqAllocOf(code, idx){
  const grp = sqChoices[code];
  return grp ? (grp[idx] || null) : null;
}

function sqTotalAllocCount(){
  let n = 0;
  Object.keys(sqChoices).forEach(code=>{
    const grp = sqChoices[code] || {};
    Object.keys(grp).forEach(idx=>{ n += (grp[idx].allocs || []).length; });
  });
  return n;
}

function toggleSqAlloc(i, idx){
  const key = i+'-'+idx;
  sqAllocOpen[key] = !sqAllocOpen[key];
  const tr = document.getElementById('sq-alloc-'+key);
  if(tr) tr.style.display = sqAllocOpen[key] ? '' : 'none';
}

function sqAllocRemain(code, idx, excludeDuid){
  const grp = sqAllocOf(code, idx);
  const recs = (sqResult && sqResult.byItem && sqResult.byItem[code]) || [];
  const rec = recs[idx];
  const remain = Math.max(0, Number((rec && rec.remain) || 0));
  if(!grp) return remain;
  const others = (grp.allocs || []).reduce((s,a)=> s + (a.duid===excludeDuid ? 0 : (Number(a.useQty)||0)), 0);
  return Math.max(0, remain - others);
}

function toggleSqAllocDu(i, idx, di, checked){
  const code = (sqResult && sqResult.order) ? sqResult.order[i] : null;
  if(code == null) return;
  const recs = (sqResult && sqResult.byItem && sqResult.byItem[code]) || [];
  const rec = recs[idx];
  if(!rec) return;
  const row = sqRowOf(code);
  const du = (row.duids || [])[di];
  if(!du) return;
  const duid = du.duid;
  if(checked){
    if(!sqChoices[code]) sqChoices[code] = {};
    if(!sqChoices[code][idx]) sqChoices[code][idx] = { contractNumber: rec.contractNumber, financialCode: rec.financialCode, type: row.type || '', allocs: [] };
    const grp = sqChoices[code][idx];
    if(!grp.allocs.some(a=>a.duid===duid)){
      let qty = du.qty;
      const maxForThis = sqAllocRemain(code, idx, duid);
      if((Number(qty)||0) > maxForThis){
        qty = maxForThis;
        if(maxForThis <= 0){
          toast('该合同余量已分配完，无法再分配给此 DU');
          const chk = document.querySelector('.sq-alloc-chk[data-i="'+i+'"][data-idx="'+idx+'"][data-dui="'+di+'"]');
          if(chk) chk.checked = false;
          return;
        }
        toast('该合同余量不足，此 DU 数量已限制为 ' + maxForThis);
      }
      grp.allocs.push({ duid: duid, useQty: qty });
      const inp = document.getElementById('sq-qty-'+i+'-'+idx+'-'+di);
      if(inp) inp.value = qty;
    }
  } else {
    const grp = sqAllocOf(code, idx);
    if(grp){
      grp.allocs = grp.allocs.filter(a=>a.duid!==duid);
      if(!grp.allocs.length){ delete sqChoices[code][idx]; }
    }
  }
  refreshSqRow(i, idx);
  refreshSqChosenCount();
}

function setSqAllocQty(i, idx, di, val){
  const code = (sqResult && sqResult.order) ? sqResult.order[i] : null;
  if(code == null) return;
  const recs = (sqResult && sqResult.byItem && sqResult.byItem[code]) || [];
  const rec = recs[idx];
  const du = (sqRowOf(code).duids || [])[di];
  if(!du || !rec) return;
  const duid = du.duid;
  let grp = sqAllocOf(code, idx);
  let a = grp ? grp.allocs.find(x=>x.duid===duid) : null;
  const numVal = Number(val) || 0;
  // 直接填数量（未勾选）→ 自动勾选并创建分配
  if(!a && numVal > 0){
    if(!sqChoices[code]) sqChoices[code] = {};
    if(!sqChoices[code][idx]) sqChoices[code][idx] = { contractNumber: rec.contractNumber, financialCode: rec.financialCode, type: sqRowOf(code).type || '', allocs: [] };
    grp = sqChoices[code][idx];
    grp.allocs.push({ duid: duid, useQty: 0 });
    a = grp.allocs[grp.allocs.length-1];
    const chk = document.querySelector('.sq-alloc-chk[data-i="'+i+'"][data-idx="'+idx+'"][data-dui="'+di+'"]');
    if(chk) chk.checked = true;
  }
  if(!a) return;
  const maxForThis = sqAllocRemain(code, idx, duid);
  let newVal = numVal;
  if(newVal > maxForThis){
    newVal = maxForThis;
    const inp = document.getElementById('sq-qty-'+i+'-'+idx+'-'+di);
    if(inp) inp.value = newVal;
    toast('该合同余量 ' + (Number(rec.remain)||0) + '，此 DU 最多可分配 ' + maxForThis);
  }
  a.useQty = newVal;
  refreshSqRow(i, idx);
  refreshSqChosenCount();
}

function refreshSqRow(i, idx){
  const code = (sqResult && sqResult.order) ? sqResult.order[i] : null;
  if(code == null) return;
  const grp = sqAllocOf(code, idx);
  const allocs = grp ? (grp.allocs || []) : [];
  const sel = allocs.length > 0;
  const btn = document.getElementById('sq-btn-'+i+'-'+idx);
  if(btn){
    btn.textContent = sel ? ('✓ '+allocs.length+' DU') : '分配';
    btn.classList.toggle('btn-primary', sel);
    btn.classList.toggle('btn-ghost', !sel);
    const tr = btn.closest('tr');
    if(tr) tr.classList.toggle('aq-sel-row', sel);
  }
  const sumEl = document.getElementById('sq-sum-'+i+'-'+idx);
  if(sumEl){
    const sum = allocs.reduce((s,a)=>s+(Number(a.useQty)||0), 0);
    sumEl.textContent = sum ? ('合计 '+sum) : '';
  }
  const grpAll = sqChoices[code] || {};
  let duCount = 0, contractCount = 0;
  Object.keys(grpAll).forEach(k=>{ const al = grpAll[k].allocs || []; if(al.length){ contractCount++; duCount += al.length; } });
  const gs = document.getElementById('sq-group-sum-'+i);
  if(gs) gs.textContent = contractCount ? ('✓ '+contractCount+'合同 · '+duCount+'DU') : '';
}

function refreshSqChosenCount(){
  const el = document.getElementById('sq-chosen-count');
  if(el) el.textContent = '已分配 ' + sqTotalAllocCount() + ' 个 DU';
}

function sqRowOf(code){
  return (shortageRows() || []).find(x=>x.itemcode===code) || {};
}

async function confirmShortageQuery(){
  const f = currentAnchorFlow();
  if(!f) return;
  const selections = [];
  for(const code of Object.keys(sqChoices)){
    const grp = sqChoices[code] || {};
    const duids = sqRowOf(code).duids || [];
    Object.keys(grp).forEach(idx=>{
      const c = grp[idx];
      (c.allocs || []).forEach(a=>{
        const du = duids.find(d=>d.duid===a.duid);
        const useQty = (a.useQty !== undefined && a.useQty !== null && String(a.useQty).trim() !== '')
          ? a.useQty : (du ? du.qty : '');
        selections.push({
          itemcode: code,
          contractNumber: c.contractNumber,
          financialCode: c.financialCode,
          qty: useQty,
          type: c.type,
          duid: a.duid,
        });
      });
    });
  }
  if(!selections.length){ toast('请先给缺料 DU 分配合同和数量'); return; }
  for(const s of selections){
    const q = parseFloat(s.qty);
    if(isNaN(q) || q <= 0){ toast('itemcode ' + s.itemcode + '（' + s.duid + '）未填写有效分配数量'); return; }
  }
  const btn = document.getElementById('sq-confirm');
  if(btn){ btn.disabled = true; btn.textContent = '⏳ 生成中…'; }
  let r;
  try{ r = await pywebview.api.gen_shortage_cpq(f.id, selections); }
  catch(e){ r = {ok:false, error:String(e)}; }
  if(btn){ btn.disabled = false; btn.textContent = '✅ 生成 CPQ 表'; }
  if(!r || !r.ok){ showError('生成 CPQ 表失败', (r && r.error) || '未知'); return; }
  sqOutputRel = r.rel || '';
  renderShortageQueryResult();
  toast('已生成 CPQ 表（主设备 ' + r.count + ' 行）');
}

/* ===== 批量登录 / 批量测试 ===== */
function startBatchLogin(){
  const ps = allPlatforms();
  if(!ps.length){ toast('还没有平台配置，请先新增平台'); return; }
  batchLoginQueue = ps.map(p=>p.id);
  batchLoginIndex = 0;
  batchLoginResults = {};
  batchLoginSid = null;
  batchLoginCancelled = false;
  render();
  beginNextBatchLogin();
}

async function beginNextBatchLogin(){
  if(batchLoginCancelled){
    batchLoginCancelled = false;
    batchLoginQueue = [];
    batchLoginSid = null;
    render();
    toast('已取消批量登录');
    return;
  }
  if(batchLoginIndex >= batchLoginQueue.length){
    const ok = Object.values(batchLoginResults).filter(v=>v==='ok').length;
    const total = Object.keys(batchLoginResults).length;
    batchLoginQueue = [];
    batchLoginSid = null;
    render();
    toast(`批量登录完成：${ok}/${total} 个平台已抓取 Cookie`);
    return;
  }
  const pid = batchLoginQueue[batchLoginIndex];
  const p = allPlatforms().find(x=>x.id===pid);
  if(!p || !(p.url||'').trim()){
    batchLoginResults[pid] = 'skip';
    batchLoginIndex++;
    render();
    beginNextBatchLogin();
    return;
  }
  const r = await pywebview.api.start_platform_login((p.url||'').trim());
  if(!r || !r.ok){
    batchLoginResults[pid] = 'fail';
    batchLoginIndex++;
    render();
    toast((r&&r.error)||'启动浏览器失败');
    beginNextBatchLogin();
    return;
  }
  batchLoginSid = r.session_id;
  render();
  toast(`${p.name}：浏览器已打开，登录完成后将自动抓取 Cookie 并继续下一个`);

  const result = await waitLoginDone(r.session_id);
  batchLoginSid = null;
  if(batchLoginCancelled){
    batchLoginCancelled = false;
    batchLoginQueue = [];
    render();
    toast('已取消批量登录');
    return;
  }
  if(result && result.ok && result.auto_detected && p){
    if(result.url) p.url = result.url;
    p.headers = result.headers || {};
    p.updatedAt = new Date().toISOString().slice(0,16).replace('T',' ');
    batchLoginResults[pid] = 'ok';
    await saveData();
    toast(`${p.name}：登录成功，Cookie 已保存`);
  } else if(result && result.cancelled){
    batchLoginResults[pid] = 'skip';
  } else {
    batchLoginResults[pid] = 'fail';
    toast(`${p.name}：未检测到登录完成（${(result&&result.error)||'超时'}）`);
  }
  batchLoginIndex++;
  render();
  beginNextBatchLogin();
}

async function waitLoginDone(sid){
  for(let i=0;i<240;i++){
    let r;
    try{ r = await pywebview.api.check_platform_login(sid); }
    catch(e){ return {ok:false, error:String(e)}; }
    if(r && r.done) return r.result;
    await new Promise(res=>setTimeout(res,1000));
  }
  return {ok:false, error:'登录超时（3分钟）'};
}

async function cancelBatchLogin(){
  batchLoginCancelled = true;
  if(batchLoginSid){
    const sid = batchLoginSid;
    try{ await pywebview.api.cancel_platform_login(sid); }catch(e){}
  }
  toast('正在取消批量登录…');
}

async function startBatchTest(){
  const ps = allPlatforms();
  if(!ps.length){ toast('还没有平台配置'); return; }
  batchTestState = { running:true, results: ps.map(p=>({id:p.id, name:p.name, connected:null, status_code:null, message:'等待测试…'})) };
  render();
  for(let i=0;i<ps.length;i++){
    const p = ps[i];
    let r;
    try{ r = await pywebview.api.test_platform_connection(p.id); }
    catch(e){ r = {ok:false, connected:false, message:'测试异常：'+e}; }
    batchTestState.results[i] = { id:p.id, name:p.name, connected: !!(r&&r.connected), status_code: r&&r.status_code, message: (r&&r.message)||'无响应' };
    render();
  }
  batchTestState.running = false;
  render();
  const ok = batchTestState.results.filter(x=>x.connected).length;
  toast(`测试完成：${ok}/${ps.length} 个平台连接成功`);
}

}

/* 作业准备输入文件拖入 */
function setupPrepDropZones(){
  const zones = document.querySelectorAll('[data-drop]');
  zones.forEach(zone=>{
    if(zone.dataset.bound) return;
    zone.dataset.bound = '1';
    const dropKey = zone.dataset.drop;
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=>{ zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{ handlePrepInputItemDrop(dropKey, file.name, ev.target.result); };
      reader.readAsDataURL(file);
    });
  });
}

async function handlePrepInputItemDrop(dropKey, fileName, dataUrl){
  if(!dropKey || !dropKey.startsWith('prepitem:')) return;
  const itemId = dropKey.slice(9);
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  if(!f) return;
  const prep = prepContext(f);
  const item = prep.inputItems.find(x=>x.id===itemId);
  if(!item) return;
  try{
    const r = await pywebview.api.save_input_file(fileName, dataUrl);
    if(!r || !r.ok){ toast('❌ 添加失败：'+(r&&r.error)); return; }
    item.file = { name: r.name, path: r.path };
    await saveData();
    render();
    toast('✅ 已添加文件：'+r.name);
  }catch(e){ toast('❌ 添加失败：'+e); }
}

async function removePrepInputFile(itemId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);

async function buildPrepToolArgs(t){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  const prep = prepContext(f);
  const cfg = t.config || [];
  const args = [];
  const missing = [];
  for(const c of cfg){
    if(!c.id) continue;
    if(c.itemId === '__duid_list__'){
      try{
        const r = await pywebview.api.make_duid_list_file(prep.duids);
        if(r && r.ok && r.path) args.push('--'+c.id, r.path);
        else missing.push('DUID 清单');
      }catch(e){ missing.push('DUID 清单'); }
      continue;
    }
    if(c.itemId === '__itemcode_list__'){
      const codes = Array.from(anchorChecked);
      if(!codes.length){ missing.push('itemcode 清单（作业锚点勾选）'); continue; }
      try{
        const r = await pywebview.api.make_itemcode_list(codes);
        if(r && r.ok && r.path) args.push('--'+c.id, r.path);
        else missing.push('itemcode 清单');
      }catch(e){ missing.push('itemcode 清单'); }
      continue;
    }
    if(c.itemId && c.itemId.startsWith('pf_')){
      const pid = c.itemId.slice(3);
      try{
        const r = await pywebview.api.make_platform_config_file(pid);
        if(r && r.ok && r.path) args.push('--'+c.id, r.path);
        else missing.push('平台凭证(' + ((r && r.name) || pid) + ')');
      }catch(e){ missing.push('平台凭证'); }
      continue;
    }
    if(c.itemId && c.itemId.startsWith('node_')){
      const stepId = c.itemId.slice(5);
      const ref = resolveNodeOutputFile(stepId, null);
      if(!ref){ missing.push('节点输出'); continue; }
      let abs = null;
      try{ const r = await pywebview.api.resolve_file(ref.path); if(r && r.path) abs = r.path; }catch(e){}
      if(!abs){ missing.push(ref.name || '节点输出'); continue; }
      args.push('--'+c.id, abs);
      continue;
    }
    if(c.itemId && c.itemId.startsWith('cl_')){
      const clId = c.itemId.slice(3);
      const cl = ((f&&f.checklist)||[]).find(x=>x.id===clId);
      if(!cl || !cl.file || !cl.file.path){ missing.push('初始清单'); continue; }
      let abs = null;
      try{ const r = await pywebview.api.resolve_file(cl.file.path); if(r && r.path) abs = r.path; }catch(e){}
      if(!abs){ missing.push(cl.name || '初始清单'); continue; }
      args.push('--'+c.id, abs);
      continue;
    }
    const it = (prep.inputItems||[]).find(x=>x.id===c.itemId);
    if(!it) continue;
    const file = it.file;
    if(!file || !file.path){ missing.push(it.name || '输入项'); continue; }
    let abs = null;
    try{ const r = await pywebview.api.resolve_file(file.path); if(r && r.path) abs = r.path; }catch(e){}
    if(!abs){ missing.push(it.name || '输入项'); continue; }
    args.push('--'+c.id, abs);
  }
  return { args, missing };
}

async function runPrepTool(toolId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  if(!f) return;
  const prep = prepContext(f);
  const t = prep.tools.find(x=>x.id===toolId);
  if(!t) return;
  const btn = document.getElementById('preprunbtn-'+toolId);
  const box = document.getElementById('preplogbox-'+toolId);
  const body = document.getElementById('preplogbody-'+toolId);
  const empty = document.getElementById('preplogempty-'+toolId);
  if(!btn || !box || !body) return;
  if(empty) empty.style.display = 'none';
  btn.disabled = true; btn.textContent = '⏳ 运行中…';
  box.style.display = 'block';
  body.innerHTML = '<span style="color:#94a3b8">正在准备输入文件…</span>';

  const prepArgs = await buildPrepToolArgs(t);
  if(prepArgs.missing && prepArgs.missing.length){
    btn.disabled = false; btn.textContent = '▶ 运行';
    body.innerHTML = '<div class="log-status err">❌ 缺少输入：' + esc(prepArgs.missing.join('、')) + '</div>';
    return;
  }
  body.innerHTML = '<span style="color:#94a3b8">正在运行 ' + esc(t.name) + ' …</span>';
  let res;
  try{ res = await pywebview.api.run_tool(t.name, prepArgs.args); }
  catch(e){ res = {ok:false, log:'调用失败：'+e}; }
  btn.disabled = false; btn.textContent = '▶ 运行';
  body.innerHTML = renderRunResult(res);
  const outResultBody = document.getElementById('prepoutresult-'+toolId);
  if(outResultBody) outResultBody.innerHTML = renderPrepOutputs((res && res.outputs) || [], toolId);
  if(res && Array.isArray(res.outputs)){
    if(!t.output) t.output = {};
    t.output.results = res.outputs.map(o=>({name:o.name, rel:o.rel}));
    await saveData();
    if(res.outputs.length){
      const o = res.outputs.find(x=>/\.(xlsx|xlsm)$/i.test(x.name||x.rel||''))
             || res.outputs.find(x=>/\.(csv|txt|log|md|json)$/i.test(x.name||x.rel||''))
             || res.outputs.find(x=>/\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(x.name||x.rel||''))
             || res.outputs[0];
      if(o && (o.rel || o.name)) await previewFile(o.rel || o.name, toolId);
    }
  }
}

/* ===== 进度状态 ===== */
function currentStepId(f){
  const done = workDoneSet || new Set((f.progress && f.progress.done) || []);
  const s = f.steps.find(x => !done.has(x.id));
  return s ? s.id : null;
}
function stepStatus(f, s){
  const done = workDoneSet || new Set((f.progress && f.progress.done) || []);
  if(done.has(s.id)) return 'done';
  return s.id === currentStepId(f) ? 'active' : 'todo';
}

function renderFlowBar(f){
  let html = '<div class="flowbar-wrap"><div class="flowbar">';
  f.steps.forEach((s, i)=>{
    // 操作手册：选中高亮、未选中置灰；作业视图：按进度 done/active/todo
    const cls = (flowTab === 'manual') ? (s.id === selectedStepId ? 'selected' : 'todo') : stepStatus(f, s);
    const icons = [];
    if(s.tool) icons.push('🔧');
    if(s.files && s.files.length) icons.push('📁');
    html += `<div class="fnode ${cls}" onclick="selectStep('${s.id}')">
      <div class="fdot">${s.seq}</div>
      <div class="fnode-name">${esc(s.name)}</div>
      <div class="fnode-icons">${icons.join('')}</div>
      <div class="fnode-arrow">▼</div>
    </div>`;
    if(i < f.steps.length-1){
      html += `<div class="fconn ${cls==='done'?'done':''}"></div>`;
    }
  });
  html += '</div></div>';
  return html;
}

function saveChecklistItem(){
  const name = document.getElementById('cl_name').value.trim();
  if(!name){ toast('请填资料名称'); return; }
  const desc = document.getElementById('cl_desc').value.trim();
  const mode = (document.getElementById('cl_mode')||{}).value || 'file';
  let file = checklistEditorFile;
  let download = null;
  if(mode === 'url'){
    const url = document.getElementById('cl_dl_url').value.trim();
    if(!url){ toast('请填下载接口 URL'); return; }
    download = {
      type: 'url',
      url: url,
      method: document.getElementById('cl_dl_method').value,
      platformId: document.getElementById('cl_dl_platform').value || null,
      saveName: document.getElementById('cl_dl_save').value.trim() || (name + '.xlsx'),
    };
    file = null;
  } else if(mode === 'tool'){
    const tool = document.getElementById('cl_tool_tool').value;
    if(!tool){ toast('请选择工具'); return; }
    download = {
      type: 'tool',
      tool: tool,
      url: document.getElementById('cl_tool_url').value.trim() || null,
      platformId: document.getElementById('cl_tool_platform').value || null,

}
async function updateChecklistFile(flowId, itemId){
  const f = DATA.flows.find(x=>x.id===flowId);
  if(!f) return;
  const item = (f.checklist||[]).find(c=>c.id===itemId);
  if(!item || !item.download) return;
  const dl = item.download;
  let r;
  if(dl.type === 'tool'){
    toast('🔄 正在运行工具获取…');
    try{
      r = await pywebview.api.run_checklist_tool(flowId, itemId, dl.tool, dl.platformId, dl.saveName, dl.url);
    }catch(e){ r = {ok:false, error:String(e)}; }
  } else {
    toast('🔄 正在从接口下载…');
    try{
      r = await pywebview.api.download_checklist_file(flowId, itemId, dl.url, dl.method, dl.platformId, dl.saveName);
    }catch(e){ r = {ok:false, error:String(e)}; }
  }
  if(!r || !r.ok){ toast('❌ 更新失败：' + (r && r.error)); return; }
  item.file = {name:r.name, path:r.path};
  item.updatedAt = Date.now();
  await saveData();
  render();
  toast('✅ 已更新 ' + r.name);
}

async function updateAllChecklistFiles(flowId){
  const f = DATA.flows.find(x=>x.id===flowId);
  if(!f) return;
  const items = (f.checklist||[]).filter(c=>c.download);
  if(!items.length){ toast('没有可自动更新的资料（需配置接口下载或工具获取）'); return; }
  toast('🔄 正在一键更新清单…');
  let okCount = 0, failCount = 0;
  for(const item of items){
    const r = await updateChecklistFileSilent(flowId, item.id);
    if(r) okCount++; else failCount++;
  }
  await saveData();
  render();
  toast(`✅ 清单更新完成：成功 ${okCount} 项${failCount?'，失败 '+failCount+' 项':''}`);
}

async function updateChecklistFileSilent(flowId, itemId){
  const f = DATA.flows.find(x=>x.id===flowId);
  if(!f) return false;
  const item = (f.checklist||[]).find(c=>c.id===itemId);
  if(!item || !item.download) return false;
  const dl = item.download;
  let r;
  try{
    if(dl.type === 'tool'){
      r = await pywebview.api.run_checklist_tool(flowId, itemId, dl.tool, dl.platformId, dl.saveName, dl.url);
    } else {
      r = await pywebview.api.download_checklist_file(flowId, itemId, dl.url, dl.method, dl.platformId, dl.saveName);
    }
  }catch(e){ return false; }
  if(!r || !r.ok) return false;
  item.file = {name:r.name, path:r.path};
  item.updatedAt = Date.now();
  return true;
}
// 清理流程内所有失效引用（指向已删除清单项/节点的输入引用、工具槽位），返回清理数量
function cleanupOrphanRefs(f){
  if(!f) return 0;
  const validCl = new Set((f.checklist||[]).map(c=>c.id));
  const validNode = new Set((f.steps||[]).map(s=>s.id));
  let cleaned = 0;
  for(const s of (f.steps||[])){
    if(s.input && s.input.items && s.input.items.length){
      const before = s.input.items.length;
      s.input.items = s.input.items.filter(it=>{
        if(it.kind==='checklist') return it.refId && validCl.has(it.refId);
        if(it.kind==='node') return it.refId && validNode.has(it.refId);
        return true; // file 项保留
      });
      cleaned += before - s.input.items.length;
    }
    if(s.tool && s.tool.config){
      const itemIds = new Set(((s.input && s.input.items) || []).map(it=>it.id));
      const outIds = new Set(((s.output && s.output.files) || []).map(f=>f.id));
      s.tool.config.forEach(c=>{
        if(!c.itemId) return;
        const id = String(c.itemId);
        // 特殊槽位豁免：DUID 清单动态、平台凭证（pf_）永远有效，不参与失效清理
        if(id === '__duid_list__' || id.startsWith('pf_')) return;
        if(id.startsWith('out_')){
          if(!outIds.has(id)){ c.itemId = null; cleaned++; }
        } else if(!itemIds.has(id)){
          c.itemId = null; cleaned++;
        }
      });
    }
  }
  return cleaned;
}

// 清理孤儿 workItems：batchId/sourceBatchId 都指向已不存在的批次（历史删除不彻底遗留），避免导入 DUID 时误判重复
function cleanupOrphanWorkItems(f){
  if(!f) return 0;
  const bidSet = new Set((f.batches||[]).map(b=>b.id));
  const before = (f.workItems||[]).length;
  f.workItems = (f.workItems||[]).filter(w=>{
    if(w.batchId) return bidSet.has(w.batchId);
    if(w.sourceBatchId) return bidSet.has(w.sourceBatchId);
    return false; // 既无 batchId 也无 sourceBatchId 的孤儿
  });
  return before - (f.workItems||[]).length;
}

// 刷新节点：按最新配置清理失效引用并重渲染
async function refreshNode(stepId){
  const f = flowOfStep(stepId);
  if(!f) return;
  const n = cleanupOrphanRefs(f);
  await saveData();
  render();
  toast(n>0 ? `🔄 已清理 ${n} 处失效引用，按最新配置显示` : '🔄 已刷新，配置已是最新');
}

function deleteChecklistItem(flowId, itemId){
  const f = DATA.flows.find(x=>x.id===flowId);
  const item = (f.checklist||[]).find(c=>c.id===itemId);
  showConfirm(`删除资料「${item?item.name:''}」？引用它的节点输入会一并解除关联。`, async function(){
    f.checklist = (f.checklist||[]).filter(c=>c.id!==itemId);
    cleanupOrphanRefs(f);
    await saveData(); render(); toast('已删除');
  });
}

function renderProgressRow(f){
  // 操作手册是节点配置/作业标准设定，无进度概念，不显示进度条和「完成本步/重置」按钮
  if(flowTab === 'manual') return '';
  const doneSet = workDoneSet || new Set((f.progress && f.progress.done) || []);
  const done = doneSet.size;
  const total = f.steps.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const curId = currentStepId(f);
  const isBatch = (flowTab === 'work' && workView === 'flow' && currentBatchId);
  const rerunBtn = isBatch ? `<button class="btn btn-ghost" onclick="openRerunNodes()">↺ 重跑节点</button>` : '';
  if(!curId){
    return `<div class="progress-row">
      <div class="flow-done-tip">🎉 流程已完成，共 ${total} 步</div>
      <div class="progress-acts">${isBatch ? rerunBtn : `<button class="btn btn-ghost" onclick="resetProgress('${f.id}')">↺ 重新开始</button>`}</div>
    </div>`;
  }
  const doneBtn = isBatch
    ? `<button class="btn btn-primary" onclick="completeBatchStep('${currentBatchId}')">✅ 完成本步，下一步</button>`
    : `<button class="btn btn-primary" onclick="nextStep('${f.id}')">✅ 完成本步，下一步</button>`;
  const resetBtn = isBatch ? '' : `<button class="btn btn-ghost" onclick="resetProgress('${f.id}')">↺ 重置</button>`;
  return `<div class="progress-row">
    <div class="progress-left">
      <span class="p-label">进度</span>
      <div class="p-track"><div class="p-fill" style="width:${pct}%"></div></div>
      <span class="p-num">${done} / ${total}</span>
    </div>
    <div class="progress-acts">${doneBtn}${resetBtn}${rerunBtn}</div>
  </div>`;
}

function renderGuide(s){
  const steps = (s && s.steps) || [];
  let items;
  if(steps.length){
    items = steps.map((st,i)=>renderGuideStep(i+1, st.text, st.shot));
  } else {
    const lines = ((s && s.desc)||'').split('\n').map(x=>x.trim()).filter(Boolean);
    if(!lines.length) return '<div class="guide-body empty">（暂无操作指导）</div>';
    items = lines.map((l,i)=>renderGuideStep(i+1, l, null));
  }
  return `<div class="guide-body">${items.join('')}</div>`;
}
function renderGuideStep(num, text, shot){
  const shotHtml = shot ? `<img class="gs-shot file-img" data-src="${esc(shot)}" onclick="viewShot(this)" alt="点击放大" title="点击放大">` : '';
  return `<div class="guide-step"><span class="gs-num">${num}</span><div class="gs-main"><span class="gs-text">${esc(text||'')}</span>${shotHtml}</div></div>`;
}

// 工具输入关联状态（绿=已关联文件 / 灰=未关联）；别名=关联的输入项名/节点名
function renderToolInputStatus(f, s){
  const cfg = (s.tool && s.tool.config) || [];
  if(!cfg.length) return '';
  const chips = cfg.map((c,i)=>{
    const ref = resolveToolInputRef(f, s, c);
    const linked = !!(ref && ref.path);
    const cls = linked ? 'linked' : 'missing';
    const alias = toolRefLabel(s, c) || c.id || ('输入'+(i+1));
    const tip = linked ? ('已关联：'+(ref.name||ref.path)) : '未关联文件';
    return `<span class="tool-in-chip ${cls}" title="${esc(tip)}">${linked?'●':'○'} ${esc(alias)}</span>`;
  }).join('');
  return `<div class="tool-in-status"><span class="tool-in-status-label">工具输入：</span>${chips}</div>`;
}

function renderMsgBox(s){
  if(flowTab !== 'work' || (workView !== 'flow' && workView !== 'item')) return '';
  if(!s.tool) return '';
  const hasTpl = !!(s.msgTemplate && s.msgTemplate.trim());
  const cached = hasTpl ? (msgCache[s.id] || '') : '';
  const tplHtml = hasTpl ? highlightMsgTpl(s.msgTemplate) : '<span class="sub">（该节点未配置消息模板，可在「操作手册」里编辑节点补充）</span>';
  const outHtml = cached
    ? `<div class="msg-text">${esc(cached).replace(/\n/g,'<br>')}</div>`
    : '<span class="sub">运行工具后，这里显示生成的可粘贴消息</span>';
  return `<div class="pane msg-pane" id="msgpane-${s.id}">
    <div class="pane-title">📤 返回消息数据 <span class="sub">按模板从结果里筛值生成</span></div>
    <div class="msg-template-line">${tplHtml}</div>
    <div class="msg-out" id="msgout-${s.id}">${outHtml}</div>
    <div class="tool-row">
      <button class="btn btn-ghost btn-sm" onclick="copyMsg('${s.id}')">📋 复制</button>
    </div>
  </div>`;
}
async function copyMsg(stepId){
  const text = msgCache[stepId] || '';
  if(!text){ toast('还没有生成的消息，先运行工具'); return; }
  try{
    await navigator.clipboard.writeText(text);
    toast('✅ 已复制到剪贴板');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('✅ 已复制到剪贴板');
    }catch(e2){ toast('❌ 复制失败，请手动选中复制'); }
  }
}

// 节点操作台折叠区块：点击标题展开/收起（默认收起区块由 inline style="display:none" 控制）
function toggleConsoleSection(headEl){
  const body = headEl.nextElementSibling;
  if(!body || !body.classList.contains('sec-body')) return;
  const collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  const chev = headEl.querySelector('.chev');
  if(chev) chev.textContent = collapsed ? '▾ 收起' : '▸ 展开';
}

function renderConsole(f, s){
  if(!s) return '<div class="empty"><div class="big">📭</div>还没有节点</div>';
  const st = stepStatus(f, s);
  const stLabel = st==='done' ? '已完成' : (st==='active' ? '进行中' : '未开始');
  const tags = [];
  if(s.tool) tags.push('<span class="tag tool">🔧 工具</span>');
  if(s.files && s.files.length) tags.push('<span class="tag file">📁 文件</span>');

  const brief = s.brief ? `<div class="brief-body">${esc(s.brief)}</div>` : '<div class="brief-body empty">（暂无简介）</div>';

  const items = (s.input && s.input.items) || [];

  // 输入条目（统一：名称 + 来源标签 + 附件），紧凑展示；拖入型缺文件的项提供拖入框
  const entries = [];
  const bctx = batchContext(f);
  const inWorkView = (workView === 'flow' || workView === 'item');
  for(const it of items){
    if(it.kind === 'file'){
      if(inWorkView){
        // 作业视图：显示临时拖入的文件（或拖入框）
        const tmp = getTempFile(f, s.id, it.id);
        entries.push({ name: it.name || '上传文件', src: null, desc: null, file: tmp || null,
                       del: tmp ? `removeTempFileItem('${esc(s.id)}', '${esc(it.id)}')` : null,
                       req: !!it.required, drop: tmp ? null : ('item:'+it.id) });
      } else {
        // 操作手册：临时拖入槽位，不承载具体文件
        entries.push({ name: it.name || '临时拖入', src: {label:'临时拖入', title:'作业时在此拖入文件，仅在该批次/该 DUID 作业下保留，不影响框架'},
                       desc: null, file: null, del: null, req: !!it.required });
      }
    } else if(it.kind === 'checklist'){
      const c = findChecklistItem(f, it.refId);
      entries.push(c
        ? { name: it.name || c.name, src: {label:'初始清单', title:'来源：初始清单「'+c.name+'」'}, desc: c.desc || null,
            file: c.file || null, del: null, req: !!it.required }
        : { name: it.name || '引用的初始清单项已删除', warn: true, req: !!it.required });
    } else if(it.kind === 'node'){
      const target = findStep(it.refId);
      const refFile = target ? resolveNodeOutputFile(it.refId, it.refFile) : null;
      entries.push(target
        ? { name: it.name || target.name, src: {label:'节点输出', title:'来源：节点「'+target.name+'」的输出'},
            desc: (target.output && target.output.text) || null,
            file: refFile, del: null, req: !!it.required }
        : { name: it.name || '引用的节点已删除', warn: true, req: !!it.required });
    } else if(it.kind === 'desc'){
      entries.push({ name: it.name || '描述', src: {label:'仅描述', title:'仅文字描述，无需文件'}, desc: null, file: null, del: null, req: !!it.required });
    } else if(it.kind === 'duidlist'){
      if(bctx && bctx.duids.length){
        duidLists[s.id] = bctx.duids.slice();
        entries.push({ name:'DUID 清单（'+bctx.duids.length+' 个）', src:{label:'批次动态', title:'当前批次剩余 DUID：'+bctx.duids.length+' 个'}, duids:bctx.duids.slice(), stepId:s.id, req:false, anchor:true });
      } else if(workView === 'item' && currentWorkItemId){
        const w = (f.workItems||[]).find(x=>x.id===currentWorkItemId);
        const curDuid = w ? w.duid : '';
        duidLists[s.id] = [curDuid];
        entries.push({ name:'DUID 清单（1 个）', src:{label:'当前 DUID', title:'当前 DUID：'+curDuid}, duids:[curDuid], stepId:s.id, req:false, anchor:true });
      } else {
        entries.push({ name: it.name || 'DUID 清单（批次动态）', src:{label:'批次动态', title:'批次作业时自动 = 当前批次剩余 DUID'}, desc:null, file:null, del:null, req:false });
      }
    }
  }

  const inText = (s.input && s.input.text) ? s.input.text : '';
  let inBody = inText ? `<div class="io-body">${esc(inText)}</div>` : '';
  if(!entries.length){
    if(!inBody) inBody = '<div class="io-entry-empty">（暂无输入）</div>';
  } else {
    inBody += entries.map(e=>{
      const reqMark = e.req ? ' <span class="dz-required">必选</span>' : '';
      const nameHtml = `<span class="io-entry-name">${esc(e.name)}${reqMark}</span>`;
      if(e.warn) return `<div class="io-entry warn">${nameHtml}</div>`;
      if(e.duids) return renderDuidListEntry(e);
      const srcTag = e.src ? `<span class="io-entry-src" title="${esc(e.src.title)}">${esc(e.src.label)}</span>` : '';
      const descHtml = e.desc ? `<div class="io-entry-desc">${esc(e.desc)}</div>` : '';
      const fileHtml = e.file ? `<div class="io-entry-file">${filePill(e.file, e.del)}</div>` : '';
      const dropHtml = (!e.file && e.drop) ? `<div class="io-entry-file"><div class="drop-zone drop-inline" data-drop="${esc(e.drop)}"><span class="dz-icon">📥</span><span>拖入文件</span></div></div>` : '';
      return `<div class="io-entry"><div class="io-entry-head">${nameHtml}${srcTag}</div>${descHtml}${fileHtml}${dropHtml}</div>`;
    }).join('');
  }

  // 网页链接：任何标签的节点，遍历所有已配置网址，名称在前、网址在后
  let inExtra = '';
  const urls = (s.urls && s.urls.length) ? s.urls : (s.url ? [{name:s.siteNote||'', url:s.url}] : []);
  const validUrls = urls.filter(u => (u.url||'').trim());
  if(validUrls.length){
    inExtra = validUrls.map(u => `<div class="url-link" onclick="openUrl('${esc(u.url)}')" title="${esc(u.url)}">🌐 <span class="url-name-label">${esc(u.name||'')}</span><span class="url-addr">${esc(u.url)}</span></div>`).join('');
  }
  const inputBlock = `
      <div class="io-block in">
        <div class="io-block-title">🟢 输入</div>
        ${inBody}
        ${inExtra}
      </div>`;

  const outText = (s.output && s.output.text) ? s.output.text : '';
  const outRealFiles = (s.output && s.output.files) || [];
  // 输出模板文件：与「🔵 输出」标题同行
  const outTplHtml = outRealFiles.map(f=>`<span class="io-file io-file-inline" onclick="previewFile('${esc(f.path||f.name)}')" title="点击预览">📄 ${esc(f.name)}</span>`).join('');
  // 旧文字文件名（节点输出引用用）
  const outNamesHtml = (s.files && s.files.length)
    ? `<div class="io-files">${s.files.map(f=>`<div class="io-file" onclick="previewFile('${esc(f.name)}')" title="点击预览">📄 ${esc(f.name)}</div>`).join('')}</div>`
    : '';
  // 输出结果小模块（工具运行后结果文件放这里；已完成节点刷新后仍保留）
  const savedResults = (s.output && s.output.results) || [];
  const outResultInit = savedResults.length
    ? savedResults.map(o=>{
        return `<div class="io-file-wrap">
          <div class="io-file" onclick="previewFile('${esc(o.rel)}')" title="点击预览">📄 ${esc(o.name)}</div>
        </div>`;
      }).join('')
    : `<div class="sub">运行「${esc(s.tool && s.tool.name)}」后，结果文件显示在这里</div>`;
  const outResultHtml = s.tool ? `
        <div class="out-result">
          <div class="out-result-title">📁 输出结果</div>
          <div class="out-result-body" id="outresultbody-${s.id}">${outResultInit}</div>
        </div>` : '';
  // 操作举证截图粘贴区：仅在作业视图（批次 / 单 DUID）出现，供「完成本步」时归档保存
  const evidenceHtml = (flowTab === 'work' && (workView === 'flow' || workView === 'item')) ? renderEvidenceZone(s) : '';
  const outputBlock = `
      <div class="io-block out">
        <div class="io-block-title">🔵 输出 ${outTplHtml}</div>
        <div class="io-body">${esc(outText)}</div>
        ${outNamesHtml}
        ${outResultHtml}
        ${evidenceHtml}
      </div>`;

  // 运行按钮禁用判定：无工具 / 必选文件未上传
  let runDisabled = false, runTip = '';
  if(!s.tool){
    runDisabled = true; runTip = '本节点未挂载工具';
  } else if(items.some(it => it.required && !resolveInputItemFile(f, s, it))){
    runDisabled = true; runTip = '请先补齐「必选」输入项的文件';
  } else if(s.tool.config && s.tool.config.some(c=>!resolveToolInputRef(f, s, c))){
    runDisabled = true; runTip = '工具的输入尚未全部关联到有效文件';
  }
  const runAttr = runDisabled ? ' disabled' : '';
  const runBtn = `<button class="btn btn-primary btn-sm" id="runbtn-${s.id}"${runAttr} onclick="runTool('${s.id}')" title="${esc(runTip)}">▶ 运行</button>`;

  let logPane = '';
  if(s.tool){
    const toolInStatus = renderToolInputStatus(f, s);
    logPane = `
        <div class="pane log-pane">
          <div class="pane-title">操作日志 <span class="sub">运行 ${esc(s.tool.name)}</span></div>
          ${toolInStatus}
          <div class="log-empty" id="logempty-${s.id}">点「▶ 运行」后，这里显示工具返回结果（仅本次显示、不保存）</div>
          <div class="log-box" id="logbox-${s.id}" style="display:none">
            <div class="log-body" id="logbody-${s.id}"></div>
          </div>
          <div class="tool-row">
            ${runBtn}
          </div>
        </div>`;
  } else {
    logPane = `
        <div class="pane log-pane">
          <div class="pane-title">操作日志</div>
          <div class="log-empty">本节点未挂载工具，暂无运行日志</div>
          <div class="tool-row">
            ${runBtn}
          </div>
        </div>`;
  }

  const note = s.note ? `<div class="note"><b>⚠️</b><span>${esc(s.note)}</span></div>` : '';

  const urlNames = ((s.urls && s.urls.length) ? s.urls : (s.url ? [{name:s.siteNote||'', url:s.url}] : []))
    .filter(u => (u.url||'').trim())
    .map(u => (u.name||'').trim()).filter(Boolean);
  const siteNote = urlNames.length ? `<span class="site-note">${esc(urlNames.join('、'))}</span>` : '';

  // 作业清单的作业视图（批次作业/单 DUID 作业）隐藏「编辑/刷新/删除」节点按钮，
  // 这些编辑能力只保留在「操作手册」（flowTab==='manual'）里。
  const isWorkConsole = (flowTab === 'work' && (workView === 'flow' || workView === 'item'));
  const workFoot = isWorkConsole ? '' : `<div class="console-foot">
      <button class="btn btn-ghost" onclick="editNode('${s.id}')">✏️ 编辑</button>
      <button class="btn btn-ghost" onclick="refreshNode('${s.id}')" title="按最新配置清理失效引用">🔄 刷新</button>
      <button class="btn btn-ghost" onclick="deleteNode('${s.id}')">🗑 删除</button>
    </div>`;

  return `<div class="console">
    <div class="console-head">
      <div class="console-seq" style="background:${f.color};">${s.seq}</div>
      <div class="console-title">
        <h3>${esc(s.name)}${siteNote}</h3>
        <div class="c-state"><span class="status-badge ${st}">${stLabel}</span></div>
      </div>
      <div class="tags">${tags.join('')}</div>
    </div>

    <div class="console-section">
      <div class="sec-label sec-toggle" onclick="toggleConsoleSection(this)"><span>📝 节点简介</span><span class="chev">▸ 展开</span></div>
      <div class="sec-body" style="display:none">${brief}</div>
    </div>

    <div class="console-section">
      <div class="sec-label sec-toggle" onclick="toggleConsoleSection(this)"><span>🔁 输入 / 🖥 操作台（操作指导）</span><span class="chev">▸ 展开</span></div>
      <div class="sec-body console-ios" style="display:none">
        ${inputBlock}
        <div class="io-block guide-block">
          <div class="io-block-title">🖥 操作台（操作指导）</div>
          ${renderGuide(s)}
        </div>
      </div>
    </div>

    <div class="console-section">
      <div class="sec-label"><span>📤 输出 / 📋 工具操作日志</span></div>
      <div class="console-ios">
        ${outputBlock}
        ${logPane}
      </div>
    </div>

    ${note}

    ${renderMsgBox(s)}

    <div class="pane preview-pane" id="previewpane-${s.id}" style="display:none" data-file="">
      <div class="pane-title">🔍 数据预览 <span class="sub" id="previewname-${s.id}"></span></div>
      <div class="preview-toolbar">
        <button class="btn btn-ghost btn-sm" onclick="openPreviewFile('${s.id}')">📂 打开所在文件夹</button>
        <button class="btn btn-ghost btn-sm" onclick="closePreview('${s.id}')">✕ 关闭</button>
      </div>
      <div class="preview-body" id="previewbody-${s.id}"></div>
    </div>

    ${workFoot}
  </div>`;
}

/* ===== DUID 清单（批次动态）列表展示 + 复制 + 展开 ===== */
function renderDuidListEntry(e){
  const duids = e.duids || [];
  const total = duids.length;
  return `<div class="io-entry duid-entry">
    <div class="io-entry-head">
      <span class="io-entry-name">${esc(e.name)}</span>

function renderDuidListInner(stepId, expanded){
  const duids = duidLists[stepId] || [];
  const total = duids.length;

  const lines = (expanded ? duids : duids.slice(0, COLLAPSE))
    .map(d=>`<div class="duid-line">${esc(d)}</div>`).join('');
  let toggle = '';
  if(total > COLLAPSE){
    toggle = expanded
      ? `<div class="duid-more" onclick="toggleDuidList('${esc(stepId)}')">▴ 收起</div>`
      : `<div class="duid-more" onclick="toggleDuidList('${esc(stepId)}')">▾ 展开全部 ${total} 个</div>`;
  }
  return lines + toggle;
}
function toggleDuidList(stepId){

async function copyDuidList(stepId){
  const duids = duidLists[stepId] || [];
  if(!duids.length){ toast('暂无可复制的 DUID'); return; }
  const text = duids.join('\n');
  try{
    await navigator.clipboard.writeText(text);

  }catch(e){

      ta.value = text; document.body.appendChild(ta); ta.select();

function pickEvidenceFile(stepId){

  input.type = 'file';
  input.accept = 'image/*,.xlsx,.xls,.xlsm,.docx,.doc,.pdf,.csv,.txt,.zip,.rar,.7z';

  };

function setupEvidenceDropZones(){
  const zones = document.querySelectorAll('[data-evidence-drop]');
  zones.forEach(zone=>{
    if(zone.dataset.bound) return;
    zone.dataset.bound = '1';
    const stepId = zone.dataset.evidenceDrop;
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=>{ zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(!file) return;
      processEvidence(file, stepId);
    });

function processEvidence(file, stepId){
  if(!file) return;
  const isImage = !!(file.type && file.type.indexOf('image') === 0);
  if(isImage){
    // 图片：压缩后存 dataURL
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const maxW = 1920;
        const scale = Math.min(1, maxW/img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        pendingEvidence[stepId] = { kind:'image', name:'图片举证.jpg', dataUrl: c.toDataURL('image/jpeg', 0.92) };
        renderEvidenceBody(stepId);
        toast('✅ 举证图片已添加（完成本步后保存）');
      };
      img.onerror = function(){ toast('❌ 图片读取失败'); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  } else {
    // 文件：整体读成 dataURL 暂存
    const reader = new FileReader();
    reader.onload = function(ev){
      pendingEvidence[stepId] = { kind:'file', name: file.name, dataUrl: ev.target.result };
      renderEvidenceBody(stepId);
      toast('✅ 举证文件已添加（完成本步后保存）');
    };
    reader.onerror = function(){ toast('❌ 文件读取失败'); };
    reader.readAsDataURL(file);
  }
}

/* ===== 数据预览：Excel 式拖拽选区 + Ctrl+C 复制 ===== */
let rangeSel = { table:null, anchor:null, focus:null, active:false, moved:false, sx:0, sy:0 };
function cellRC(table, cell){
  const tr = cell.parentElement;
  return { r: Array.from(table.rows).indexOf(tr), c: Array.from(tr.cells).indexOf(cell) };
}
function clearRange(table){
  if(!table) return;
  table.querySelectorAll('td.sel,th.sel').forEach(x=>x.classList.remove('sel'));
}
function paintRange(){
  const t = rangeSel.table;
  if(!t) return;
  clearRange(t);
  if(!rangeSel.anchor || !rangeSel.focus) return;
  const a = cellRC(t, rangeSel.anchor), b = cellRC(t, rangeSel.focus);
  const r1=Math.min(a.r,b.r), r2=Math.max(a.r,b.r);
  const c1=Math.min(a.c,b.c), c2=Math.max(a.c,b.c);
  for(let r=r1;r<=r2;r++){
    const tr = t.rows[r];
    if(!tr) continue;
    for(let c=c1;c<=c2;c++){
      const td = tr.cells[c];
      if(td) td.classList.add('sel');
    }
  }
}
function copyRangeAsTsv(){
  const t = rangeSel.table;
  if(!t || !rangeSel.anchor || !rangeSel.focus) return;
  const a = cellRC(t, rangeSel.anchor), b = cellRC(t, rangeSel.focus);
  const r1=Math.min(a.r,b.r), r2=Math.max(a.r,b.r);
  const c1=Math.min(a.c,b.c), c2=Math.max(a.c,b.c);
  const lines = [];
  for(let r=r1;r<=r2;r++){
    const tr = t.rows[r];
    const vals = [];
    for(let c=c1;c<=c2;c++){
      vals.push((tr && tr.cells[c]) ? (tr.cells[c].textContent||'').trim() : '');
    }
    lines.push(vals.join('\t'));
  }
  copyText(lines.join('\n'));
  toast('已复制 ' + (r2-r1+1) + ' 行 × ' + (c2-c1+1) + ' 列');
}
function enableRangeSelect(table){
  if(table.dataset.rangeBound) return;
  table.dataset.rangeBound = '1';
  table.addEventListener('mousedown', function(e){
    if(e.button !== 0) return;
    const cell = e.target.closest('td,th');
    if(!cell) return;
    if(cell.classList.contains('no-sel')) return;
    e.preventDefault();
    rangeSel.table = table;
    rangeSel.anchor = cell;
    rangeSel.focus = cell;
    rangeSel.active = true;
    rangeSel.moved = false;
    rangeSel.sx = e.clientX;
    rangeSel.sy = e.clientY;
    paintRange();
  });
}
document.addEventListener('mousemove', function(e){
  if(!rangeSel.active) return;
  if(!rangeSel.moved){
    if(Math.abs(e.clientX-rangeSel.sx) + Math.abs(e.clientY-rangeSel.sy) < 5) return;
    rangeSel.moved = true;
  }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if(!el) return;
  const cell = el.closest('td,th');
  if(cell && cell.closest('table') === rangeSel.table && cell !== rangeSel.focus && !cell.classList.contains('no-sel')){
    rangeSel.focus = cell;
    paintRange();
  }
});
document.addEventListener('mouseup', function(){
  if(!rangeSel.active) return;
  const table = rangeSel.table, anchor = rangeSel.anchor, moved = rangeSel.moved;
  rangeSel.active = false;
  if(!moved && anchor){
    copyCell(anchor);           // 单击：直接复制该格
    clearRange(table);
    rangeSel.anchor = rangeSel.focus = null;
  } else if(moved){
    toast('已选区域，按 Ctrl+C 复制');
  }
});
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')){
    if(rangeSel.table && rangeSel.anchor && rangeSel.focus && rangeSel.moved){
      copyRangeAsTsv();
      e.preventDefault();
    }
  }
});

/* ===== 截图放大 ===== */
function viewShot(el){
  const src = (el && el.src) || '';
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<span class="lb-close" onclick="this.parentNode.remove()">×</span><img src="${src}">`;
  const im = lb.querySelector('img');
  // 放大/平移状态
  let scale = 1, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;
  const apply = function(){ im.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  im.style.cursor = 'grab';
  // 滚轮缩放（以图片中心为基准）
  lb.addEventListener('wheel', function(e){
    e.preventDefault();
    const k = e.deltaY < 0 ? 1.18 : 0.85;
    scale = Math.max(0.25, Math.min(10, scale * k));
    apply();
  }, {passive:false});
  // 拖拽平移
  im.addEventListener('mousedown', function(e){
    e.preventDefault(); e.stopPropagation();
    dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
    im.style.cursor = 'grabbing';
  });
  document.addEventListener('mousemove', function(e){
    if(!dragging) return;
    tx = e.clientX - sx; ty = e.clientY - sy; apply();
  });
  document.addEventListener('mouseup', function(){ dragging = false; im.style.cursor = 'grab'; });
  // 双击重置
  im.addEventListener('dblclick', function(){ scale = 1; tx = 0; ty = 0; apply(); });
  // 点背景或右上角 × 关闭
  lb.onclick = function(e){ if(e.target===lb) lb.remove(); };
  document.body.appendChild(lb);
  // 若缩略图还没 hydrate（src 为空），异步补齐大图
  if(!src && el){
    const rel = el.getAttribute('data-src');
    if(rel){
      pywebview.api.get_shot(rel).then(function(r){ if(r && r.ok && r.data && im) im.src = r.data; }).catch(function(){});
    }
  }
}

/* ===== 进度交互 ===== */
function selectStep(id){
  selectedStepId = id;

async function nextStep(flowId){
  const f = DATA.flows.find(x=>x.id===flowId);
  if(!f) return;
  const curId = currentStepId(f);
  if(!curId){ toast('🎉 流程已全部完成'); return; }
  if(!f.progress) f.progress = {done:[]};
  if(!f.progress.done) f.progress.done = [];
  f.progress.done.push(curId);
  const nextId = currentStepId(f);
  selectedStepId = nextId || curId;
  await saveData();
  render();
  toast(nextId ? '✅ 完成一步，进入下一步' : '🎉 全部节点已完成！');
}
async function resetProgress(flowId){
  const f = DATA.flows.find(x=>x.id===flowId);
  if(!f) return;
  showConfirm('重置进度？已完成的节点会全部变回「未开始」，已运行的输出结果也会清空。', async function(){
    f.progress = {done:[]};
    // 清除所有节点已运行的输出结果
    (f.steps||[]).forEach(s=>{ if(s.output) s.output.results = []; });
    selectedStepId = f.steps.length ? f.steps[0].id : null;
    await saveData();
    render();
    toast('已重置进度');
  });
}

function connector(cur, next){
  let tag='';
  const nItems = (next && next.input && next.input.items) || [];
  if(nItems.some(it=>it.kind==='node' && it.refId===cur.id)){
    tag = `<div class="ref-tag">↩ ${cur.id} 的输出 → ${next.id} 的输入</div>`;
  }
  return `<div class="connector">${tag}<div class="line"></div><div class="arrow">▼</div></div>`;
}

function stepCard(s, color){
  const tags=[];

  if(s.files&&s.files.length) tags.push('<span class="tag file">📁 文件</span>');

    extra+=`<details><summary>🔧 工具：${esc(s.tool.name)}</summary><div class="details-body">
      <div class="tool-row">
        <button class="btn btn-ghost" id="runbtn-${s.id}" onclick="runTool('${s.id}')">▶ 运行工具</button>
        <span class="sub">运行 ${esc(s.tool.name)}，日志仅本次显示、不保存</span>
      </div>

        <div class="log-head">▶ 运行日志（临时）</div>
        <div class="log-body" id="logbody-${s.id}"></div>
      </div>
    </div></details>`;
  }
  if(s.files&&s.files.length){
    extra+=`<details><summary>📁 输出文件（${s.files.length}）</summary><div class="details-body"><div class="files">
      ${s.files.map(f=>`<div class="file"><span>📄</span><span class="fname">${esc(f.name)}</span></div>`).join('')}
    </div></div></details>`;
  }

  const note = s.note ? `<div class="note"><b>⚠️</b><span>${esc(s.note)}</span></div>` : '';

  return `<div class="step" id="${s.id}">

    ${ioHtml(s.input,'in')}${ioHtml(s.output,'out')}

}

function ioHtml(io, type){
  let body='';
  if(io && io.text){ body += `<div class="io-body">${esc(io.text)}</div>`; }
  if(type==='out' && io && io.files && io.files.length){
    body += io.files.map(f=>`<span class="ref">📄 ${esc(f.name)}</span>`).join('');
  }
  const items = (io && io.items) || [];
  for(const it of items){
    if(it.kind === 'node'){
      body += `<span class="ref" onclick="jump('${it.refId}')">↩ ${esc(it.name||it.refLabel||it.refId)}（节点输出）</span>`;
    } else if(it.kind === 'checklist'){
      body += `<span class="ref">📋 ${esc(it.name||it.refLabel||it.refId)}（清单）</span>`;
    } else if(it.kind === 'file'){
      body += `<span class="ref">📥 ${esc(it.name||'上传文件')}${it.file?' 📄':''}</span>`;
    } else if(it.kind === 'desc'){
      body += `<span class="ref desc">📝 ${esc(it.name||'描述')}</span>`;
    }
  }
  if(!body) body = '<div class="io-body">（无）</div>';
  const t = type==='in' ? '🟢 输入' : '🔵 输出';
  return `<div class="io ${type}"><div class="io-title">${t}</div>${body}</div>`;
}

function renderLog(log){
  return log.split('\n').map(l=>{
    if(/traceback|error|exception|filenotfound|no such file|错误|失败/i.test(l)) return `<span class="err">${esc(l)}</span>`;
    if(/完成|成功|ok|done|success/i.test(l)) return `<span class="ok-line">${esc(l)}</span>`;
    return esc(l);
  }).join('\n');
}
function renderRunResult(res){
  const ec = res && res.exit_code;
  let head = '';
  if(ec === 0){
    head = '<div class="log-status ok">✅ 运行成功</div>';
  } else if(ec !== undefined && ec !== null && ec !== ''){
    head = '<div class="log-status err">❌ 运行失败（退出码 ' + esc(ec) + '）</div>';
  } else if(!(res && res.ok)){
    head = '<div class="log-status err">❌ 运行失败</div>';
  }
  return head + renderLog((res && res.log) ? res.log : '（无输出）');
}

/* ================= 作业清单（批次 / DUID） ================= */
function nowStr(){
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function workCount(f){ return (f && f.workItems) ? f.workItems.length : 0; }
function workItemDoneCount(w){ return (w && w.doneStepIds) ? w.doneStepIds.length : 0; }
function workItemCurrentStepId(f, w){
  const done = new Set((w && w.doneStepIds) || []);
  const s = f.steps.find(x => !done.has(x.id));
  return s ? s.id : null;
}
function isDetached(w){ return !!(w && !w.batchId && w.sourceBatchId); }
function workItemStatusLabel(f, w){
  if(!w) return '';
  if(isDetached(w)) return '拆出';
  if(workItemCurrentStepId(f,w)===null) return '已完成';
  return '进行中';
}
function maxIdNum(){
  let max = 0;
  for(const f of (DATA.flows||[])){
    for(const s of (f.steps||[])){ max = Math.max(max, parseInt(String(s.id).replace(/\D/g,''))||0); }
    for(const b of (f.batches||[])){ max = Math.max(max, parseInt(String(b.id).replace(/\D/g,''))||0); }
    for(const w of (f.workItems||[])){ max = Math.max(max, parseInt(String(w.id).replace(/\D/g,''))||0); }
  }
  return max;
}

function batchContext(f){

function startBatchWork(batchId){

    if(!items.length){ toast('该批次 DU 已全部脱离，无法进入批量作业'); return; }
  }
  workView = 'flow'; currentBatchId = batchId; currentWorkItemId = null; workDoneSet = null; selectedStepId = null;
  render();

// 批次里所有 DUID 的公共已完成节点集合（所有 DUID 都完成的节点 id 交集）
function batchCommonDone(f, b){
  const items = (f.workItems||[]).filter(w=>w.batchId===b.id);
  if(!items.length) return new Set();
  let common = new Set(items[0].doneStepIds || []);
  for(let i=1;i<items.length;i++){
    const cur = new Set(items[i].doneStepIds || []);
    common = new Set([...common].filter(x=>cur.has(x)));
  }
  return common;
}

// 批次作业：完成当前节点 → 批次内所有 DUID 都标记该节点完成
async function completeBatchStep(batchId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  const b = (f.batches||[]).find(x=>x.id===batchId);
  if(!b) return;
  const items = (f.workItems||[]).filter(w=>w.batchId===b.id);
  if(!items.length){ toast('本批次没有 DUID'); return; }
  workDoneSet = batchCommonDone(f, b);
  const curId = currentStepId(f);
  if(!curId){ toast('🎉 本批次已全部完成'); return; }
  const s = f.steps.find(x=>x.id===curId);
  // 归档：批次合表结果 → 批次归档；并按 DUID 拆出各 DU 的 Excel → 各 DU 归档
  const files = collectStepFiles(f, s);
  const duids = items.map(w=>w.duid).filter(Boolean);
  if(files.length && duids.length){
    try{ await pywebview.api.archive_batch_files(b.id, s.seq, s.name, files); }catch(e){}
    try{ await pywebview.api.archive_batch_du_files(b.id, duids, s.seq, s.name, files); }catch(e){}
  }
  // 操作举证：同一张截图保存到批次内每个 DU 归档
  if(pendingEvidence[curId] && duids.length){
    try{ await pywebview.api.save_evidence(duids, s.seq, s.name, pendingEvidence[curId]); }catch(e){ toast('举证保存失败：'+e); }
    delete pendingEvidence[curId];
  }
  for(const w of items){
    w.doneStepIds = w.doneStepIds || [];
    if(!w.doneStepIds.includes(curId)) w.doneStepIds.push(curId);
    w.updatedAt = nowStr();
  }
  // 批量解除：批次完成本节点后，所有 DUID 自动脱离、转为独立处理（各自带走已积累的进度和数据）
  const willDetach = !!(s && s.batchDetach);
  if(willDetach){
    for(const w of items){
      w.sourceBatchId = w.batchId || w.sourceBatchId;
      w.batchId = null;
      w.updatedAt = nowStr();
    }
  }
  workDoneSet = batchCommonDone(f, b);
  const nextId = willDetach ? null : currentStepId(f);
  selectedStepId = nextId || curId;
  await saveData();
  if(willDetach){
    // 批量解除后退出批量作业视图，回到列表（批次 DU 已全部脱离，无法再进入）
    workView = 'list';
    currentBatchId = null;
    currentWorkItemId = null;
    selectedStepId = null;
    workDoneSet = null;
  }
  render();
  if(willDetach){
    toast('🔓 已批量解除：'+items.length+' 个 DUID 全部脱离，转为独立处理');
  } else {
    toast(nextId ? '✅ 完成「'+(s?s.name:'本步')+'」，进入下一步' : '🎉 本批次全部节点已完成！');
  }
}

function collectStepFiles(f, s){
  if(!s) return [];
  const out = [];
  for(const it of (s.input && s.input.items) || []){
    if(it.kind === 'file'){
      const tmp = getTempFile(f, s.id, it.id);
      const file = tmp || it.file;
      if(file && file.path) out.push({name: file.name || (file.path||'').split('/').pop(), rel: file.path});
    }
  }
  for(const o of (s.output && s.output.results) || []) out.push({name: o.name, rel: o.rel});
  const seen = new Set();
  return out.filter(x=>{ if(!x.rel || seen.has(x.rel)) return false; seen.add(x.rel); return true; });
}

  if(!selectedStepId || !f.steps.some(s=>s.id===selectedStepId)){

    <div class="work-item-head">
      <div class="wih-icon">📦</div>
      <div class="wih-main">

        <div class="wih-sub">${cur ? '当前：'+esc(cur.name) : '全部完成'} · ${isDetached(w)?'拆出独立':'批次作业'}${w.remark?' · 📝 '+esc(w.remark):''}</div>
      </div>
      <div class="acts"><button class="btn btn-ghost btn-sm" onclick="exportWorkRecord('${w.id}')">📥 导出记录</button><button class="btn btn-ghost btn-sm" onclick="remarkWorkItem('${w.id}')">📝 备注</button></div>
    </div>
    ${renderFlowBar(f)}

    ${renderAnchorPanel(f, w)}
    ${sel ? renderConsole(f, sel) : '<div class="empty"><div class="big">🎉</div>该 DUID 的全部节点已完成。</div>'}`;
  if(sel){ setupInputItemDropZones(sel.id); }
}

async function loadBatchAnchorData(f, b){
  const key = f.id + ':' + b.id;
  if(batchAnchorData && batchAnchorLoadedFor === key){ paintBatchAnchorPanel(); return; }
  batchAnchorData = null;
  batchAnchorLoadedFor = key;
  paintBatchAnchorPanel();
  try{
    batchAnchorData = await pywebview.api.get_anchor_data_batch(f.id, b.id);
  }catch(e){
    batchAnchorData = { ok:false, error:String(e) };
  }
  paintBatchAnchorPanel();
}

function toggleBatchAnchorFilter(){ batchAnchorFilter = batchAnchorFilter==='todo' ? 'all' : 'todo'; paintBatchAnchorPanel(); }

function sortBatchAnchor(key){
  if(batchAnchorSort.key === key){
    batchAnchorSort.dir = batchAnchorSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    batchAnchorSort.key = key;
    batchAnchorSort.dir = 'asc';
  }
  paintBatchAnchorPanel();
}

function sortBatchAnchorArrow(key){
  if(batchAnchorSort.key !== key) return '↕';
  return batchAnchorSort.dir === 'asc' ? '▲' : '▼';
}

function batchAnchorList(){
  if(!batchAnchorData || !batchAnchorData.ok) return [];
  let mats = (batchAnchorData.materials || []).slice();
  mats = batchAnchorFilter === 'todo' ? mats.filter(m=>!m.done) : mats;
  const key = batchAnchorSort.key, dir = batchAnchorSort.dir;
  if(key){
    mats.sort((a,b)=>{
      let va = anchorCellVal(a, key), vb = anchorCellVal(b, key);
      const na = parseFloat(va), nb = parseFloat(vb);
      const sa = (va === undefined || va === null) ? '' : String(va).trim();
      const sb = (vb === undefined || vb === null) ? '' : String(vb).trim();
      if(sa !== '' && sb !== '' && !isNaN(na) && !isNaN(nb)){ va = na; vb = nb; } else { va = sa; vb = sb; }
      if(va < vb) return dir === 'asc' ? -1 : 1;
      if(va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }
  return mats;
}

function batchMatKey(m){ return (m.wid || '') + '|' + (m.itemcode || ''); }

function paintBatchAnchorPanel(){
  const toolbar = document.getElementById('batch-anchor-toolbar');

  `;
  const cols = anchorCols();
  let headCells = `<th class="sortable" onclick="sortBatchAnchor('duid')">DUID ${sortBatchAnchorArrow('duid')}</th>`;
  headCells += cols.map(k=>{
    const label = anchorColLabel(k);

  }).join('');
  let rows = `<tr>
    <th class="no-sel" style="width:32px"><input type="checkbox" class="ap-check" ${allChecked?'checked':''} onclick="toggleCheckAllBatchAnchor(${allChecked?'false':'true'})"></th>
    ${headCells}
    <th class="no-sel">状态</th><th class="no-sel">备注</th><th class="no-sel">操作</th>
  </tr>`;
  for(const m of list){
    const key = batchMatKey(m);
    const rowCls = m.done ? 'row-done' : (m.status ? 'row-broken' : '');

    const statusCell = m.done
      ? '<span class="ap-status st-done">✅ 完成</span>'
      : `<select class="ap-select" onchange="setBatchMaterialStatus('${esc(m.wid||'')}', '${esc(m.itemcode)}', this.value)">${buildStatusOptions(statusOptions, m.status)}</select>`;
    const remarkCell = m.remark
      ? `<span class="ap-remark" title="${esc(m.remark)}" onclick="editBatchMaterialRemark('${esc(m.wid||'')}', '${esc(m.itemcode)}')">${esc(m.remark)}</span>`
      : `<span class="ap-remark" style="color:var(--muted)" onclick="editBatchMaterialRemark('${esc(m.wid||'')}', '${esc(m.itemcode)}')">＋备注</span>`;
    const doneBtn = m.done

  const t = scroll.querySelector('table.anchor-table');

function sortAnchor(key){

    anchorSort.dir = anchorSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    anchorSort.key = key;
    anchorSort.dir = 'asc';
  }
  paintAnchorPanel();
}

function sortAnchorArrow(key){
  if(anchorSort.key !== key) return '↕';
  return anchorSort.dir === 'asc' ? '▲' : '▼';
}

function anchorList(){
  if(!anchorData || !anchorData.ok) return [];
  let mats = (anchorData.materials || []).slice();
  mats = anchorFilter === 'todo' ? mats.filter(m=>!m.done) : mats;
  const key = anchorSort.key, dir = anchorSort.dir;
  if(key){
    mats.sort((a,b)=>{
      let va = anchorCellVal(a, key), vb = anchorCellVal(b, key);
      const na = parseFloat(va), nb = parseFloat(vb);
      const sa = (va === undefined || va === null) ? '' : String(va).trim();
      const sb = (vb === undefined || vb === null) ? '' : String(vb).trim();
      if(sa !== '' && sb !== '' && !isNaN(na) && !isNaN(nb)){
        va = na; vb = nb;
      } else {
        va = sa; vb = sb;
      }
      if(va < vb) return dir === 'asc' ? -1 : 1;
      if(va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }
  return mats;
}

function anchorColLabel(key){
  return ANCHOR_COL_LABELS[key] || key;
}

function anchorCellVal(m, key){
  if(m.extra && m.extra[key] !== undefined && m.extra[key] !== null) return m.extra[key];
  if(m[key] !== undefined && m[key] !== null) return m[key];
  return '';
}

function anchorCols(){
  const f = currentAnchorFlow();
  const s = (f && f.steps) ? f.steps.find(x=>x.anchor) : null;
  const cfg = (s && s.anchor && s.anchor.columns);
  if(Array.isArray(cfg) && cfg.length) return cfg.slice();
  // 默认展示：锚点节点输出的原始列（排除 DUID，DUID 由批量面板单独加）
  const all = [];
  ((anchorData && anchorData.allColumns) || []).forEach(c=>{ if(c && c.toUpperCase() !== 'DUID' && all.indexOf(c) < 0) all.push(c); });
  ((batchAnchorData && batchAnchorData.allColumns) || []).forEach(c=>{ if(c && c.toUpperCase() !== 'DUID' && all.indexOf(c) < 0) all.push(c); });
  return all.length ? all : ANCHOR_DEFAULT_COLS.slice();
}

function buildStatusOptions(statusOptions, cur){
  let h = '<option value="">（待处理）</option>';
  for(const st of (statusOptions||[])){
    h += `<option value="${esc(st)}"${st===cur?' selected':''}>${esc(st)}</option>`;
  }
  return h;
}

function paintAnchorPanel(){
  const toolbar = document.getElementById('anchor-toolbar');
  const scroll = document.getElementById('anchor-scroll');
  if(!toolbar || !scroll) return;
  if(!anchorData){ scroll.innerHTML = '<div class="ap-empty">加载中…</div>'; toolbar.innerHTML=''; return; }
  if(!anchorData.ok){
    scroll.innerHTML = '<div class="ap-empty">⚠️ ' + esc(anchorData.error || '读取失败') + '</div>';
    toolbar.innerHTML = '';
    return;
  }
  const mats = anchorData.materials || [];
  const statusOptions = anchorData.statusOptions || [];
  const doneCount = mats.filter(m=>m.done).length;
  const todoCount = mats.length - doneCount;
  const list = anchorList();
  const allCodes = new Set(mats.map(m=>m.itemcode));
  anchorChecked.forEach(c=>{ if(!allCodes.has(c)) anchorChecked.delete(c); });
  const checkedCount = anchorChecked.size;
  const allChecked = list.length>0 && list.every(m=>anchorChecked.has(m.itemcode));
  toolbar.innerHTML = `
    <span class="at-count">共 ${mats.length} 颗 · 未完成 ${todoCount} · 已完成 ${doneCount}</span>
    <span class="at-sep"></span>
    <button class="btn btn-ghost btn-sm" onclick="toggleAnchorFilter()">${anchorFilter==='todo'?'☑ 只看未完成':'☐ 只看未完成'}</button>
    <span class="at-sep"></span>
    <span class="sub">批量（已勾 ${checkedCount}）：</span>
    <button class="btn btn-ghost btn-sm" onclick="batchSetAnchorDone(true)">✅ 批量完成</button>
    <button class="btn btn-ghost btn-sm" onclick="batchSetAnchorDone(false)">↺ 取消完成</button>
    <span class="at-sep"></span>
    <button class="btn btn-ghost btn-sm" onclick="openAnchorColConfig()">⚙ 展示设置</button>
    <button class="btn btn-ghost btn-sm" onclick="openStatusOptions()">🏷 状态设置</button>
    <button class="btn btn-primary btn-sm" onclick="openAnchorQuery()">🔍 查询</button>
    <button class="btn btn-ghost btn-sm" onclick="refreshMaterialStatus()">🔄 刷新物料状态</button>
  `;
  const cols = anchorCols();
  let headCells = cols.map(k=>{
    const label = anchorColLabel(k);
    return `<th class="sortable" onclick="sortAnchor('${esc(k)}')">${esc(label)} ${sortAnchorArrow(k)}</th>`;
  }).join('');
  let rows = `<tr>
    <th class="no-sel" style="width:32px"><input type="checkbox" class="ap-check" ${allChecked?'checked':''} onclick="toggleCheckAllAnchor(${allChecked?'false':'true'})"></th>
    ${headCells}
    <th class="no-sel">状态</th><th class="no-sel">备注</th><th class="no-sel">操作</th>
  </tr>`;
  for(const m of list){
    const rowCls = m.done ? 'row-done' : (m.status ? 'row-broken' : '');
    const checked = anchorChecked.has(m.itemcode) ? 'checked' : '';
    const statusCell = m.done
      ? '<span class="ap-status st-done">✅ 完成</span>'
      : `<select class="ap-select" onchange="setMaterialStatus('${esc(m.itemcode)}', this.value)">${buildStatusOptions(statusOptions, m.status)}</select>`;
    const remarkCell = m.remark
      ? `<span class="ap-remark" title="${esc(m.remark)}" onclick="editMaterialRemark('${esc(m.itemcode)}')">${esc(m.remark)}</span>`
      : `<span class="ap-remark" style="color:var(--muted)" onclick="editMaterialRemark('${esc(m.itemcode)}')">＋备注</span>`;
    const doneBtn = m.done
      ? `<button class="ap-op" onclick="setMaterialDone('${esc(m.itemcode)}', false)">↺ 未完成</button>`
      : `<button class="ap-op done" onclick="setMaterialDone('${esc(m.itemcode)}', true)">✔ 完成</button>`;
    rows += `<tr class="${rowCls}">
      <td class="no-sel"><input type="checkbox" class="ap-check" ${checked} onclick="toggleAnchorCheck('${esc(m.itemcode)}', this.checked)"></td>
      ${cols.map(k=>`<td>${esc(anchorCellVal(m, k))}</td>`).join('')}

      <td class="no-sel">${remarkCell}</td>

    </tr>`;
  }
  scroll.innerHTML = `<table class="pv-table anchor-table">${rows}</table>`;
  const t = scroll.querySelector('table.anchor-table');
  if(t) enableRangeSelect(t);

function toggleAnchorFilter(){ anchorFilter = anchorFilter==='todo' ? 'all' : 'todo'; paintAnchorPanel(); }
function toggleAnchorCheck(itemcode, checked){ if(checked) anchorChecked.add(itemcode); else anchorChecked.delete(itemcode); paintAnchorPanel(); }
function toggleCheckAllAnchor(checked){
  const list = anchorList();
  if(checked){
    // 勾选全部：只勾选当前展示（筛选后）的 itemcode，清掉其它筛选下残留的勾选
    anchorChecked.clear();
    list.forEach(m=>anchorChecked.add(m.itemcode));
  } else {
    list.forEach(m=>anchorChecked.delete(m.itemcode));
  }
  paintAnchorPanel();
}

function syncWorkMaterialPatch(w, itemcode, patch){
  // 同步前端内存 w.materials，避免后续 saveData() 用旧内存覆盖后端保存的物料状态
  if(!w || !itemcode) return;
  if(!w.materials) w.materials = [];
  let m = w.materials.find(x=>x && x.itemcode === itemcode);
  if(!m){ m = {itemcode: itemcode}; w.materials.push(m); }
  if('status' in patch) m.status = patch.status || '';
  if('remark' in patch) m.remark = patch.remark || '';
  if('done' in patch) m.done = !!patch.done;
}

async function setMaterialStatus(itemcode, status){
  const f = currentAnchorFlow(), w = currentAnchorWorkItem();
  if(!f || !w) return;
  await pywebview.api.save_material_status(f.id, w.id, [{itemcode:itemcode, status:status||''}]);
  syncWorkMaterialPatch(w, itemcode, {status: status||''});
  const m = (anchorData && anchorData.materials||[]).find(x=>x.itemcode===itemcode);
  if(m) m.status = status || '';
  paintAnchorPanel();
  toast(status ? ('已标记「'+status+'」') : '已清除状态');
}

async function setMaterialDone(itemcode, done){
  const f = currentAnchorFlow(), w = currentAnchorWorkItem();
  if(!f || !w) return;
  await pywebview.api.save_material_status(f.id, w.id, [{itemcode:itemcode, done:done}]);
  syncWorkMaterialPatch(w, itemcode, {done: done});
  const m = (anchorData && anchorData.materials||[]).find(x=>x.itemcode===itemcode);
  if(m) m.done = done;
  paintAnchorPanel();
}

/* ================= 任务锚点列配置 ================= */
let anchorColOrder = [];          // 列配置弹窗候选列的当前顺序
let anchorColChecked = new Set(); // 弹窗里当前勾选的列

function openAnchorColConfig(){
  const f = currentAnchorFlow();
  const s = (f && f.steps) ? f.steps.find(x=>x.anchor) : null;
  if(!s) return;
  const allCols = [];
  ((anchorData && anchorData.allColumns) || []).forEach(c=>{ if(c && allCols.indexOf(c) < 0) allCols.push(c); });
  ((batchAnchorData && batchAnchorData.allColumns) || []).forEach(c=>{ if(c && allCols.indexOf(c) < 0) allCols.push(c); });
  // 替换虚拟列（文件原始列之外）
  ['fromType','fromItemcode'].forEach(k=>{ if(allCols.indexOf(k) < 0) allCols.push(k); });
  // 用户已配置但当前文件里没有的列，追加到末尾，避免打开弹窗后丢配置
  anchorCols().forEach(k=>{
    if(allCols.indexOf(k) >= 0) return;
    const label = anchorColLabel(k);
    if(label !== k && allCols.indexOf(label) >= 0) return;  // 系统字段 key（如 project/desc/sitestype）已作为文件原始列存在，跳过，避免重复
    allCols.push(k);
  });
  anchorColOrder = allCols.slice();
  anchorColChecked = new Set(anchorCols());
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.id = 'anchor-col-modal';
  m.innerHTML = `<div class="modal" style="width:560px;max-height:80vh;overflow:auto">
    <h3>⚙ 任务锚点展示列</h3>
    <div class="sub">勾选要展示的列；按住 ⠿ 拖拽、或点 ▲▼ 调整表头顺序（状态 / 备注 / 操作 3 列固定显示）。「替换前 type / 替换前 itemcode」在替换物料时自动记录。</div>
    <div class="anchor-col-list" id="anchor-col-list"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-ghost btn-sm" onclick="resetAnchorCols()">恢复默认</button>
      <button class="btn btn-primary" id="anchor-col-ok">保存</button>
      <button class="btn btn-ghost" id="anchor-col-cancel">取消</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  renderAnchorColList(m);
  document.getElementById('anchor-col-cancel').onclick = function(){ m.remove(); };
  document.getElementById('anchor-col-ok').onclick = function(){
    const checked = anchorColOrder.filter(k=>anchorColChecked.has(k));
    saveAnchorColConfig(checked);
    m.remove();
  };
}

function renderAnchorColList(m){
  const list = m.querySelector('#anchor-col-list');
  if(!list) return;
  list.innerHTML = anchorColOrder.map((k, idx)=>{
    return `<div class="anchor-col-item" draggable="true" data-key="${esc(k)}"
        ondragstart="anchorColDragStart(event)" ondragover="anchorColDragOver(event)" ondrop="anchorColDrop(event)" ondragend="anchorColDragEnd(event)">
      <span class="col-grip" title="拖拽排序">⠿</span>
      <label class="col-label"><input type="checkbox" value="${esc(k)}" ${anchorColChecked.has(k)?'checked':''} onchange="anchorColToggle(this)"> ${esc(anchorColLabel(k))} <span class="sub">${esc(k)}</span></label>
      <span class="col-move">
        <button type="button" class="col-mv-btn" onclick="moveAnchorCol(this,-1)" ${idx===0?'disabled':''}>▲</button>
        <button type="button" class="col-mv-btn" onclick="moveAnchorCol(this,1)" ${idx===anchorColOrder.length-1?'disabled':''}>▼</button>
      </span>
    </div>`;
  }).join('');
}

function anchorColToggle(el){
  if(el.checked) anchorColChecked.add(el.value);
  else anchorColChecked.delete(el.value);
}

function moveAnchorCol(el, dir){
  const item = el.closest('.anchor-col-item');
  if(!item) return;
  const key = item.getAttribute('data-key');
  const idx = anchorColOrder.indexOf(key);
  const ni = idx + dir;
  if(idx < 0 || ni < 0 || ni >= anchorColOrder.length) return;
  anchorColOrder.splice(idx, 1);
  anchorColOrder.splice(ni, 0, key);
  const m = document.getElementById('anchor-col-modal');
  if(m) renderAnchorColList(m);
}

function anchorColDragStart(e){
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', e.currentTarget.getAttribute('data-key')); }catch(_){}
  e.currentTarget.classList.add('col-dragging');
}
function anchorColDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}
function anchorColDragEnd(e){
  e.currentTarget.classList.remove('col-dragging');
}
function anchorColDrop(e){
  e.preventDefault();
  const key = e.dataTransfer.getData('text/plain');
  const target = e.currentTarget.getAttribute('data-key');
  if(!key || !target) return;
  const from = anchorColOrder.indexOf(key);
  const to = anchorColOrder.indexOf(target);
  if(from < 0 || to < 0 || from === to) return;
  anchorColOrder.splice(from, 1);
  anchorColOrder.splice(to, 0, key);
  const m = document.getElementById('anchor-col-modal');
  if(m) renderAnchorColList(m);
}

async function saveAnchorColConfig(sel){
  const f = currentAnchorFlow();
  const s = (f && f.steps) ? f.steps.find(x=>x.anchor) : null;
  if(!s) return;
  if(!s.anchor) s.anchor = {};
  s.anchor.columns = sel.slice();
  try{ await pywebview.api.save_data(DATA); }catch(e){}
  paintAnchorPanel();
  paintBatchAnchorPanel();
}

async function resetAnchorCols(){
  const f = currentAnchorFlow();
  const s = (f && f.steps) ? f.steps.find(x=>x.anchor) : null;
  if(s && s.anchor) delete s.anchor.columns;
  try{ await pywebview.api.save_data(DATA); }catch(e){}
  document.querySelectorAll('.modal-bg').forEach(x=>x.remove());
  paintAnchorPanel();
  paintBatchAnchorPanel();
}
