// 清理流程内所有失效引用（指向已删除清单项/节点的输入引用、工具槽位），返回清理数量
function cleanupOrphanRefs(f){
  if(!f) return 0;
  const validCl = new Set((f.checklist||[]).map(c=>c.id));
  const validNode = new Set((f.steps||[]).map(s=>s.id));
  let cleaned = 0;
  for(const s of (f.steps||[])){
    if(s.input && s.input.items && s.input.items.length){
      const before = s.input.items.length;
      s.input.items = s.input.items.filter(it=>{
        if(it.kind==='checklist') return it.refId && validCl.has(it.refId);
        if(it.kind==='node') return it.refId && validNode.has(it.refId);
        return true; // file 项保留
      });
      cleaned += before - s.input.items.length;
    }
    if(s.tool && s.tool.config){
      const itemIds = new Set(((s.input && s.input.items) || []).map(it=>it.id));
      const outIds = new Set(((s.output && s.output.files) || []).map(f=>f.id));
      s.tool.config.forEach(c=>{
        if(!c.itemId) return;
        const id = String(c.itemId);
        // 特殊槽位豁免：DUID 清单动态、平台凭证（pf_）永远有效，不参与失效清理
        if(id === '__duid_list__' || id.startsWith('pf_')) return;
        if(id.startsWith('out_')){
          if(!outIds.has(id)){ c.itemId = null; cleaned++; }
        } else if(!itemIds.has(id)){
          c.itemId = null; cleaned++;
        }
      });
    }
  }
  return cleaned;
}

// 清理孤儿 workItems：batchId/sourceBatchId 都指向已不存在的批次（历史删除不彻底遗留），避免导入 DUID 时误判重复
function cleanupOrphanWorkItems(f){
  if(!f) return 0;
  const bidSet = new Set((f.batches||[]).map(b=>b.id));
  const before = (f.workItems||[]).length;
  f.workItems = (f.workItems||[]).filter(w=>{
    if(w.batchId) return bidSet.has(w.batchId);
    if(w.sourceBatchId) return bidSet.has(w.sourceBatchId);
    return false; // 既无 batchId 也无 sourceBatchId 的孤儿
  });
  return before - (f.workItems||[]).length;
}

// 刷新节点：按最新配置清理失效引用并重渲染
async function refreshNode(stepId){
  const f = flowOfStep(stepId);
  if(!f) return;
  const n = cleanupOrphanRefs(f);
  await saveData();
  render();
  toast(n>0 ? `🔄 已清理 ${n} 处失效引用，按最新配置显示` : '🔄 已刷新，配置已是最新');
}

function deleteChecklistItem(flowId, itemId){
  const f = DATA.flows.find(x=>x.id===flowId);
  const item = (f.checklist||[]).find(c=>c.id===itemId);
  showConfirm(`删除资料「${item?item.name:''}」？引用它的节点输入会一并解除关联。`, async function(){
    f.checklist = (f.checklist||[]).filter(c=>c.id!==itemId);
    cleanupOrphanRefs(f);
    await saveData(); render(); toast('已删除');
  });
}

function renderProgressRow(f){
  // 操作手册是节点配置/作业标准设定，无进度概念，不显示进度条和「完成本步/重置」按钮
  if(flowTab === 'manual') return '';
  const doneSet = workDoneSet || new Set((f.progress && f.progress.done) || []);
  const done = doneSet.size;
  const total = f.steps.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const curId = currentStepId(f);
  const isBatch = (flowTab === 'work' && workView === 'flow' && currentBatchId);
  const rerunBtn = isBatch ? `<button class="btn btn-ghost" onclick="openRerunNodes()">↺ 重跑节点</button>` : '';
  if(!curId){
    return `<div class="progress-row">
      <div class="flow-done-tip">🎉 流程已完成，共 ${total} 步</div>
      <div class="progress-acts">${isBatch ? rerunBtn : `<button class="btn btn-ghost" onclick="resetProgress('${f.id}')">↺ 重新开始</button>`}</div>
    </div>`;
  }
  const doneBtn = isBatch
    ? `<button class="btn btn-primary" onclick="completeBatchStep('${currentBatchId}')">✅ 完成本步，下一步</button>`
    : `<button class="btn btn-primary" onclick="nextStep('${f.id}')">✅ 完成本步，下一步</button>`;
  const resetBtn = isBatch ? '' : `<button class="btn btn-ghost" onclick="resetProgress('${f.id}')">↺ 重置</button>`;
  return `<div class="progress-row">
    <div class="progress-left">
      <span class="p-label">进度</span>
      <div class="p-track"><div class="p-fill" style="width:${pct}%"></div></div>
      <span class="p-num">${done} / ${total}</span>
    </div>
    <div class="progress-acts">${doneBtn}${resetBtn}${rerunBtn}</div>
  </div>`;
}

function renderGuide(s){
  const steps = (s && s.steps) || [];
  let items;
  if(steps.length){
    items = steps.map((st,i)=>renderGuideStep(i+1, st.text, st.shot));
  } else {
    const lines = ((s && s.desc)||'').split('\n').map(x=>x.trim()).filter(Boolean);
    if(!lines.length) return '<div class="guide-body empty">（暂无操作指导）</div>';
    items = lines.map((l,i)=>renderGuideStep(i+1, l, null));
  }
  return `<div class="guide-body">${items.join('')}</div>`;
}
function renderGuideStep(num, text, shot){
  const shotHtml = shot ? `<img class="gs-shot file-img" data-src="${esc(shot)}" onclick="viewShot(this)" alt="点击放大" title="点击放大">` : '';
  return `<div class="guide-step"><span class="gs-num">${num}</span><div class="gs-main"><span class="gs-text">${esc(text||'')}</span>${shotHtml}</div></div>`;
}

// 工具输入关联状态（绿=已关联文件 / 灰=未关联）；别名=关联的输入项名/节点名
function renderToolInputStatus(f, s){
  const cfg = (s.tool && s.tool.config) || [];
  if(!cfg.length) return '';
  const chips = cfg.map((c,i)=>{
    const ref = resolveToolInputRef(f, s, c);
    const linked = !!(ref && ref.path);
    const cls = linked ? 'linked' : 'missing';
    const alias = toolRefLabel(s, c) || c.id || ('输入'+(i+1));
    const tip = linked ? ('已关联：'+(ref.name||ref.path)) : '未关联文件';
    return `<span class="tool-in-chip ${cls}" title="${esc(tip)}">${linked?'●':'○'} ${esc(alias)}</span>`;
  }).join('');
  return `<div class="tool-in-status"><span class="tool-in-status-label">工具输入：</span>${chips}</div>`;
}

function renderMsgBox(s){
  if(flowTab !== 'work' || (workView !== 'flow' && workView !== 'item')) return '';
  if(!s.tool) return '';
  const hasTpl = !!(s.msgTemplate && s.msgTemplate.trim());
  const cached = hasTpl ? (msgCache[s.id] || '') : '';
  const tplHtml = hasTpl ? highlightMsgTpl(s.msgTemplate) : '<span class="sub">（该节点未配置消息模板，可在「操作手册」里编辑节点补充）</span>';
  const outHtml = cached
    ? `<div class="msg-text">${esc(cached).replace(/\n/g,'<br>')}</div>`
    : '<span class="sub">运行工具后，这里显示生成的可粘贴消息</span>';
  return `<div class="pane msg-pane" id="msgpane-${s.id}">
    <div class="pane-title">📤 返回消息数据 <span class="sub">按模板从结果里筛值生成</span></div>
    <div class="msg-template-line">${tplHtml}</div>
    <div class="msg-out" id="msgout-${s.id}">${outHtml}</div>
    <div class="tool-row">
      <button class="btn btn-ghost btn-sm" onclick="copyMsg('${s.id}')">📋 复制</button>
    </div>
  </div>`;
}
async function copyMsg(stepId){
  const text = msgCache[stepId] || '';
  if(!text){ toast('还没有生成的消息，先运行工具'); return; }
  try{
    await navigator.clipboard.writeText(text);
    toast('✅ 已复制到剪贴板');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('✅ 已复制到剪贴板');
    }catch(e2){ toast('❌ 复制失败，请手动选中复制'); }
  }
}

function renderConsole(f, s){
  if(!s) return '<div class="empty"><div class="big">📭</div>还没有节点</div>';
  const st = stepStatus(f, s);
  const stLabel = st==='done' ? '已完成' : (st==='active' ? '进行中' : '未开始');
  const t = s.tag;
  const tags = [];
  if(t) tags.push(`<span class="tag-pill">${tagIcon(t)} ${esc(tagName(t))}</span>`);
  if(s.screenshot) tags.push('<span class="tag shot">📷 截图</span>');
  if(s.tool) tags.push('<span class="tag tool">🔧 工具</span>');
  if(s.files && s.files.length) tags.push('<span class="tag file">📁 文件</span>');

  const brief = s.brief ? `<div class="brief-body">${esc(s.brief)}</div>` : '<div class="brief-body empty">（暂无简介）</div>';

  const items = (s.input && s.input.items) || [];

  // 输入条目（统一：名称 + 来源标签 + 附件），紧凑展示；拖入型缺文件的项提供拖入框
  const entries = [];
  const bctx = batchContext(f);
  const inWorkView = (workView === 'flow' || workView === 'item');
  for(const it of items){
    if(it.kind === 'file'){
      if(inWorkView){
        // 作业视图：显示临时拖入的文件（或拖入框）
        const tmp = getTempFile(f, s.id, it.id);
        entries.push({ name: it.name || '上传文件', src: null, desc: null, file: tmp || null,
                       del: tmp ? `removeTempFileItem('${esc(s.id)}', '${esc(it.id)}')` : null,
                       req: !!it.required, drop: tmp ? null : ('item:'+it.id) });
      } else {
        // 操作手册：临时拖入槽位，不承载具体文件
        entries.push({ name: it.name || '临时拖入', src: {label:'临时拖入', title:'作业时在此拖入文件，仅在该批次/该 DUID 作业下保留，不影响框架'},
                       desc: null, file: null, del: null, req: !!it.required });
      }
    } else if(it.kind === 'checklist'){
      const c = findChecklistItem(f, it.refId);
      entries.push(c
        ? { name: it.name || c.name, src: {label:'初始清单', title:'来源：初始清单「'+c.name+'」'}, desc: c.desc || null,
            file: c.file || null, del: null, req: !!it.required }
        : { name: it.name || '引用的初始清单项已删除', warn: true, req: !!it.required });
    } else if(it.kind === 'node'){
      const target = findStep(it.refId);
      const refFile = target ? resolveNodeOutputFile(it.refId, it.refFile) : null;
      entries.push(target
        ? { name: it.name || target.name, src: {label:'节点输出', title:'来源：节点「'+target.name+'」的输出'},
            desc: (target.output && target.output.text) || null,
            file: refFile, del: null, req: !!it.required }
        : { name: it.name || '引用的节点已删除', warn: true, req: !!it.required });
    } else if(it.kind === 'desc'){
      entries.push({ name: it.name || '描述', src: {label:'仅描述', title:'仅文字描述，无需文件'}, desc: null, file: null, del: null, req: !!it.required });
    } else if(it.kind === 'duidlist'){
      if(bctx && bctx.duids.length){
        duidLists[s.id] = bctx.duids.slice();
        entries.push({ name:'DUID 清单（'+bctx.duids.length+' 个）', src:{label:'批次动态', title:'当前批次剩余 DUID：'+bctx.duids.length+' 个'}, duids:bctx.duids.slice(), stepId:s.id, req:false, anchor:true });
      } else if(workView === 'item' && currentWorkItemId){
        const w = (f.workItems||[]).find(x=>x.id===currentWorkItemId);
        const curDuid = w ? w.duid : '';
        duidLists[s.id] = [curDuid];
        entries.push({ name:'DUID 清单（1 个）', src:{label:'当前 DUID', title:'当前 DUID：'+curDuid}, duids:[curDuid], stepId:s.id, req:false, anchor:true });
      } else {
        entries.push({ name: it.name || 'DUID 清单（批次动态）', src:{label:'批次动态', title:'批次作业时自动 = 当前批次剩余 DUID'}, desc:null, file:null, del:null, req:false });
      }
    }
  }

  const inText = (s.input && s.input.text) ? s.input.text : '';
  let inBody = inText ? `<div class="io-body">${esc(inText)}</div>` : '';
  if(!entries.length){
    if(!inBody) inBody = '<div class="io-entry-empty">（暂无输入）</div>';
  } else {
    inBody += entries.map(e=>{
      const reqMark = e.req ? ' <span class="dz-required">必选</span>' : '';
      const nameHtml = `<span class="io-entry-name">${esc(e.name)}${reqMark}</span>`;
      if(e.warn) return `<div class="io-entry warn">${nameHtml}</div>`;
      if(e.duids) return renderDuidListEntry(e);
      const srcTag = e.src ? `<span class="io-entry-src" title="${esc(e.src.title)}">${esc(e.src.label)}</span>` : '';
      const descHtml = e.desc ? `<div class="io-entry-desc">${esc(e.desc)}</div>` : '';
      const fileHtml = e.file ? `<div class="io-entry-file">${filePill(e.file, e.del)}</div>` : '';
      const dropHtml = (!e.file && e.drop) ? `<div class="io-entry-file"><div class="drop-zone drop-inline" data-drop="${esc(e.drop)}"><span class="dz-icon">📥</span><span>拖入文件</span></div></div>` : '';
      return `<div class="io-entry"><div class="io-entry-head">${nameHtml}${srcTag}</div>${descHtml}${fileHtml}${dropHtml}</div>`;
    }).join('');
  }

  // 网页链接：任何标签的节点，遍历所有已配置网址，名称在前、网址在后
  let inExtra = '';
  const urls = (s.urls && s.urls.length) ? s.urls : (s.url ? [{name:s.siteNote||'', url:s.url}] : []);
  const validUrls = urls.filter(u => (u.url||'').trim());
  if(validUrls.length){
    inExtra = validUrls.map(u => `<div class="url-link" onclick="openUrl('${esc(u.url)}')" title="${esc(u.url)}">🌐 <span class="url-name-label">${esc(u.name||'')}</span><span class="url-addr">${esc(u.url)}</span></div>`).join('');
  }
  const inputBlock = `
      <div class="io-block in">
        <div class="io-block-title">🟢 输入</div>
        ${inBody}
        ${inExtra}
      </div>`;

  const outText = (s.output && s.output.text) ? s.output.text : '';
  const outRealFiles = (s.output && s.output.files) || [];
  // 输出模板文件：与「🔵 输出」标题同行
  const outTplHtml = outRealFiles.map(f=>`<span class="io-file io-file-inline" onclick="previewFile('${esc(f.path||f.name)}')" title="点击预览">📄 ${esc(f.name)}</span>`).join('');
  // 旧文字文件名（节点输出引用用）
  const outNamesHtml = (s.files && s.files.length)
    ? `<div class="io-files">${s.files.map(f=>`<div class="io-file" onclick="previewFile('${esc(f.name)}')" title="点击预览">📄 ${esc(f.name)}</div>`).join('')}</div>`
    : '';
  // 输出结果小模块（工具运行后结果文件放这里；已完成节点刷新后仍保留）
  const savedResults = (s.output && s.output.results) || [];
  const outResultInit = savedResults.length
    ? savedResults.map(o=>`<div class="io-file" onclick="previewFile('${esc(o.rel)}')" title="点击预览">📄 ${esc(o.name)}</div>`).join('')
    : `<div class="sub">运行「${esc(s.tool && s.tool.name)}」后，结果文件显示在这里</div>`;
  const outResultHtml = s.tool ? `
        <div class="out-result">
          <div class="out-result-title">📁 输出结果</div>
          <div class="out-result-body" id="outresultbody-${s.id}">${outResultInit}</div>
        </div>` : '';
  // 操作举证截图粘贴区：仅在作业视图（批次 / 单 DUID）出现，供「完成本步」时归档保存
  const evidenceHtml = (flowTab === 'work' && (workView === 'flow' || workView === 'item')) ? renderEvidenceZone(s) : '';
  const outputBlock = `
      <div class="io-block out">
        <div class="io-block-title">🔵 输出 ${outTplHtml}</div>
        <div class="io-body">${esc(outText)}</div>
        ${outNamesHtml}
        ${outResultHtml}
        ${evidenceHtml}
      </div>`;

  // 截图缩略图（放操作指导框里，点小图放大）
  const shotThumbs = s.screenshot
    ? `<div class="shot-thumbs"><img class="shot-thumb file-img" data-src="${esc(s.screenshot)}" onclick="viewShot(this)" alt="点击放大"></div>`
    : '';

  // 运行按钮禁用判定：无工具 / 必选文件未上传
  let runDisabled = false, runTip = '';
  if(!s.tool){
    runDisabled = true; runTip = '本节点未挂载工具';
  } else if(items.some(it => it.required && !resolveInputItemFile(f, s, it))){
    runDisabled = true; runTip = '请先补齐「必选」输入项的文件';
  } else if(s.tool.config && s.tool.config.some(c=>!resolveToolInputRef(f, s, c))){
    runDisabled = true; runTip = '工具的输入尚未全部关联到有效文件';
  }
  const runAttr = runDisabled ? ' disabled' : '';
  const runBtn = `<button class="btn btn-primary btn-sm" id="runbtn-${s.id}"${runAttr} onclick="runTool('${s.id}')" title="${esc(runTip)}">▶ 运行</button>`;

  let logPane = '';
  if(s.tool){
    const toolInStatus = renderToolInputStatus(f, s);
    logPane = `
        <div class="pane log-pane">
          <div class="pane-title">操作日志 <span class="sub">运行 ${esc(s.tool.name)}</span></div>
          ${toolInStatus}
          <div class="log-empty" id="logempty-${s.id}">点「▶ 运行」后，这里显示工具返回结果（仅本次显示、不保存）</div>
          <div class="log-box" id="logbox-${s.id}" style="display:none">
            <div class="log-body" id="logbody-${s.id}"></div>
          </div>
          <div class="tool-row">
            ${runBtn}
          </div>
        </div>`;
  } else {
    logPane = `
        <div class="pane log-pane">
          <div class="pane-title">操作日志</div>
          <div class="log-empty">本节点未挂载工具，暂无运行日志</div>
          <div class="tool-row">
            ${runBtn}
          </div>
        </div>`;
  }

  const note = s.note ? `<div class="note"><b>⚠️</b><span>${esc(s.note)}</span></div>` : '';

  // 数据卡片（网页操作专属）
  const dataCard = (t === 'web')
    ? `<div class="console-section">
        <div class="sec-label">📋 数据卡片</div>
        ${renderDataCard(s.dataCard)}
      </div>`
    : '';

  const urlNames = ((s.urls && s.urls.length) ? s.urls : (s.url ? [{name:s.siteNote||'', url:s.url}] : []))
    .filter(u => (u.url||'').trim())
    .map(u => (u.name||'').trim()).filter(Boolean);
  const siteNote = urlNames.length ? `<span class="site-note">${esc(urlNames.join('、'))}</span>` : '';

  // 作业清单的作业视图（批次作业/单 DUID 作业）隐藏「编辑/刷新/删除」节点按钮，
  // 这些编辑能力只保留在「操作手册」（flowTab==='manual'）里。
  const isWorkConsole = (flowTab === 'work' && (workView === 'flow' || workView === 'item'));
  const workFoot = isWorkConsole ? '' : `<div class="console-foot">
      <button class="btn btn-ghost" onclick="editNode('${s.id}')">✏️ 编辑</button>
      <button class="btn btn-ghost" onclick="refreshNode('${s.id}')" title="按最新配置清理失效引用">🔄 刷新</button>
      <button class="btn btn-ghost" onclick="deleteNode('${s.id}')">🗑 删除</button>
    </div>`;

  return `<div class="console">
    <div class="console-head">
      <div class="console-seq" style="background:${f.color};">${s.seq}</div>
      <div class="console-title">
        <h3>${esc(s.name)}${siteNote}</h3>
        <div class="c-state"><span class="status-badge ${st}">${stLabel}</span></div>
      </div>
      <div class="tags">${tags.join('')}</div>
    </div>

    <div class="console-section">
      <div class="sec-label">📝 节点简介</div>
      ${brief}
    </div>

    <div class="console-section">
      <div class="sec-label">🔁 输入 / 输出</div>
      <div class="console-ios">${inputBlock}${outputBlock}</div>
    </div>

    ${note}

    <div class="console-section">
      <div class="sec-label">🖥 操作台</div>
      <div class="console-grid">
        <div class="pane guide">
          <div class="pane-title">操作指导 <span class="sub">截图点小图放大</span></div>
          ${renderGuide(s)}
          ${shotThumbs}
        </div>
        ${logPane}
      </div>
    </div>

    ${renderMsgBox(s)}
    ${dataCard}

    <div class="pane preview-pane" id="previewpane-${s.id}" style="display:none" data-file="">
      <div class="pane-title">🔍 数据预览 <span class="sub" id="previewname-${s.id}"></span></div>
      <div class="preview-toolbar">
        <button class="btn btn-ghost btn-sm" onclick="openPreviewFile('${s.id}')">📂 打开所在文件夹</button>
        <button class="btn btn-ghost btn-sm" onclick="closePreview('${s.id}')">✕ 关闭</button>

}

/* ===== DUID 清单（批次动态）列表展示 + 复制 + 展开 ===== */
function renderDuidListEntry(e){
  const duids = e.duids || [];
  const total = duids.length;
  return `<div class="io-entry duid-entry">
    <div class="io-entry-head">
      <span class="io-entry-name">${esc(e.name)}</span>
      <span class="io-entry-src" title="${esc(e.src ? e.src.title : '')}">${esc(e.src ? e.src.label : '')}</span>
      <button type="button" class="btn btn-ghost btn-sm duid-copy" onclick="copyDuidList('${esc(e.stepId)}')" title="复制全部 DUID（每行一个）">📋 复制</button>
    </div>
    <div class="duid-list" id="duidlist-${esc(e.stepId)}">${renderDuidListInner(e.stepId)}</div>
  </div>`;
}
function renderDuidListInner(stepId, expanded){
  const duids = duidLists[stepId] || [];
  const total = duids.length;
  const COLLAPSE = 8;
  const lines = (expanded ? duids : duids.slice(0, COLLAPSE))
    .map(d=>`<div class="duid-line">${esc(d)}</div>`).join('');
  let toggle = '';
  if(total > COLLAPSE){
    toggle = expanded
      ? `<div class="duid-more" onclick="toggleDuidList('${esc(stepId)}')">▴ 收起</div>`
      : `<div class="duid-more" onclick="toggleDuidList('${esc(stepId)}')">▾ 展开全部 ${total} 个</div>`;
  }
  return lines + toggle;
}
function toggleDuidList(stepId){
  const el = document.getElementById('duidlist-'+stepId);
  if(!el) return;
  const expanded = el.dataset.expanded === '1';
  el.dataset.expanded = expanded ? '' : '1';
  el.innerHTML = renderDuidListInner(stepId, !expanded);
}
async function copyDuidList(stepId){
  const duids = duidLists[stepId] || [];
  if(!duids.length){ toast('暂无可复制的 DUID'); return; }
  const text = duids.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    toast('✅ 已复制 '+duids.length+' 个 DUID');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('✅ 已复制 '+duids.length+' 个 DUID');
    }catch(e2){ toast('❌ 复制失败，请手动选中复制'); }
  }
}

/* ===== 操作举证（输出框粘贴截图 / 拖入图片或文件）===== */
function renderEvidenceZone(s){
  return `<div class="evidence-zone" id="evidencezone-${s.id}">
    <div class="evidence-title">📷 操作举证 <span class="sub">粘贴截图，或拖入图片 / 文件（Excel、Word、PDF 等），作为「完成本步」的举证，完成后保存到 DUID 归档；点图片可放大</span></div>
    <div class="evidence-body" id="evidencebody-${s.id}">${renderEvidenceBodyInner(s.id)}</div>
  </div>`;
}
function renderEvidenceBodyInner(stepId){
  const ev = pendingEvidence[stepId];
  if(ev){
    if(ev.kind === 'file'){
      return `<div class="evidence-file">
        <div class="evidence-file-pill"><span class="evidence-file-icon">📄</span><span class="evidence-file-name" title="${esc(ev.name)}">${esc(ev.name)}</span></div>
        <button class="btn btn-ghost btn-sm" onclick="clearEvidence('${stepId}')">✕ 清除</button>
      </div>`;
    }
    const dataUrl = ev.dataUrl || ev;   // 兼容旧版字符串
    return `<div class="evidence-img"><img src="${dataUrl}" onclick="viewShot(this)" title="点击放大"><button class="btn btn-ghost btn-sm" onclick="clearEvidence('${stepId}')">✕ 清除</button></div>`;
  }
  return `<div class="evidence-upload">
    <div class="evidence-paste" onclick="focusEvidence('${stepId}')">📥 点击此处后 Ctrl+V 粘贴截图</div>
    <div class="evidence-drop" data-evidence-drop="${stepId}" onclick="pickEvidenceFile('${stepId}')">🖱 或拖入图片 / 文件（Excel、Word、PDF 等，点击也可选择）</div>
  </div>`;
}
function focusEvidence(stepId){
  evidenceTargetStepId = stepId;
  const el = document.getElementById('evidencezone-'+stepId);
  if(el) el.classList.add('focused');
  toast('已就绪，直接 Ctrl+V 粘贴截图');
}
function clearEvidence(stepId){
  delete pendingEvidence[stepId];
  renderEvidenceBody(stepId);
}
function renderEvidenceBody(stepId){
  const el = document.getElementById('evidencebody-'+stepId);
  if(!el) return;
  el.innerHTML = renderEvidenceBodyInner(stepId);
}
function pickEvidenceFile(stepId){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,.xlsx,.xls,.xlsm,.docx,.doc,.pdf,.csv,.txt,.zip,.rar,.7z';
  input.onchange = function(){
    if(input.files && input.files[0]){
      processEvidence(input.files[0], stepId);
    }
  };
  input.click();
}
function setupEvidenceDropZones(){
  const zones = document.querySelectorAll('[data-evidence-drop]');
  zones.forEach(zone=>{
    if(zone.dataset.bound) return;
    zone.dataset.bound = '1';
    const stepId = zone.dataset.evidenceDrop;
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=>{ zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(!file) return;
      processEvidence(file, stepId);
    });
  });
}
function processEvidence(file, stepId){
  if(!file) return;
  const isImage = !!(file.type && file.type.indexOf('image') === 0);
  if(isImage){
    // 图片：压缩后存 dataURL
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const maxW = 1920;
        const scale = Math.min(1, maxW/img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        pendingEvidence[stepId] = { kind:'image', name:'图片举证.jpg', dataUrl: c.toDataURL('image/jpeg', 0.92) };
        renderEvidenceBody(stepId);
        toast('✅ 举证图片已添加（完成本步后保存）');
      };
      img.onerror = function(){ toast('❌ 图片读取失败'); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  } else {
    // 文件：整体读成 dataURL 暂存
    const reader = new FileReader();
    reader.onload = function(ev){
      pendingEvidence[stepId] = { kind:'file', name: file.name, dataUrl: ev.target.result };
      renderEvidenceBody(stepId);
      toast('✅ 举证文件已添加（完成本步后保存）');
    };
    reader.onerror = function(){ toast('❌ 文件读取失败'); };
    reader.readAsDataURL(file);
  }
}

// 输入项拖入：给「缺文件的输入项」提供拖入框，拖入后补到对应来源（本节点输入文件 / 清单项文件 / 节点输出）
function setupInputItemDropZones(stepId){
  const zones = document.querySelectorAll('[data-drop]');
  zones.forEach(zone=>{
    if(zone.dataset.bound) return;
    zone.dataset.bound = '1';
    const dropKey = zone.dataset.drop;
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=>{ zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{ handleInputItemDrop(stepId, dropKey, file.name, ev.target.result); };
      reader.readAsDataURL(file);
    });
  });
}

async function handleInputItemDrop(stepId, dropKey, fileName, dataUrl){
  try{
    const r = await pywebview.api.save_input_file(fileName, dataUrl);
    if(!r || !r.ok){ toast('❌ 添加失败：'+(r&&r.error)); return; }
    const f = flowOfStep(stepId);
    const s = findStep(stepId);
    if(!s || !f) return;
    if(dropKey.startsWith('item:')){
      const itemId = dropKey.slice(5);
      const item = ((s.input && s.input.items) || []).find(x=>x.id === itemId);
      if(!item) return;
      if(item.kind === 'file' && (workView === 'flow' || workView === 'item')){
        // 作业视图：临时拖入，只存当前批次/当前 DUID 的上下文，不进框架
        setTempFile(f, s.id, itemId, {name:r.name, path:r.path});
      } else {
        item.kind = 'file'; item.file = {name:r.name, path:r.path};
      }
    }
    await saveData();
    render();
    toast('✅ 已添加文件：'+r.name);
  }catch(err){ toast('❌ 添加失败：'+err); }
}

async function removeTempFileItem(stepId, itemId){
  const f = flowOfStep(stepId);
  if(!f) return;
  removeTempFile(f, stepId, itemId);
  await saveData(); render(); toast('已移除临时文件');
}

async function openFile(name){
  try{
    const r = await pywebview.api.open_file(name);
    if(!r || !r.ok) toast('⚠️ '+(r && r.error || '打开失败'));
  }catch(e){ toast('❌ 打开失败：'+e); }
}

async function removeInputFileItem(stepId, itemId){
  const s = findStep(stepId);
  if(!s) return;
  const item = ((s.input && s.input.items) || []).find(x=>x.id === itemId);
  if(item) item.file = null;
  await saveData();
  render();
  toast('已移除该输入项的文件');
}

async function previewFile(name, stepId){
  stepId = stepId || selectedStepId;
  if(!stepId){ toast('请先选中一个节点'); return; }
  try{
    const r = await pywebview.api.preview_file(name);
    if(!r || !r.ok){ toast('⚠️ '+(r && r.error || '预览失败')); return; }
    const pane = document.getElementById('previewpane-'+stepId);
    if(!pane) return;
    pane.style.display = 'block';
    pane.dataset.file = name;
    const nm = document.getElementById('previewname-'+stepId);
    if(nm) nm.textContent = r.name || '';
    renderPreviewBody(stepId, r);
  }catch(e){ toast('❌ 预览失败：'+e); }
}

function renderPreviewBody(stepId, r){
  const body = document.getElementById('previewbody-'+stepId);
  if(!body) return;
  if(r.type === 'excel'){
    let html = '';
    for(const sh of (r.sheets||[])){
      html += `<div class="pv-sheet"><div class="pv-sheet-name">📑 ${esc(sh.name)}</div><div class="pv-scroll"><table class="pv-table">`;
      for(let i=0;i<sh.rows.length;i++){
        const row = sh.rows[i];
        html += '<tr>' + row.map(c=>`<${i===0?'th':'td'}>${esc(c)}</${i===0?'th':'td'}>`).join('') + '</tr>';
      }
      html += '</table></div></div>';
    }
    body.innerHTML = (html || '<div class="pv-empty">（空表）</div>')
      + '<div class="sub" style="margin-top:6px">💡 按住鼠标拖选单元格区域（像 Excel），选完按 Ctrl+C 复制；单击某格直接复制该格</div>';
    body.querySelectorAll('table.pv-table').forEach(t=>enableRangeSelect(t));
  } else if(r.type === 'image'){
    body.innerHTML = `<img class="pv-img" src="${r.data}">`;
  } else if(r.type === 'text'){
    body.innerHTML = `<pre class="pv-text">${esc(r.content||'')}</pre>`;
  } else {
    body.innerHTML = `<div class="pv-empty">${esc(r.hint || '该文件暂不支持预览')}</div>`;
  }
}

async function openPreviewFile(stepId){
  const pane = document.getElementById('previewpane-'+stepId);
  const name = pane ? pane.dataset.file : '';
  if(!name){ toast('请先点击文件进行预览'); return; }
  try{
    const r = await pywebview.api.open_folder(name);
    if(!r || !r.ok) toast('⚠️ '+(r && r.error || '打开失败'));
  }catch(e){ toast('❌ 打开失败：'+e); }
}

function closePreview(stepId){
  const pane = document.getElementById('previewpane-'+stepId);
  if(pane){ pane.style.display = 'none'; pane.dataset.file = ''; }
}

/* ===== 节点标签 ===== */
function tagById(id){ return (DATA.tags||[]).find(t=>t.id===id); }
function tagIcon(id){ const t=tagById(id); return t?t.icon:'🏷'; }
function tagName(id){ const t=tagById(id); return t?t.name:''; }

function openTagManager(){
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.id = 'tagManagerModal';
  m.innerHTML = `<div class="modal tag-modal">
    <h3>🏷 节点标签管理</h3>
    <div class="sub" style="margin:-6px 0 14px">给节点打标签后，系统会自动切换对应录入项（如「网页操作」会显示网址和数据卡片）</div>
    <div id="tagList"></div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-ghost" onclick="addTag()">＋ 添加标签</button>
      <button class="btn btn-primary" onclick="closeTagManager()">完成</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  renderTagList();
}
function closeTagManager(){
  const m = document.getElementById('tagManagerModal');
  if(m) m.remove();
  saveData();
  rebuildTagSelect();
}
function renderTagList(){
  const box = document.getElementById('tagList');
  if(!box) return;
  const tags = DATA.tags || [];
  box.innerHTML = tags.map(t=>`
    <div class="tag-row">
      <input class="tag-icon" value="${esc(t.icon)}" onchange="setTagIcon('${esc(t.id)}', this.value)" title="图标">
      <input class="tag-name" value="${esc(t.name)}" onchange="setTagName('${esc(t.id)}', this.value)" placeholder="标签名">
      <button class="tag-del" onclick="removeTag('${esc(t.id)}')" title="删除">✕</button>
    </div>`).join('') || '<div class="sub">还没有标签，点「＋ 添加标签」新增</div>';
}
function addTag(){

function parseDataCard(text){
  const lines = (text||'').split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  if(!lines.length) return null;
  const splitLine = (l)=>{
    if(l.indexOf('\t')>=0) return l.split('\t').map(c=>c.trim());
    if(l.indexOf(',')>=0) return l.split(',').map(c=>c.trim());
    return l.split(/\s{2,}/).map(c=>c.trim());
  };
  const rows = lines.map(splitLine);
  const colCount = Math.max.apply(null, rows.map(r=>r.length));
  const pad = r => Array.from({length:colCount}, (_,i)=>r[i]||'');
  return { headers: pad(rows[0]), rows: rows.slice(1).map(pad) };
}
function dataCardToText(card){
  if(!card || !card.headers || !card.headers.length) return '';
  const lines = [card.headers.join('\t')];
  (card.rows||[]).forEach(r=>lines.push((r||[]).join('\t')));
  return lines.join('\n');
}
function renderDataCard(card){
  if(card && (card.source==='ref-out' || card.source==='ref-in')){
    return renderDataCardRef(card);
  }
  if(!card || !card.headers || !card.headers.length) return '<div class="sub">暂无数据，可在「编辑节点」里从 Excel 粘贴进来</div>';
  const head = card.headers.map((h,i)=>`<th>${esc(h||('列'+(i+1)))}</th>`).join('');
  const body = (card.rows||[]).map((r,ri)=>`<tr>${r.map((c,ci)=>`<td onclick="copyCell(this)" title="点击复制">${esc(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="dc-scroll"><table class="dc-table"><thead><tr>${head}</tr></thead><tbody>${body||'<tr><td colspan="'+card.headers.length+'" style="color:#a3adbf;text-align:center">（空表格）</td></tr>'}</tbody></table></div>
    <div class="sub" style="margin-top:6px">💡 点击任意单元格即可复制，方便粘到网页里</div>`;
}
function renderDataCardRef(card){
  const target = allSteps().find(s=>s.id===card.refId);
  if(!target) return '<div class="sub">⚠️ 引用的节点不存在（可能已被删除），请重新编辑本节点选择来源</div>';
  const isOut = card.source==='ref-out';
  const label = isOut ? '输出' : '输入';
  const data = isOut ? target.output : target.input;
  const text = (data && data.text) ? data.text : '';
  let files = [];
  if(isOut){ files = target.files || []; }

  const filesHtml = files.map(f=>`<div class="io-file" onclick="openFile('${esc(f.name)}')" title="点击打开">📄 ${esc(f.name)}</div>`).join('');

    <div class="sub" style="margin-top:6px">💡 修改来源节点的输入/输出，这里会自动同步</div>

}
function copyCell(td){
  const text = (td.textContent||'').trim();
  if(!text){ toast('该格为空'); return; }
  copyText(text);
  td.classList.add('dc-copied');
  setTimeout(()=>td.classList.remove('dc-copied'), 600);

}
function copyText(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta);

  try{ document.execCommand('copy'); }catch(e){}

}

/* ===== 数据预览：Excel 式拖拽选区 + Ctrl+C 复制 ===== */
let rangeSel = { table:null, anchor:null, focus:null, active:false, moved:false, sx:0, sy:0 };
function cellRC(table, cell){
  const tr = cell.parentElement;
  return { r: Array.from(table.rows).indexOf(tr), c: Array.from(tr.cells).indexOf(cell) };
}
function clearRange(table){
  if(!table) return;
  table.querySelectorAll('td.sel,th.sel').forEach(x=>x.classList.remove('sel'));
}
function paintRange(){
  const t = rangeSel.table;
  if(!t) return;
  clearRange(t);
  if(!rangeSel.anchor || !rangeSel.focus) return;
  const a = cellRC(t, rangeSel.anchor), b = cellRC(t, rangeSel.focus);
  const r1=Math.min(a.r,b.r), r2=Math.max(a.r,b.r);
  const c1=Math.min(a.c,b.c), c2=Math.max(a.c,b.c);
  for(let r=r1;r<=r2;r++){
    const tr = t.rows[r];
    if(!tr) continue;
    for(let c=c1;c<=c2;c++){
      const td = tr.cells[c];
      if(td) td.classList.add('sel');
    }
  }
}
function copyRangeAsTsv(){
  const t = rangeSel.table;
  if(!t || !rangeSel.anchor || !rangeSel.focus) return;
  const a = cellRC(t, rangeSel.anchor), b = cellRC(t, rangeSel.focus);
  const r1=Math.min(a.r,b.r), r2=Math.max(a.r,b.r);
  const c1=Math.min(a.c,b.c), c2=Math.max(a.c,b.c);
  const lines = [];
  for(let r=r1;r<=r2;r++){
    const tr = t.rows[r];
    const vals = [];
    for(let c=c1;c<=c2;c++){
      vals.push((tr && tr.cells[c]) ? (tr.cells[c].textContent||'').trim() : '');
    }
    lines.push(vals.join('\t'));
  }
  copyText(lines.join('\n'));
  toast('已复制 ' + (r2-r1+1) + ' 行 × ' + (c2-c1+1) + ' 列');
}
function enableRangeSelect(table){
  if(table.dataset.rangeBound) return;
  table.dataset.rangeBound = '1';
  table.addEventListener('mousedown', function(e){
    if(e.button !== 0) return;
    const cell = e.target.closest('td,th');
    if(!cell) return;
    e.preventDefault();
    rangeSel.table = table;
    rangeSel.anchor = cell;
    rangeSel.focus = cell;
    rangeSel.active = true;
    rangeSel.moved = false;
    rangeSel.sx = e.clientX;
    rangeSel.sy = e.clientY;
    paintRange();
  });
}
document.addEventListener('mousemove', function(e){
  if(!rangeSel.active) return;
  if(!rangeSel.moved){
    if(Math.abs(e.clientX-rangeSel.sx) + Math.abs(e.clientY-rangeSel.sy) < 5) return;
    rangeSel.moved = true;
  }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if(!el) return;
  const cell = el.closest('td,th');
  if(cell && cell.closest('table') === rangeSel.table && cell !== rangeSel.focus){
    rangeSel.focus = cell;
    paintRange();
  }
});
document.addEventListener('mouseup', function(){
  if(!rangeSel.active) return;
  const table = rangeSel.table, anchor = rangeSel.anchor, moved = rangeSel.moved;
  rangeSel.active = false;
  if(!moved && anchor){
    copyCell(anchor);           // 单击：直接复制该格
    clearRange(table);
    rangeSel.anchor = rangeSel.focus = null;
  } else if(moved){
    toast('已选区域，按 Ctrl+C 复制');
  }
});
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')){
    if(rangeSel.table && rangeSel.anchor && rangeSel.focus && rangeSel.moved){
      copyRangeAsTsv();
      e.preventDefault();
    }
  }
});

/* ===== 截图放大 ===== */
function viewShot(el){
  const src = (el && el.src) || '';
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<span class="lb-close" onclick="this.parentNode.remove()">×</span><img src="${src}">`;
  const im = lb.querySelector('img');
  // 放大/平移状态
  let scale = 1, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;
  const apply = function(){ im.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  im.style.cursor = 'grab';
  // 滚轮缩放（以图片中心为基准）
  lb.addEventListener('wheel', function(e){
    e.preventDefault();
    const k = e.deltaY < 0 ? 1.18 : 0.85;
    scale = Math.max(0.25, Math.min(10, scale * k));
    apply();
  }, {passive:false});
  // 拖拽平移
  im.addEventListener('mousedown', function(e){
    e.preventDefault(); e.stopPropagation();
    dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
    im.style.cursor = 'grabbing';
  });
  document.addEventListener('mousemove', function(e){
    if(!dragging) return;
    tx = e.clientX - sx; ty = e.clientY - sy; apply();
  });
  document.addEventListener('mouseup', function(){ dragging = false; im.style.cursor = 'grab'; });
  // 双击重置
  im.addEventListener('dblclick', function(){ scale = 1; tx = 0; ty = 0; apply(); });
  // 点背景或右上角 × 关闭
  lb.onclick = function(e){ if(e.target===lb) lb.remove(); };
  document.body.appendChild(lb);
  // 若缩略图还没 hydrate（src 为空），异步补齐大图
  if(!src && el){
    const rel = el.getAttribute('data-src');
    if(rel){
      pywebview.api.get_shot(rel).then(function(r){ if(r && r.ok && r.data && im) im.src = r.data; }).catch(function(){});
    }
  }
}

      body += `<span class="ref" onclick="jump('${it.refId}')">↩ ${esc(it.name||it.refLabel||it.refId)}（节点输出）</span>`;

    } else if(it.kind === 'desc'){

  }

function nowStr(){

}
function workCount(f){ return (f && f.workItems) ? f.workItems.length : 0; }
function workItemDoneCount(w){ return (w && w.doneStepIds) ? w.doneStepIds.length : 0; }
function workItemCurrentStepId(f, w){
  const done = new Set((w && w.doneStepIds) || []);
  const s = f.steps.find(x => !done.has(x.id));
  return s ? s.id : null;
}
function isDetached(w){ return !!(w && !w.batchId && w.sourceBatchId); }
function workItemStatusLabel(f, w){
  if(!w) return '';
  if(isDetached(w)) return '拆出';
  if(workItemCurrentStepId(f,w)===null) return '已完成';
  const cur = f.steps.find(s=>s.id===workItemCurrentStepId(f,w));
  if(cur && cur.execMode==='batch') return '等待批量';
  return '进行中';
}
function maxIdNum(){
  let max = 0;
  for(const f of (DATA.flows||[])){
    for(const s of (f.steps||[])){ max = Math.max(max, parseInt(String(s.id).replace(/\D/g,''))||0); }
    for(const b of (f.batches||[])){ max = Math.max(max, parseInt(String(b.id).replace(/\D/g,''))||0); }
    for(const w of (f.workItems||[])){ max = Math.max(max, parseInt(String(w.id).replace(/\D/g,''))||0); }

}

// 批次里所有 DUID 的公共已完成节点集合（所有 DUID 都完成的节点 id 交集）
function batchCommonDone(f, b){
  const items = (f.workItems||[]).filter(w=>w.batchId===b.id);
  if(!items.length) return new Set();
  let common = new Set(items[0].doneStepIds || []);
  for(let i=1;i<items.length;i++){
    const cur = new Set(items[i].doneStepIds || []);
    common = new Set([...common].filter(x=>cur.has(x)));
  }
  return common;
}

// 批次作业：完成当前节点 → 批次内所有 DUID 都标记该节点完成
async function completeBatchStep(batchId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  const b = (f.batches||[]).find(x=>x.id===batchId);
  if(!b) return;
  const items = (f.workItems||[]).filter(w=>w.batchId===b.id);
  if(!items.length){ toast('本批次没有 DUID'); return; }
  workDoneSet = batchCommonDone(f, b);
  const curId = currentStepId(f);
  if(!curId){ toast('🎉 本批次已全部完成'); return; }
  const s = f.steps.find(x=>x.id===curId);
  // 归档：批次合表结果 → 批次归档；并按 DUID 拆出各 DU 的 Excel → 各 DU 归档
  const files = collectStepFiles(f, s);
  const duids = items.map(w=>w.duid).filter(Boolean);
  if(files.length && duids.length){
    try{ await pywebview.api.archive_batch_files(b.id, s.seq, s.name, files); }catch(e){}
    try{ await pywebview.api.archive_batch_du_files(b.id, duids, s.seq, s.name, files); }catch(e){}
  }
  // 操作举证：同一张截图保存到批次内每个 DU 归档
  if(pendingEvidence[curId] && duids.length){
    try{ await pywebview.api.save_evidence(duids, s.seq, s.name, pendingEvidence[curId]); }catch(e){ toast('举证保存失败：'+e); }
    delete pendingEvidence[curId];
  }
  for(const w of items){
    w.doneStepIds = w.doneStepIds || [];
    if(!w.doneStepIds.includes(curId)) w.doneStepIds.push(curId);
    w.updatedAt = nowStr();
  }
  workDoneSet = batchCommonDone(f, b);
  const nextId = currentStepId(f);
  selectedStepId = nextId || curId;
  await saveData();
  render();
  toast(nextId ? '✅ 完成「'+(s?s.name:'本步')+'」，进入下一步' : '🎉 本批次全部节点已完成！');
}

function renderBatchBody(f, b){
  const items = (f.workItems||[]).filter(w=>w.batchId===b.id);
  const detached = (f.workItems||[]).filter(w=>isDetached(w) && w.sourceBatchId===b.id);
  const filter = workFilter.trim().toLowerCase();
  const statusFilter = workStatusFilter;
  const match = w=>{
    if(filter && !w.duid.toLowerCase().includes(filter)) return false;
    if(statusFilter && workItemStatusLabel(f,w)!==statusFilter) return false;
    return true;
  };
  const show = items.filter(match);
  const detachedShow = detached.filter(match);
  const statusOpts = ['', '进行中', '等待批量', '已完成', '拆出'].map(s=>`<option value="${s}"${s===statusFilter?' selected':''}>${s||'全部状态'}</option>`).join('');
  return `<div class="bc-body">
    <div class="work-filter"><span>🔍</span><input placeholder="筛选 DUID…" value="${esc(workFilter)}" oninput="onWorkFilter(this.value)">
      <select onchange="onWorkStatusFilter(this.value)">${statusOpts}</select>
    </div>
    <div class="sec-head"><h2>批次内 DUID</h2><span class="count">${show.length} / ${items.length}</span></div>
    <div class="work-item-list">${show.map(w=>workItemRow(f,w)).join('') || '<div class="empty">没有匹配的 DUID</div>'}</div>
    ${detached.length ? `<div class="sec-head" style="margin-top:20px"><h2>已拆出 DUID</h2><span class="count">${detached.length}</span></div>
      <div class="work-item-list">${detachedShow.map(w=>workItemRow(f,w)).join('') || '<div class="empty">没有匹配的 DUID</div>'}</div>` : ''}
  </div>`;
}

function collectStepFiles(f, s){
  if(!s) return [];
  const out = [];
  for(const it of (s.input && s.input.items) || []){
    if(it.kind === 'file'){
      const tmp = getTempFile(f, s.id, it.id);
      const file = tmp || it.file;
      if(file && file.path) out.push({name: file.name || (file.path||'').split('/').pop(), rel: file.path});
    }
  }
  for(const o of (s.output && s.output.results) || []) out.push({name: o.name, rel: o.rel});
  if(s.screenshot) out.push({name: (s.screenshot||'').split('/').pop(), rel: s.screenshot});
  const seen = new Set();
  return out.filter(x=>{ if(!x.rel || seen.has(x.rel)) return false; seen.add(x.rel); return true; });
}

function renderWorkItem(app, f, w){
  workDoneSet = new Set(w.doneStepIds || []);
  const curId = currentStepId(f);

  if(!selectedStepId || !f.steps.some(s=>s.id===selectedStepId)){

  }
  const sel = f.steps.find(s=>s.id===selectedStepId) || f.steps[0];
  const cur = curId ? f.steps.find(s=>s.id===curId) : null;

  const progressRow = cur
    ? `<div class="progress-row">

        <div class="progress-acts"><button class="btn btn-primary" onclick="completeWorkStep('${w.id}')">✅ 完成本步，下一步</button><button class="btn btn-ghost" onclick="openRerunNodes()">↺ 重跑节点</button></div>
      </div>`
    : `<div class="progress-row">
        <div class="flow-done-tip">🎉 该 DUID 已全部完成</div>
        <div class="progress-acts"><button class="btn btn-ghost" onclick="resetWorkItem('${w.id}')">↺ 重新开始</button><button class="btn btn-ghost" onclick="openRerunNodes()">↺ 重跑节点</button></div>
      </div>`;
  const status = workItemStatusLabel(f, w);
  app.innerHTML = `
    <div class="back" onclick="backToBatch()">← 返回批次列表</div>
    ${renderFlowTabs(f)}
    <div class="work-item-head">
      <div class="wih-icon">📦</div>
      <div class="wih-main">
        <div class="wih-name">${esc(w.duid)} <span class="wi-status ws-${status==='已完成'?'done':(status==='等待批量'?'wait':'doing')}">${status}</span></div>
        <div class="wih-sub">${cur ? '当前：'+esc(cur.name) : '全部完成'} · ${isDetached(w)?'拆出独立':'批次作业'}${w.remark?' · 📝 '+esc(w.remark):''}</div>
      </div>
      <div class="acts"><button class="btn btn-ghost btn-sm" onclick="exportWorkRecord('${w.id}')">📥 导出记录</button><button class="btn btn-ghost btn-sm" onclick="remarkWorkItem('${w.id}')">📝 备注</button></div>
    </div>
    ${renderFlowBar(f)}
    ${progressRow}
    ${sel ? renderConsole(f, sel) : '<div class="empty"><div class="big">🎉</div>该 DUID 的全部节点已完成。</div>'}`;
  if(sel){ setupInputItemDropZones(sel.id); }
}

/* ===== 作业清单交互 ===== */
function openNewBatch(){ newBatchName=''; newBatchText=''; duidPreview=[]; newBatchOpen=true; render(); }
function cancelNewBatch(){ newBatchName=''; newBatchText=''; duidPreview=[]; newBatchOpen=false; render(); }
function toggleDuidPreview(i){ if(duidPreview[i] && !duidPreview[i].dup){ duidPreview[i].keep = !duidPreview[i].keep; render(); } }
async function previewDuids(){
  const text = (document.getElementById('nb_text')||{}).value || '';
  newBatchText = text;
  newBatchName = (document.getElementById('nb_name')||{}).value || '';
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  let r;
  try{ r = await pywebview.api.parse_duids(text); }catch(e){ r = {ok:false, error:String(e)}; }
  if(!r || !r.ok){ toast('解析失败：' + (r && r.error)); return; }
  const existing = new Set((f.workItems||[]).map(w=>w.duid));
  const seen = new Set();
  duidPreview = (r.duids||[]).map(d=>{
    const dup = existing.has(d) || seen.has(d);
    seen.add(d);
    return {duid:d, keep:!dup, dup:dup};
  });
  render();
}
async function confirmCreateBatch(){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  const name = ((document.getElementById('nb_name')||{}).value||'').trim() || (nowStr() + '批次');
  const kept = duidPreview.filter(d=>d.keep).map(d=>d.duid);
  if(!kept.length){ toast('请先粘贴并预览 DUID，至少保留一个'); return; }
  f.batches = f.batches || [];
  f.workItems = f.workItems || [];
  let n = maxIdNum();
  const bid = 'B' + String(++n).padStart(3,'0');
  const now = nowStr();
  f.batches.push({id:bid, name:name, createdAt:now});
  let added = 0;
  for(const duid of kept){
    if(f.workItems.some(w=>w.duid===duid)) continue;
    let folder = '';
    try{ const r = await pywebview.api.create_work_folder(duid); if(r&&r.ok) folder = r.folder; }catch(e){}
    f.workItems.push({id:'W'+String(++n).padStart(3,'0'), duid:duid, batchId:bid, sourceBatchId:null, remark:'', folder:folder, doneStepIds:[], records:[], createdAt:now, updatedAt:now});
    added++;
  }
  newBatchOpen=false; newBatchName=''; newBatchText=''; duidPreview=[];
  workView='list'; currentBatchId=null; workFilter=''; workStatusFilter='';
  expandedBatches.add(bid);
  await saveData();
  render();
  toast('已创建批次「'+name+'」，导入 '+added+' 个 DUID');
}
async function deleteBatch(batchId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  const b = (f.batches||[]).find(x=>x.id===batchId);
  // 同时纳入「拆出但仍归属该批次」的 DUID（batchId=null 但 sourceBatchId===batchId），一并删除，避免留下孤儿导致下次导入误判重复
  const items = (f.workItems||[]).filter(w=>w.batchId===batchId || w.sourceBatchId===batchId);
  showConfirm(`删除批次「${b?b.name:''}」？批次内 ${items.length} 个 DUID 作业项一并删除（文件夹移到回收站）。`, async function(){
    for(const w of items){ try{ await pywebview.api.remove_work_folder(w.duid); }catch(e){} }
    f.workItems = (f.workItems||[]).filter(w=>w.batchId!==batchId && w.sourceBatchId!==batchId);
    f.batches = (f.batches||[]).filter(x=>x.id!==batchId);
    expandedBatches.delete(batchId);
    workView='list'; currentBatchId=null; currentWorkItemId=null;
    await saveData(); render(); toast('已删除批次');
  });
}
function backToWorkList(){ workView='list'; currentBatchId=null; currentWorkItemId=null; workDoneSet=null; render(); }
function onWorkFilter(v){ workFilter=v; render(); }
function openWorkItem(workItemId){ workView='item'; currentWorkItemId=workItemId; selectedStepId=null; render(); }
function backToBatch(){
  const f = DATA.flows.find(x=>x.id===currentFlowId);

async function deleteWorkItem(workItemId){

async function resetWorkItem(workItemId){

// 选择节点重新运行：清空选中节点的完成结果，作业从最早的选中节点继续
function openRerunNodes(){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  if(!f || !f.steps || !f.steps.length){ toast('还没有节点'); return; }
  const steps = f.steps;
  const doneSet = workDoneSet || new Set();
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal" style="width:480px;max-height:72vh;overflow:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 style="margin:0">↺ 选择要重新运行的节点</h3>
      <button class="btn btn-ghost btn-sm" id="rrAll">全选</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px" id="rrList">
      ${steps.map(s=>`
        <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;cursor:pointer;background:${doneSet.has(s.id)?'#f8fafc':'#fff'}">
          <input type="checkbox" value="${esc(s.id)}" ${doneSet.has(s.id)?'checked':''}>
          <span style="flex:1;font-size:14px">${String(s.seq).padStart(2,'0')} · ${esc(s.name)}</span>
          ${doneSet.has(s.id)?'<em style="font-style:normal;font-size:12px;color:#10b981">已完成</em>':''}
        </label>`).join('')}
    </div>
    <div style="font-size:12px;color:#94a3b8;margin-bottom:6px">选中的节点会清空完成结果及对应归档文件，作业从最早的选中节点继续。</div>
    <div class="btn-row" style="margin-top:6px">
      <button class="btn btn-primary" id="rrOk">确定重跑</button>
      <button class="btn btn-ghost" id="rrCancel">取消</button>
    </div></div>`;
  document.body.appendChild(m);
  document.getElementById('rrCancel').onclick = function(){ m.remove(); };
  document.getElementById('rrAll').onclick = function(){
    const boxes = [...m.querySelectorAll('#rrList input')];
    const all = boxes.every(b=>b.checked);
    boxes.forEach(b=>b.checked = !all);
    this.textContent = all ? '全选' : '全不选';
  };
  document.getElementById('rrOk').onclick = function(){
    const ids = [...m.querySelectorAll('#rrList input:checked')].map(x=>x.value);
    m.remove();
    if(!ids.length){ toast('未选择节点'); return; }
    rerunNodes(ids);
  };
}
async function rerunNodes(stepIds){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  if(!f) return;
  const ids = new Set(stepIds);
  ids.forEach(id => delete pendingEvidence[id]);  // 清掉选中节点的未保存举证
  let earliest = null;
  const stepObjs = [];
  for(const s of (f.steps||[])){
    if(ids.has(s.id) && (!earliest || (s.seq||0) < (earliest.seq||0))) earliest = s;
    if(ids.has(s.id)) stepObjs.push({seq:s.seq, name:s.name});
  }
  if(workView === 'flow' && currentBatchId){
    const b = (f.batches||[]).find(x=>x.id===currentBatchId);
    if(b){
      for(const w of (f.workItems||[]).filter(w=>w.batchId===b.id)){
        w.doneStepIds = (w.doneStepIds||[]).filter(x=>!ids.has(x));
        w.records = (w.records||[]).filter(r=>!ids.has(r.stepId));
        w.updatedAt = nowStr();
      }
      workDoneSet = batchCommonDone(f, b);
    }
    try{ await pywebview.api.clear_step_archive(stepObjs, currentBatchId, null); }catch(e){}
  } else if(workView === 'item' && currentWorkItemId){
    const w = (f.workItems||[]).find(x=>x.id===currentWorkItemId);
    if(w){
      w.doneStepIds = (w.doneStepIds||[]).filter(x=>!ids.has(x));
      w.records = (w.records||[]).filter(r=>!ids.has(r.stepId));
      w.updatedAt = nowStr();
      workDoneSet = new Set(w.doneStepIds);
      try{ await pywebview.api.clear_step_archive(stepObjs, null, w.duid); }catch(e){}
    }
  }
  if(earliest) selectedStepId = earliest.id;
  await saveData();
  render();
  toast('✅ 已清空 '+stepIds.length+' 个节点结果及归档'+(earliest?'，从「'+earliest.name+'」继续':''));
}
async function completeWorkStep(workItemId){
  const f = DATA.flows.find(x=>x.id===currentFlowId);
  const w = (f.workItems||[]).find(x=>x.id===workItemId);
  if(!w) return;
  const curId = currentStepId(f);
  if(!curId){ toast('🎉 该 DUID 已全部完成'); return; }
  const s = f.steps.find(x=>x.id===curId);
  // 归档本步产出文件（输入文件 + 输出结果 + 截图）
  const files = collectStepFiles(f, s);
  if(files.length){
    try{ await pywebview.api.archive_work_files(w.duid, s.seq, s.name, files); }catch(e){ toast('归档警告：'+e); }
  }
  // 操作举证：粘贴的截图随「完成本步」保存到该 DU 归档
  if(pendingEvidence[curId]){
    try{ await pywebview.api.save_evidence([w.duid], s.seq, s.name, pendingEvidence[curId]); }catch(e){ toast('举证保存失败：'+e); }
    delete pendingEvidence[curId];
  }
  w.doneStepIds = w.doneStepIds || [];
  if(!w.doneStepIds.includes(curId)) w.doneStepIds.push(curId);
  w.records = w.records || [];
  w.records.push({seq:s.seq, stepId:s.id, stepName:s.name, doneAt:nowStr(), files:files.map(x=>x.name)});
  w.updatedAt = nowStr();
  workDoneSet = new Set(w.doneStepIds);
  // 完成后推进到下一个节点（对齐批次作业 completeBatchStep 的 selectedStepId 推进逻辑）
  const nextId = currentStepId(f);
  selectedStepId = nextId || curId;
  await saveData();
  render();
  toast('✅ 完成「'+s.name+'」，已归档到 '+(w.folder||'DUID 文件夹'));
}


async function buildToolArgs(s){
  const f = flowOfStep(s.id);
  const cfg = (s.tool && s.tool.config) || [];
  const args = [];
  const missing = [];
  for(const c of cfg){
    // 「DUID 清单」动态输入项：批次作业时生成动态清单；非批次上下文跳过（不报 missing）
    if(c.itemId === '__duid_list__'){
      const p = await getDuidListPath(s);
      if(p) args.push('--'+c.id, p);
      continue;
    }
    if(c.itemId && c.itemId.startsWith('pf_')){
      const pid = c.itemId.slice(3);
      try{
        const r = await pywebview.api.make_platform_config_file(pid);
        if(r && r.ok && r.path) args.push('--'+c.id, r.path);
        else missing.push('平台凭证(' + ((r && r.name) || pid) + ')');
      }catch(e){ missing.push('平台凭证'); }
      continue;
    }
    const alias = toolRefLabel(s, c) || c.id || '输入';
    const ref = resolveToolInputRef(f, s, c);
    if(!ref || !ref.path){ missing.push(alias); continue; }
    let abs = null;
    try{
      const r = await pywebview.api.resolve_file(ref.path);
      if(r && r.path) abs = r.path;
    }catch(e){}
    if(!abs){ missing.push(alias); continue; }
    args.push('--'+c.id, abs);
  }
  return {args, missing};
}

// 单 DUID 作业视图：若工具声明了单 DUID 参数（tool.json 的 duid_param），
// 自动追加 --<duid_param> <当前DUID>，让工具只处理当前 DUID。
async function buildDuidArg(s){
  if(!(workView === 'item' && currentWorkItemId)) return null;
  if(!s || !s.tool) return null;
  const f = flowOfStep(s.id);
  const w = ((f && f.workItems) || []).find(x=>x.id === currentWorkItemId);
  if(!w || !w.duid) return null;
  let m = null;
  try{ m = await pywebview.api.get_tool_manifest(s.tool.name); }catch(e){ m = null; }
  if(m && m.duid_param){ return ['--' + m.duid_param, w.duid]; }
  return null;
}

// 批次作业流视图：生成「当前批次剩余 DUID」清单文件，返回绝对路径；
// 供工具参数映射里关联了「DUID 清单（__duid_list__）」的动态参数使用。
// 拆出的 DUID（batchId=null）由后端自动排除。
// 单 DUID 作业视图（workView==='item'）：生成「仅当前 DUID」的清单文件。
async function getDuidListPath(s){
  const f = s ? flowOfStep(s.id) : null;
  if(!f) return null;
  if(workView === 'flow' && currentBatchId){
    const b = (f.batches || []).find(x=>x.id === currentBatchId);
    if(!b) return null;
    try{
      const r = await pywebview.api.make_duid_list(f.id, b.id);
      return (r && r.ok && r.path) ? r.path : null;
    }catch(e){ return null; }
  }
  if(workView === 'item' && currentWorkItemId){
    const w = (f.workItems || []).find(x=>x.id === currentWorkItemId);
    if(!w || !w.duid) return null;
    try{
      const r = await pywebview.api.make_single_duid_list(w.duid);
      return (r && r.ok && r.path) ? r.path : null;
    }catch(e){ return null; }
  }
  return null;
}

function renderToolOutputs(res){
  const outs = (res && res.outputs) || [];
  if(!outs.length) return '';
  return outs.map(o=>`<div class="io-file" onclick="previewFile('${esc(o.rel)}')" title="点击预览">📄 ${esc(o.name)}</div>`).join('');
}

async function runTool(stepId){
  const s = findStep(stepId);
  if(!s || !s.tool) return;
  const btn = document.getElementById('runbtn-'+stepId);
  const box = document.getElementById('logbox-'+stepId);
  const body = document.getElementById('logbody-'+stepId);
  const empty = document.getElementById('logempty-'+stepId);
  if(!btn || !box || !body) return;
  if(empty) empty.style.display = 'none';
  btn.disabled = true; btn.textContent = '⏳ 运行中…';
  box.style.display = 'block';
  body.innerHTML = '<span style="color:#94a3b8">正在准备输入文件…</span>';

  const prep = await buildToolArgs(s);
  const duidArg = await buildDuidArg(s);
  if(duidArg) prep.args.push(...duidArg);
  if(prep.missing && prep.missing.length){
    btn.disabled = false; btn.textContent = '▶ 运行';
    body.innerHTML = '<div class="log-status err">❌ 缺少输入文件：' + esc(prep.missing.join('、')) + '</div>';
    return;
  }

  body.innerHTML = '<span style="color:#94a3b8">正在运行 ' + esc(s.tool.name) + ' …</span>';
  let res;
  try{ res = await pywebview.api.run_tool(s.tool.name, prep.args); }
  catch(e){ res = {ok:false, log:'调用失败：'+e}; }
  btn.disabled = false; btn.textContent = '▶ 运行';
  body.innerHTML = renderRunResult(res);
  // 输出结果文件放到「输出结果」模块（输出区），日志只留文字
  const outResultBody = document.getElementById('outresultbody-'+stepId);
  if(outResultBody) outResultBody.innerHTML = renderToolOutputs(res) || '<div class="sub">（工具未产生输出文件）</div>';
  // 持久化运行结果：工具跑完（有 outputs 数组）就存到节点，供「完成本步」后保留、下一步自动引用
  if(res && Array.isArray(res.outputs)){
    if(!s.output) s.output = {};
    s.output.results = res.outputs.map(o=>({name:o.name, rel:o.rel}));
    await saveData();
    // 运行完成且有结果 → 自动展示数据预览（优先 Excel，其次 CSV/文本，再图片，最后取第一个）
    if(res.outputs.length){
      const o = res.outputs.find(x=>/\.(xlsx|xlsm)$/i.test(x.name||x.rel||''))
             || res.outputs.find(x=>/\.(csv|txt|log|md|json)$/i.test(x.name||x.rel||''))
             || res.outputs.find(x=>/\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(x.name||x.rel||''))
             || res.outputs[0];
      if(o && (o.rel || o.name)) await previewFile(o.rel || o.name, stepId);
    }
    // 生成「返回消息数据」：按模板 + 筛选条件从结果表格里筛值拼消息
    if(s.msgTemplate && s.msgTemplate.trim()) await buildNodeMessage(s, res);
  }
}

async function buildNodeMessage(s, res){
  const out = document.getElementById('msgout-'+s.id);
  if(!out) return;
  const outs = res && res.outputs ? res.outputs : [];
  const tbl = outs.find(x=>/\.(xlsx|xlsm|csv)$/i.test(x.name||x.rel||'')) || outs[0];
  if(!tbl){
    out.innerHTML = '<span class="log-status err">没有表格类结果文件（仅 Excel/CSV 能生成消息）</span>';
    return;
  }
  let r;
  try{
    r = await pywebview.api.build_message(tbl.rel || tbl.name, s.msgTemplate, s.msgFilter || '');
  }catch(e){ r = {ok:false, error:'调用失败：'+e}; }
  if(r && r.ok){
    const msg = r.message || '';
    msgCache[s.id] = msg;
    out.innerHTML = msg
      ? `<div class="msg-text">${esc(msg).replace(/\n/g,'<br>')}</div>`
      : '<span class="sub">（筛选没有匹配到任何行）</span>';
  } else {
    out.innerHTML = '<span class="log-status err">生成消息失败：'+esc((r&&r.error)||'未知错误')+'</span>';
  }
}

      // 该节点已配过此工具：直接用已存槽位（兼容旧 source/refId → 新 ref.type/nodeId/itemId）
      toolCfgDrafts = existing.map(c=>{

        if(itemId == null && c.ref && c.ref.itemId) itemId = c.ref.itemId;
        return { id: c.id||'', itemId: itemId || null };
      });
    } else if(toolManifest && toolManifest.inputs && toolManifest.inputs.length){
      // 有声明文件：自动预填槽位（便利），使用者再关联到本节点输入项
      toolCfgDrafts = toolManifest.inputs.map(inp=>({ id: inp.id, itemId: null }));

document.addEventListener('paste', function(e){
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type.indexOf('image')!==-1){
      if(view==='record'){
        processImage(it.getAsFile());
      } else if(view==='flow' && evidenceTargetStepId){
        processEvidence(it.getAsFile(), evidenceTargetStepId);
      } else {
        continue;
      }
      e.preventDefault();
      return;
    }
  }
});
function processImage(file){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 1920; // 保留全高清截图原尺寸，放大后更清晰
      const scale = Math.min(1, maxW/img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.92);
      if(shotTargetIndex >= 0 && stepDrafts[shotTargetIndex]){
        // 贴到指定步骤
        stepDrafts[shotTargetIndex].shotDataUrl = dataUrl;
        renderStepList();
        toast('✅ 截图已贴到第 ' + (shotTargetIndex+1) + ' 步');
      } else {
        // 节点级截图（旧行为）
        shotDataUrl = dataUrl;
        shotPreview = dataUrl;
        const box = document.getElementById('f_shot');
        if(box){ box.classList.add('pasted'); box.innerHTML = `<img src="${dataUrl}">`; }
        toast('✅ 截图已添加');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveNode(){
  const fid = document.getElementById('f_flow').value;
  const flow = DATA.flows.find(f=>f.id===fid);
  if(!flow){ toast('请先创建流程'); return; }
  const name = document.getElementById('f_name').value.trim();
  const brief = document.getElementById('f_brief').value.trim();
  const out = document.getElementById('f_out').value.trim();
  const rawSteps = stepDrafts.map(st=>st.text.trim()).filter(Boolean);
  if(!name||!rawSteps.length||!out){ toast('请填节点名称、操作指导、输出'); return; }

  const inText = document.getElementById('f_in_text').value.trim();
  const items = inputItemDrafts
    .filter(it => (it.name && it.name.trim()) || (it.kind !== 'file' && it.refId) || it.required || it.kind === 'duidlist')
    .map(it => {
      const item = { id: it.id, name: (it.name || '').trim(), required: !!it.required, kind: it.kind };
      if(it.kind === 'file'){
        item.file = null;  // 临时拖入：文件只存作业上下文（批次/DUID），不存框架
      } else {
        item.refId = it.refId || null;
        item.refLabel = null;
        if(it.kind === 'checklist'){
          const c = findChecklistItem(flow, it.refId);
          if(c) item.refLabel = c.name;
        } else if(it.kind === 'node'){
          const t = findStep(it.refId);
          if(t) item.refLabel = t.name;
          item.refFile = it.refFile || null;  // 引用节点输出时选中的具体文件
        }
      }
      return item;
    });
  const input = { text: inText, items: items };

  const filesStr = document.getElementById('f_files').value.trim();
  const files = filesStr? filesStr.split(/[,，]/).map(x=>x.trim()).filter(Boolean).map(n=>({name:n})) : [];
  const toolName = document.getElementById('f_tool').value;
  let tool = toolName ? { name: toolName } : null;
  if(tool){
    const config = toolCfgDrafts
      .filter(c => c.id && String(c.id).trim())
      .map(c=>({ id: String(c.id).trim(), itemId: c.itemId || null }));
    if(config.length) tool.config = config;
  }

  // 截图：节点级 + 每步截图批量存盘
  let screenshot = shotExistingPath || null;
  if(shotDataUrl){
    try{
      const r = await pywebview.api.save_screenshot(shotDataUrl);
      if(r && r.ok) screenshot = r.path;
    }catch(e){}
  }
  const steps = [];
  for(const st of stepDrafts){
    let shot = st.shotPath || '';
    if(st.shotDataUrl){
      try{
        const r = await pywebview.api.save_screenshot(st.shotDataUrl);
        if(r && r.ok) shot = r.path;
      }catch(e){}
    }
    if(st.text.trim() || shot){
      steps.push({ text: st.text.trim(), shot: shot || null });
    }
  }
  const desc = rawSteps.join('\n');

  const tag = document.getElementById('f_tag').value;
  const urls = urlDrafts
    .filter(u => (u.url||'').trim())
    .map(u => ({ name: (u.name||'').trim(), url: (u.url||'').trim() }));
  let dataCard = null;
  if(tag==='web'){
    const dcSource = document.getElementById('f_dc_source').value;
    if(dcSource==='ref-out' || dcSource==='ref-in'){
      const refId = document.getElementById('f_dc_ref').value;
      dataCard = { source: dcSource, refId: refId || null };
    } else {
      dataCard = parseDataCard(document.getElementById('f_datacard').value);
    }
  }

  const node = {
    name, brief, desc, input, output:{type:'text', text:out, files: outputFileDrafts.map(f=>({id:f.id, name:f.name, path:f.path}))},
    note: document.getElementById('f_note').value.trim(),
    screenshot, tool, files, tag, urls, dataCard, steps,
    execMode: document.getElementById('f_execmode') ? document.getElementById('f_execmode').value : 'single',
    msgFilter: document.getElementById('f_msg_filter') ? document.getElementById('f_msg_filter').value.trim() : '',
    msgTemplate: document.getElementById('f_msg_template') ? document.getElementById('f_msg_template').value.trim() : ''
  };

  if(editNodeId){
    const src = flowOfStep(editNodeId);
    const idx = src.steps.findIndex(s=>s.id===editNodeId);
    node.id = editNodeId; node.seq = src.steps[idx].seq;
    src.steps[idx] = node;
  } else {
    node.id = 'N' + String(nextId()).padStart(3,'0');
    const afterIdx = (insertAfterId && flow.steps.some(s=>s.id===insertAfterId))
      ? flow.steps.findIndex(s=>s.id===insertAfterId)
      : -1;
    if(afterIdx >= 0) flow.steps.splice(afterIdx + 1, 0, node);
    else flow.steps.push(node);
    // 插入后统一重排序号
    flow.steps.forEach((s, i)=>{ s.seq = i + 1; });
  }
  // 消息模板/筛选已更新，清掉旧缓存（否则作业视图还会显示改动前的消息）
  msgCache[node.id] = '';
  await saveData();
  toast('✅ 已保存到「'+flow.name+'」');
  view='flow'; currentFlowId=fid; searchTerm=''; selectedStepId=node.id; document.getElementById('searchInput').value=''; render();
}
function nextId(){
  const ids = allSteps().map(s=>parseInt(String(s.id).replace(/\D/g,''))||0);
  return ids.length? Math.max(...ids)+1 : 1;
}
function cancelRecord(){ view='flow'; render(); }

async function saveData(){
  try{ await pywebview.api.save_data(DATA); }
  catch(e){ toast('⚠️ 保存失败：'+e); }
}

/* ================= 删除 / 新建 ================= */
function deleteNode(id){
  const f = flowOfStep(id);
  const s = f.steps.find(x=>x.id===id);
  showConfirm(`删除节点「${s.name}」？`, async function(){
    f.steps = f.steps.filter(x=>x.id!==id);
    f.steps.forEach((x,i)=>x.seq=i+1);
    cleanupOrphanRefs(f);
    await saveData(); render(); toast('已删除');
  });
}
function deleteFlow(id){
  const f = DATA.flows.find(x=>x.id===id);
  showConfirm(`删除整个流程「${f.name}」及其 ${f.steps.length} 个节点？`, async function(){
    DATA.flows = DATA.flows.filter(x=>x.id!==id);
    await saveData(); goHome(); toast('已删除流程');
  });
}
function newFlow(){
  showPrompt('新建流程', '流程名称', async function(name){
    if(!name) return;
    const flow = { id:'f'+Date.now(), name:name, icon:'📌', color:'#5b6cff', goal:'', steps:[] };
    DATA.flows.push(flow);
    await saveData();
    openFlow(flow.id);
    toast('已创建流程「'+flow.name+'」');
  });
}

/* ================= 顶栏动作 ================= */
async function exportExcel(){
  try{
    const r = await pywebview.api.export_excel(DATA);
    if(r && r.ok) toast('✅ 已导出：'+r.path);
    else toast('❌ 导出失败：'+(r&&r.error));
  }catch(e){ toast('❌ 导出失败：'+e); }
}

async function exportWorkRecord(workItemId){
  const f = DATA.flows.find(x=>x.workItems && x.workItems.some(w=>w.id===workItemId));
  if(!f) return;
  try{
    const r = await pywebview.api.export_work_record(f.id, workItemId);
    if(r && r.ok) toast('✅ 作业记录已导出：'+r.path);
    else toast('❌ 导出失败：'+(r&&r.error));
  }catch(e){ toast('❌ 导出失败：'+e); }
}
async function openDataDir(){ try{ await pywebview.api.open_data_dir(); }catch(e){} }
async function openToolsDir(){ try{ await pywebview.api.open_tools_dir(); }catch(e){} }

/* ================= 通用弹窗 ================= */
function showConfirm(msg, onOk){
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal"><h3>${esc(msg)}</h3>
    <div class="btn-row" style="margin-top:6px">
      <button class="btn btn-primary" id="mOk">确定</button>
      <button class="btn btn-ghost" id="mCancel">取消</button>
    </div></div>`;
  document.body.appendChild(m);
  document.getElementById('mOk').onclick = function(){ m.remove(); onOk(); };
  document.getElementById('mCancel').onclick = function(){ m.remove(); };
}
function showPrompt(title, placeholder, onOk){
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>
    <div class="field"><input type="text" id="mInput" placeholder="${esc(placeholder)}"></div>
    <div class="btn-row" style="margin-top:6px">
      <button class="btn btn-primary" id="mOk">确定</button>
      <button class="btn btn-ghost" id="mCancel">取消</button>
    </div></div>`;
  document.body.appendChild(m);
  const input = document.getElementById('mInput');
  input.focus();
  function done(){ const v = input.value.trim(); m.remove(); onOk(v); }
  document.getElementById('mOk').onclick = done;
  document.getElementById('mCancel').onclick = function(){ m.remove(); };
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') done(); });
}

/* ================= 启动 ================= */
window.addEventListener('pywebviewready', async function(){
  try{ DATA = await pywebview.api.load_data(); }
  catch(e){ DATA = null; }
  if(DATA){
    let cleaned = 0;
    for(const fl of (DATA.flows||[])) cleaned += cleanupOrphanWorkItems(fl);
    if(cleaned > 0){ try{ await pywebview.api.save_data(DATA); }catch(e){} }
  }
  render();
});
render();
</script>
