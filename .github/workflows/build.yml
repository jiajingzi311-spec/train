name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SleepTimer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SleepTimer-apk
          path: SleepTimer.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sleep-timer-v1
          name: 睡前定时熄屏 v1
          target_commitish: ${{ github.sha }}
          body: 手机上点下面的 SleepTimer.apk 直接下载安装。
          files: SleepTimer.apk
