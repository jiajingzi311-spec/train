name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GoodNightMoon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoodNightMoon-apk
          path: GoodNightMoon.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moon-v${{ github.run_number }}
          name: 晚安小月亮 v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: 手机上点下面的 GoodNightMoon.apk 直接下载安装。
          make_latest: true
          files: GoodNightMoon.apk
