plugins {
    id 'com.android.application'
}

android {
    namespace 'com.milo.sleeptimer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.milo.sleeptimer'
        minSdk 28
        targetSdk 34
        versionCode 5
        versionName '5.0'
    }

    // 固定签名：以后更新版本可以直接覆盖安装，不用先卸载
    signingConfigs {
        moon {
            storeFile file('moon.keystore')
            storePassword 'goodnightmoon'
            keyAlias 'moon'
            keyPassword 'goodnightmoon'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.moon
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.moon
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
